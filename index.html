22","q":"明排法适用条件？","a":"不易产生流砂流土潜蚀管涌的黏性土砂土碎石土地层；地下水位超出底板≤**2.0**m","sec":"第1章·勘测设计","sub":"基坑工程"},{"id":"r0023","q":"管井降水适用条件是什么？","a":"①第四系含水层厚度>5.0m；②渗透系数K宜>1.0m/d（两条件同时满足）","sec":"第1章·勘测设计","sub":"基坑工程"},{"id":"r0024","q":"水利水电工程等别划分为几等？依据什么标准？","a":"Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ五等，依据SL252-2017《水利水电工程等级划分及洪水标准》","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0025","q":"Ⅰ等工程（大1型）水库总库容标准是什么？","a":"≥10亿m³","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0026","q":"Ⅰ等工程（大1型）发电装机容量标准？","a":"≥1200MW","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0027","q":"Ⅱ等工程（大2型）水库总库容范围？","a":"1.0~10亿m³","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0028","q":"Ⅲ等工程（中型）水库总库容范围？","a":"0.1~1.0亿m³","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0029","q":"Ⅳ等工程（小1型）水库总库容范围？","a":"0.01~0.10亿m³","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0030","q":"Ⅴ等工程（小2型）水库总库容范围？","a":"0.001~0.01亿m³","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0031","q":"水工建筑物级别如何划分？","a":"根据所属工程等别及其在工程中的作用和重要性划分为1~5级","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0032","q":"水库特征水位从低到高？","a":"死水位→正常蓄水位→防洪限制水位→防洪高水位→设计洪水位→校核洪水位","sec":"第1章·勘测设计","sub":"特征水位"},{"id":"r0033","q":"死水位的含义？","a":"水库在正常运行情况下允许消落的最低水位","sec":"第1章·勘测设计","sub":"特征水位"},{"id":"r0034","q":"正常蓄水位的含义？","a":"水库在正常运行情况下为满足兴利要求应蓄到的最高水位","sec":"第1章·勘测设计","sub":"特征水位"},{"id":"r0035","q":"校核洪水位的含义？","a":"水库遇到校核洪水时允许达到的最高水位","sec":"第1章·勘测设计","sub":"特征水位"},{"id":"r0036","q":"特征库容有哪些？","a":"静库容、动库容、总库容、防洪库容、调洪库容、兴利库容、死库容","sec":"第1章·勘测设计","sub":"特征库容"},{"id":"r0037","q":"工程合理使用年限取决于什么？","a":"工程等别和建筑物级别","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0038","q":"预应力混凝土构件最低强度等级？最小水泥用量？","a":"不宜低于C40；最小水泥用量≥300kg/m³","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0039","q":"混凝土大坝基础与过流表面混凝土强度等级要求？","a":"基础不低于C15，过流表面不低于C30","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0040","q":"影响混凝土强度的主要因素有哪些？","a":"水胶比（最主要）、骨料品质、龄期、养护温度湿度、施工质量","sec":"第1章·勘测设计","sub":"建筑材料"},{"id":"r0041","q":"水泥检验的主要指标有哪些？","a":"安定性、凝结时间、强度、细度、标准稠度用水量","sec":"第1章·勘测设计","sub":"建筑材料"},{"id":"r0042","q":"水工混凝土常用的外加剂有哪些？","a":"减水剂、引气剂、缓凝剂、早强剂、防冻剂、膨胀剂","sec":"第1章·勘测设计","sub":"建筑材料"},{"id":"r0043","q":"渗透系数的物理意义？","a":"表示岩土允许水通过的能力，单位m/d或cm/s","sec":"第1章·勘测设计","sub":"渗流分析"},{"id":"r0044","q":"渗透变形的类型有哪些？","a":"管涌、流土、接触冲刷、接触流失","sec":"第1章·勘测设计","sub":"渗流分析"},{"id":"r0045","q":"管涌和流土的区别？","a":"管涌：细颗粒在粗颗粒孔隙中被水流带走；流土：整个土体被水流冲起","sec":"第1章·勘测设计","sub":"渗流分析"},{"id":"r0046","q":"消能方式有哪些？","a":"底流消能、挑流消能、面流消能、消力戽消能","sec":"第1章·勘测设计","sub":"消能方式"},{"id":"r0047","q":"底流消能适用条件？","a":"低水头、大流量、下游地质条件差","sec":"第1章·勘测设计","sub":"消能方式"},{"id":"r0048","q":"挑流消能适用条件？","a":"中高水头、下游地质条件好","sec":"第1章·勘测设计","sub":"消能方式"},{"id":"r0049","q":"施工导流方式有哪些？","a":"一次拦断法（全段围堰法）和分段围堰法","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0050","q":"一次拦断法适用情况？","a":"河床较窄、流量不大、工期较长","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0051","q":"分段围堰法适用情况？","a":"河床较宽、流量大、分期施工","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0052","q":"辅助导流方式有哪些？","a":"明渠导流、隧洞导流、涵管导流、渡槽导流","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0053","q":"截流方式有哪两种？","a":"立堵法和平堵法","sec":"第2章·水流控制与基础","sub":"截流"},{"id":"r0054","q":"减小截流难度的技术措施？","a":"①减小龙口流量；②加大龙口宽度；③提高抛投材料稳定性","sec":"第2章·水流控制与基础","sub":"截流"},{"id":"r0055","q":"土石围堰的防渗结构形式？","a":"斜墙、心墙、帷幕灌浆、混凝土防渗墙","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0056","q":"围堰接头和防冲措施？","a":"①岸边连接牢固防渗；②堰脚设防冲护底；③上下游设护坡防冲刷","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0057","q":"初期排水包括哪些水？","a":"基坑积水、围堰渗水、降水、地表径流","sec":"第2章·水流控制与基础","sub":"基坑排水"},{"id":"r0058","q":"经常性排水包括哪些？","a":"围堰渗水、降雨汇水、施工弃水","sec":"第2章·水流控制与基础","sub":"基坑排水"},{"id":"r0059","q":"轻型井点与管井井点适用条件？","a":"轻型：K=0.1~50m/d，降水深度≤8m；管井：K=1~200m/d","sec":"第2章·水流控制与基础","sub":"基坑排水"},{"id":"r0060","q":"地基处理方法按原理分类？","a":"开挖置换、排水固结、灌浆、振冲挤密、水泥土搅拌、桩基础","sec":"第2章·水流控制与基础","sub":"地基处理"},{"id":"r0061","q":"灌浆按目的分为哪几种？","a":"固结灌浆、帷幕灌浆、接触灌浆、接缝灌浆、回填灌浆、高压喷射灌浆","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0062","q":"固结灌浆的目的？","a":"提高地基整体强度和抗变形能力，减少不均匀沉降","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0063","q":"帷幕灌浆的目的？","a":"降低渗透性，减少渗流量，形成防渗帷幕","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0064","q":"灌浆结束标准？","a":"在规定压力下，注入率≤1L/min，延续30~60min","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0065","q":"防渗墙施工方法有哪些？","a":"槽孔式防渗墙、桩柱式防渗墙","sec":"第2章·水流控制与基础","sub":"防渗墙"},{"id":"r0066","q":"防渗墙槽孔施工主要工序？","a":"导墙施工→泥浆护壁→造孔→清孔→混凝土浇筑","sec":"第2章·水流控制与基础","sub":"防渗墙"},{"id":"r0067","q":"土石分级按什么标准？共分几级？","a":"按开挖难易分16级（Ⅰ~ⅩⅥ），土为Ⅰ~Ⅳ级，石为Ⅴ~ⅩⅥ级","sec":"第3章·土石方与土石坝","sub":"土石分级"},{"id":"r0068","q":"土方开挖方法有哪些？","a":"人工开挖、机械开挖（推土机、挖掘机、装载机、铲运机等）","sec":"第3章·土石方与土石坝","sub":"土方开挖"},{"id":"r0069","q":"石方开挖方法有哪些？","a":"松动爆破、梯段爆破、预裂爆破、光面爆破、静态破碎","sec":"第3章·土石方与土石坝","sub":"石方开挖"},{"id":"r0070","q":"预裂爆破的目的？","a":"形成预裂缝，控制超挖和减少对保留岩体的损伤","sec":"第3章·土石方与土石坝","sub":"石方开挖"},{"id":"r0071","q":"地下工程施工方法有哪些？","a":"钻爆法、盾构法、TBM法、顶管法、新奥法","sec":"第3章·土石方与土石坝","sub":"地下工程"},{"id":"r0072","q":"土石坝填筑碾压试验的目的？","a":"确定压实参数：铺土厚度、碾压遍数、最优含水率、压实遍数","sec":"第3章·土石方与土石坝","sub":"碾压试验"},{"id":"r0073","q":"土石坝填筑施工的主要工序？","a":"测量放样→基础清理→铺料→平料→洒水→碾压→质检","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0074","q":"土石坝碾压方向要求？","a":"平行于坝轴线方向碾压，相邻碾压带重叠10~20cm","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0075","q":"土石坝的施工质量控制指标？","a":"压实度、含水率、干密度、孔隙率","sec":"第3章·土石方与土石坝","sub":"质量控制"},{"id":"r0076","q":"土石坝土料压实度标准？","a":"1~2级坝≥98%；3级坝≥96%；4~5级坝≥95%","sec":"第3章·土石方与土石坝","sub":"质量控制"},{"id":"r0077","q":"堆石料检测方法？","a":"灌水法或灌砂法，试坑直径≥料径2~3倍","sec":"第3章·土石方与土石坝","sub":"质量控制"},{"id":"r0078","q":"面板堆石坝由哪些部分组成？","a":"面板、趾板、垫层区、过渡区、主堆石区、次堆石区","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0079","q":"面板堆石坝坝体填筑顺序？","a":"先填主堆石区，再下游次堆石区，最后垫层区","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0080","q":"面板堆石坝的面板施工工序？","a":"测量放样→绑扎钢筋→支立模板→混凝土浇筑→养护→接缝止水施工","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0081","q":"面板堆石坝趾板的作用？","a":"连接面板与地基，形成完整的防渗体系","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0082","q":"混凝土拌合设备生产能力取决于什么？","a":"拌合机容量、台数、拌合时间","sec":"第4章·混凝土与混凝土坝","sub":"混凝土生产"},{"id":"r0083","q":"混凝土运输方案有哪些？","a":"水平运输（自卸汽车、皮带机、混凝土罐车）+ 垂直运输（门机、塔机、缆机、泵送）","sec":"第4章·混凝土与混凝土坝","sub":"混凝土运输"},{"id":"r0084","q":"混凝土浇筑的主要工序？","a":"基础处理→模板支立→钢筋绑扎→混凝土入仓→平仓振捣→养护","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0085","q":"混凝土振捣方式有哪几种？","a":"插入式振捣（最常用）、表面振捣、附着式振捣","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0086","q":"混凝土浇筑允许间歇时间取决于什么？","a":"水泥品种、气温、外加剂种类，一般不超过初凝时间","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0087","q":"大体积混凝土温控措施？","a":"①降低水化热；②预冷骨料；③通水冷却；④表面保温；⑤分层分块浇筑","sec":"第4章·混凝土与混凝土坝","sub":"温控措施"},{"id":"r0088","q":"混凝土坝施工缝分块方式？","a":"纵缝分块、错缝分块、斜缝分块、通仓浇筑","sec":"第4章·混凝土与混凝土坝","sub":"分缝分块"},{"id":"r0089","q":"混凝土坝施工质量控制要点？","a":"①配合比；②均匀性；③入仓温度；④振捣密实度；⑤养护；⑥外观","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0090","q":"碾压混凝土的施工工艺特点？","a":"干贫混凝土→自卸汽车入仓→推土机平仓→振动碾碾压→切缝机切缝","sec":"第4章·混凝土与混凝土坝","sub":"碾压混凝土"},{"id":"r0091","q":"碾压混凝土与常态混凝土区别？","a":"①坍落度为零；②振动碾非振捣；③水泥少粉煤灰多；④速度快","sec":"第4章·混凝土与混凝土坝","sub":"碾压混凝土"},{"id":"r0092","q":"碾压混凝土的施工质量控制关键？","a":"VC值控制、压实度≥98%、层间结合质量","sec":"第4章·混凝土与混凝土坝","sub":"碾压混凝土"},{"id":"r0093","q":"模板的分类？","a":"按材料：木模板、钢模板、竹胶板；按形式：拆移式、移动式、永久式","sec":"第4章·混凝土与混凝土坝","sub":"模板钢筋"},{"id":"r0094","q":"钢筋加工的主要工序？","a":"调直→除锈→下料→弯曲→连接","sec":"第4章·混凝土与混凝土坝","sub":"模板钢筋"},{"id":"r0095","q":"钢筋连接方式有哪些？","a":"绑扎搭接、焊接、机械连接（套筒挤压、直螺纹）","sec":"第4章·混凝土与混凝土坝","sub":"模板钢筋"},{"id":"r0096","q":"堤身填筑的施工方法？","a":"水平分层填筑法，分层铺土、压实","sec":"第5章·堤防与疏浚","sub":"堤防工程"},{"id":"r0097","q":"堤防压实度要求？","a":"1级堤防≥95%；2级和3级堤防≥93%","sec":"第5章·堤防与疏浚","sub":"堤防工程"},{"id":"r0098","q":"护岸护坡的类型？","a":"浆砌石、干砌石、混凝土、生态、抛石护脚","sec":"第5章·堤防与疏浚","sub":"护岸护坡"},{"id":"r0099","q":"护岸护坡施工要点？","a":"①基槽开挖→②垫层铺设→③护坡砌筑→④勾缝养护→⑤护脚抛石","sec":"第5章·堤防与疏浚","sub":"护岸护坡"},{"id":"r0100","q":"河湖疏浚施工方法？","a":"水力冲挖法、绞吸式挖泥船、耙吸式挖泥船、抓斗式挖泥船","sec":"第5章·堤防与疏浚","sub":"疏浚工程"},{"id":"r0101","q":"绞吸式挖泥船特点？","a":"挖、运、吹一体化，适用于中粗砂及淤泥质土","sec":"第5章·堤防与疏浚","sub":"疏浚工程"},{"id":"r0102","q":"耙吸式挖泥船特点？","a":"自航自载，适用于港口航道疏浚，可远距离抛泥","sec":"第5章·堤防与疏浚","sub":"疏浚工程"},{"id":"r0103","q":"水闸由哪几部分组成？","a":"闸室段（闸门、闸墩、底板）、上游连接段、下游连接段","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0104","q":"水闸主体结构施工顺序？","a":"基础开挖→底板浇筑→闸墩浇筑→闸门安装→启闭机安装→上下游翼墙施工","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0105","q":"闸门的类型有哪些？","a":"平面闸门、弧形闸门、人字闸门；钢闸门、铸铁闸门、混凝土闸门","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0106","q":"弧形闸门安装步骤？","a":"底槛埋件→侧轨埋件→支铰座→支臂→门叶→止水","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0107","q":"启闭机类型？","a":"固定卷扬式、移动式、液压、螺杆","sec":"第6章·水闸泵站水电站","sub":"启闭机"},{"id":"r0108","q":"泵站的组成？","a":"进水建筑物、泵房、出水建筑物、其他附属设施","sec":"第6章·水闸泵站水电站","sub":"泵站"},{"id":"r0109","q":"水电站布置形式？","a":"坝后式、河床式、引水式（有压、无压）","sec":"第6章·水闸泵站水电站","sub":"水电站"},{"id":"r0110","q":"水轮机的类型？","a":"冲击式（水斗式、斜击式）、反击式（混流式、轴流式、贯流式）","sec":"第6章·水闸泵站水电站","sub":"水轮机"},{"id":"r0111","q":"混流式水轮机适用水头？","a":"30~700m","sec":"第6章·水闸泵站水电站","sub":"水轮机"},{"id":"r0112","q":"水轮发电机组安装工序？","a":"基础埋件→轴承→转轮→主轴→发电机→轴线调整→试运行","sec":"第6章·水闸泵站水电站","sub":"水轮发电机组"},{"id":"r0113","q":"水工程保护范围禁止哪些行为？","a":"禁止爆破、打井、采石、取土等活动","sec":"第7章·相关法规","sub":"水法"},{"id":"r0114","q":"水资源规划分哪几级？","a":"国家→流域→区域（三级）","sec":"第7章·相关法规","sub":"水资源规划"},{"id":"r0115","q":"防汛抗洪组织要求？","a":"实行各级政府行政首长负责制，统一指挥、分级分部门负责","sec":"第7章·相关法规","sub":"防洪"},{"id":"r0116","q":"水土保持的预防措施？","a":"①植树种草；②坡面防护；③减少地表径流；④禁止陡坡开垦","sec":"第7章·相关法规","sub":"水土保持"},{"id":"r0117","q":"施工进度控制方法？","a":"横道图、S形曲线、网络计划图法","sec":"第8章·相关标准","sub":"进度控制"},{"id":"r0118","q":"双代号网络计划关键线路确定？","a":"总时差最小的工作组成的线路","sec":"第8章·相关标准","sub":"进度控制"},{"id":"r0119","q":"混凝土施工质量评定优良标准？","a":"①全部检查项目合格；②主要检查项目优良率≥90%；③外观质量优良","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0120","q":"水利工程单元工程评定为合格的条件？","a":"①主控项目全部符合标准；②一般项目逐项合格率≥70%；③工程资料完整","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0121","q":"施工总承包资质分几级？","a":"特级、一级、二级、三级","sec":"第9章·资质与组织","sub":"企业资质"},{"id":"r0122","q":"施工总平面布置的原则？","a":"①方便施工、减少干扰；②节约用地；③满足防洪排水；④方便管理生活","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0123","q":"建设项目管理四控制？","a":"进度控制、质量控制、投资控制、安全控制","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0124","q":"建设项目管理两管理？","a":"合同管理、信息管理","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0125","q":"高程放样水准测量法误差？","a":"不大于±10mm","sec":"第1章·勘测设计","sub":"施工放样"},{"id":"r0126","q":"堤防工程含水率控制原则？","a":"控制在最优含水率附近，偏差不超过±2%~3%","sec":"第5章·堤防与疏浚","sub":"堤防工程"},{"id":"r0127","q":"碾压混凝土VC值范围？","a":"机口5~10s，碾压时10~20s","sec":"第4章·混凝土与混凝土坝","sub":"碾压混凝土"},{"id":"r0128","q":"评标方法？","a":"综合评估法、经评审的最低投标价法","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0129","q":"水利工程验收分类？","a":"阶段验收、单位工程验收、专项验收、竣工验收","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0130","q":"单元工程质量评定主控项目合格率？","a":"全部合格（100%）","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0131","q":"单元工程质量评定一般项目合格率？","a":"合格≥70%；优良≥90%","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0132","q":"土石坝反滤层的作用？","a":"防止管涌和流土，保护土体颗粒不被水流带走","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0133","q":"土石坝反滤层铺设原则？","a":"各层应平整、均匀，相邻层粒径匹配","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0134","q":"施工导流标准如何确定？","a":"根据工程等别、保护对象重要性等确定导流建筑物级别和洪水标准","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0135","q":"基坑降水中轻型井点布置方式？","a":"单排、双排、U形、环形布置","sec":"第2章·水流控制与基础","sub":"基坑排水"},{"id":"r0136","q":"帷幕灌浆顺序？","a":"分序加密：先Ⅰ序孔，再Ⅱ序孔，后Ⅲ序孔","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0137","q":"灌浆压力如何确定？","a":"通过灌浆试验确定，一般0.3~1.5倍坝高水头","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0138","q":"混凝土入仓温度控制？","a":"大体积混凝土≤28℃（夏季）或12~15℃（冬季）","sec":"第4章·混凝土与混凝土坝","sub":"温控措施"},{"id":"r0139","q":"冷缝如何处理？","a":"按施工缝处理：凿毛→清洗→铺砂浆→继续浇筑","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0140","q":"低热微膨胀水泥特点？","a":"水化热低、微膨胀补偿收缩，适用于大体积混凝土","sec":"第4章·混凝土与混凝土坝","sub":"混凝土生产"},{"id":"r0141","q":"引气剂的作用？","a":"引入微小气泡，提高抗冻性和抗渗性，改善和易性","sec":"第4章·混凝土与混凝土坝","sub":"混凝土生产"},{"id":"r0142","q":"土石坝坝基处理要求？","a":"清除表层腐殖土、树根；砂砾石地基设防渗体；软基需加固处理","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0143","q":"截流龙口合龙后需要做什么？","a":"闭气→加高培厚→形成围堰","sec":"第2章·水流控制与基础","sub":"截流"},{"id":"r0144","q":"水下混凝土浇筑方法？","a":"导管法（直升导管法），导管埋深1~6m","sec":"第6章·水闸泵站水电站","sub":"水下工程"},{"id":"r0145","q":"总库容的含义？","a":"最高洪水位以下的水库静库容","sec":"第1章·勘测设计","sub":"特征库容"},{"id":"r0146","q":"防洪库容的含义？","a":"防洪高水位至防洪限制水位之间的库容","sec":"第1章·勘测设计","sub":"特征库容"},{"id":"r0147","q":"兴利库容的含义？","a":"正常蓄水位至死水位之间的库容","sec":"第1章·勘测设计","sub":"特征库容"},{"id":"r0148","q":"重叠库容的含义？","a":"防洪库容与兴利库容重叠部分的库容","sec":"第1章·勘测设计","sub":"特征库容"},{"id":"r0149","q":"水库壅水建筑物1级合理使用年限？","a":"150年","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0150","q":"水库壅水建筑物4级合理使用年限？","a":"50年","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0151","q":"调输水建筑物1级合理使用年限？","a":"100年","sec":"第1章·勘测设计","sub":"耐久性"},{"id":"r0152","q":"施工期的四个阶段？","a":"工程筹建期→工程准备期→主体工程施工期→工程完建期","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0153","q":"施工进度计划表达方法？","a":"横道图、工程进度曲线、施工进度管理控制曲线、形象进度图、网络进度计划","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0154","q":"砂石料加工系统按生产能力分几类？","a":"特大型≥1500t/h、大型500~1500t/h、中型120~500t/h、小型<120t/h","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0155","q":"水闸按承担任务分类？","a":"节制闸、进水闸、分洪闸、排水闸、挡潮闸、冲砂闸、泄水闸、排冰闸、排污闸","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0156","q":"水闸按闸室结构形式分哪几类？","a":"开敞式、胸墙式、涵洞式","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0157","q":"水闸混凝土施工原则？","a":"以闸室为中心，先深后浅、先重后轻、先高后矮、先主后次","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0158","q":"闸门一类焊缝包括？","a":"主梁边梁腹板翼缘板对接焊缝、吊耳板拉杆对接焊缝","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0159","q":"二类焊缝包括？","a":"闸门面板对接焊缝、拦污栅主梁边梁腹板翼缘板对接焊缝","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0160","q":"止水片安装的注意事项？","a":"①水平止水片在浇筑层中间；②不得冲撞止水片；③振捣器不得触及","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0161","q":"紫铜止水片搭接长度要求？","a":"双面焊搭接长度不小于20mm","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0162","q":"橡胶止水带搭接长度要求？","a":"氯丁橡胶粘接，搭接长度不小于100mm","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0163","q":"水闸平底板混凝土浇筑顺序？","a":"先浇上下游齿墙，再从一端向另一端浇筑底板","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0164","q":"施工缝处理方法？强度要求？","a":"凿毛/冲毛/刷毛处理；混凝土强度达2.5MPa后方可浇筑上层","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0165","q":"闸门安装验收量具精度要求？","a":"钢卷尺不低于一级；经纬仪不低于DJ2级；水准仪不低于DS3级","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0166","q":"水闸工程管理范围1级上下游宽度？","a":"500~1000m","sec":"第7章·相关法规","sub":"水法"},{"id":"r0167","q":"堤防工程保护范围1级横向宽度？","a":"200~300m","sec":"第7章·相关法规","sub":"水法"},{"id":"r0168","q":"大型水库大坝上游管理范围？","a":"从坝轴线向上游150~200m","sec":"第7章·相关法规","sub":"水法"},{"id":"r0169","q":"水资源规划层次关系？","a":"流域内区域规划服从流域规划；专业规划服从综合规划","sec":"第7章·相关法规","sub":"水资源规划"},{"id":"r0170","q":"标准的五个层次？","a":"国家标准、行业标准、地方标准、团体标准、企业标准","sec":"第8章·相关标准","sub":"标准体系"},{"id":"r0171","q":"标准制定周期和复审周期？","a":"制定周期≤2年，修订周期≤1年；复审周期≤5年","sec":"第8章·相关标准","sub":"标准体系"},{"id":"r0172","q":"标准用词必须、应、宜、可区别？","a":"必须=很严格非这样做不可；应=正常情况下均应；宜=允许稍有选择；可=有选择","sec":"第8章·相关标准","sub":"标准体系"},{"id":"r0173","q":"滑动模板操作平台防护栏杆高度？","a":"高度≥120cm，横挡间距≤35cm","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0174","q":"土石围堰3级边坡稳定安全系数？","a":"瑞典圆弧法≥1.20；简化毕肖普法≥1.30","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0175","q":"土石围堰3级堰顶安全加高？","a":"≥0.7m","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0176","q":"混凝土围堰3级堰顶安全加高？","a":"≥0.4m","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0177","q":"高处作业安全网距工作面最大高度？","a":"不超过3.0m，水平投影宽度≥2.0m","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0178","q":"地下洞室开挖氧气含量要求？","a":"不少于20%","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0179","q":"相向开挖工作面相距多少米单向开挖？","a":"相距15m时停止一方，单向开挖贯通","sec":"第8章·相关标准","sub":"开挖标准"},{"id":"r0180","q":"施工危险警戒区距建筑物外边线距离？","a":"≥施工对象高度1/10，且≥10m","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0181","q":"不承重侧面模板拆除混凝土强度？","a":"达到2.5MPa以上","sec":"第8章·相关标准","sub":"模板标准"},{"id":"r0182","q":"悬臂板梁拆模强度要求？","a":"跨度≤2m时75%；跨度>2m时100%","sec":"第8章·相关标准","sub":"模板标准"},{"id":"r0183","q":"其他梁板拱拆模强度要求？","a":"跨度≤2m时50%；2~8m时75%；>8m时100%","sec":"第8章·相关标准","sub":"模板标准"},{"id":"r0184","q":"用火作业区距建筑物防火距离？","a":"不小于25m","sec":"第8章·相关标准","sub":"消防标准"},{"id":"r0185","q":"易燃品集中站距建筑物防火距离？","a":"不小于30m","sec":"第8章·相关标准","sub":"消防标准"},{"id":"r0186","q":"加油站与其他设施防火安全距离？","a":"不小于50m","sec":"第8章·相关标准","sub":"消防标准"},{"id":"r0187","q":"施工现场变压器安装高度？","a":"地面变压器高台≥0.5m，栅栏≥1.7m；杆上变压器高度≥2.5m","sec":"第8章·相关标准","sub":"用电标准"},{"id":"r0188","q":"施工照明安全电压？","a":"特别潮湿≤12V；潮湿≤24V；地下工程≤36V","sec":"第8章·相关标准","sub":"用电标准"},{"id":"r0189","q":"总承包二级水利资质范围？","a":"坝高≤70m，装机≤150MW，隧洞<8m且<1000m，堤防≤2级","sec":"第9章·资质与组织","sub":"企业资质"},{"id":"r0190","q":"总承包三级水利资质合同额限制？","a":"单项合同额不超过企业注册资本金5倍","sec":"第9章·资质与组织","sub":"企业资质"},{"id":"r0191","q":"建设工程合同分类？","a":"勘察合同、设计合同、施工合同、监理合同、咨询合同","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0192","q":"施工合同文件的优先解释顺序？","a":"协议书→中标通知书→投标函→专用条款→通用条款→技术标准→图纸→工程量清单","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0193","q":"履约担保的形式？","a":"银行保函、履约保证保险、担保公司担保、现金/银行汇票","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0194","q":"索赔程序时效要求？","a":"索赔事件发生后28天内提交意向书，28天内提交详细资料","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0195","q":"混凝土工程三大质量控制点？","a":"原材料质量、配合比、施工过程控制","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0196","q":"工程量清单计价的单价类型？","a":"工料单价、综合单价、全费用综合单价","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0197","q":"变更估价的原则？","a":"①合同有适用价格按合同价；②合同无适用但有类似按类似；③两者都没有由承包人提出新单价","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0198","q":"混凝土出现裂缝的处理方法？","a":"表面封闭法、灌浆嵌缝法、结构加固法、置换混凝土法","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0199","q":"混凝土养护方法？","a":"洒水养护、覆盖养护、喷涂养护剂、蒸汽养护","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0200","q":"预应力混凝土施工方法？","a":"先张法、后张法","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0201","q":"模板拆除的顺序原则？","a":"先支后拆、后支先拆；先拆非承重、后拆承重；自上而下","sec":"第4章·混凝土与混凝土坝","sub":"模板钢筋"},{"id":"r0202","q":"双代号网络计划的时间参数？","a":"最早开始/完成时间、最迟开始/完成时间、总时差、自由时差","sec":"第8章·相关标准","sub":"进度控制"},{"id":"r0203","q":"工程进度款的支付程序？","a":"承包人提交付款申请→监理工程师审核→发包人审批→支付","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0204","q":"质量保证金的扣留比例？","a":"工程结算款的3%-5%","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0205","q":"水利工程保修期？","a":"一般工程1年，重要工程2年，机电设备1-2年","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0206","q":"混凝土运输时间限制？","a":"不超过混凝土初凝时间，一般45-60min","sec":"第4章·混凝土与混凝土坝","sub":"混凝土运输"},{"id":"r0207","q":"泵送混凝土坍落度要求？","a":"100~180mm","sec":"第4章·混凝土与混凝土坝","sub":"混凝土运输"},{"id":"r0208","q":"混凝土水胶比与强度关系？","a":"水胶比越小，强度越高；呈反比关系","sec":"第4章·混凝土与混凝土坝","sub":"建筑材料"},{"id":"r0209","q":"水利工程材料试验三原则？","a":"代表性、真实性、及时性","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0210","q":"见证取样比例要求？","a":"不少于应取样数量的30%","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0211","q":"平行检测比例要求？","a":"混凝土不少于3%，土方不少于5%","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0212","q":"工程变更的类型？","a":"设计变更、工程量变更、施工条件变更、工期变更","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0213","q":"悬臂浇筑法适用条件？","a":"大跨径连续梁桥或刚构桥","sec":"第6章·水闸泵站水电站","sub":"水工建筑物"},{"id":"r0214","q":"围堰高度应高出施工期最高水位多少？","a":"土石围堰≥0.5m；混凝土围堰≥0.3m","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0215","q":"水土流失防治责任范围？","a":"项目建设区和直接影响区","sec":"第7章·相关法规","sub":"水土保持"},{"id":"r0216","q":"水土流失防治措施体系？","a":"工程措施、植物措施、临时措施","sec":"第7章·相关法规","sub":"水土保持"},{"id":"r0217","q":"混凝土冬季施工的临界温度？","a":"日平均气温连续5天稳定低于5℃时进入冬季施工","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0218","q":"混凝土裂缝按深度分类？","a":"表面裂缝、深层裂缝、贯穿裂缝","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0219","q":"混凝土裂缝按形状分类？","a":"纵向、横向、斜向、网状、龟裂","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0220","q":"混凝土抗冻等级F100的含义？","a":"混凝土能承受100次冻融循环而不破坏","sec":"第4章·混凝土与混凝土坝","sub":"混凝土生产"},{"id":"r0221","q":"大体积混凝土的浇筑方法？","a":"分块分层浇筑、薄层短间歇、连续浇筑","sec":"第4章·混凝土与混凝土坝","sub":"温控措施"},{"id":"r0222","q":"混凝土坝的横缝间距？","a":"一般12~20m","sec":"第4章·混凝土与混凝土坝","sub":"分缝分块"},{"id":"r0223","q":"混凝土坝纵缝灌浆的时机？","a":"混凝土达到稳定温度后","sec":"第4章·混凝土与混凝土坝","sub":"分缝分块"},{"id":"r0224","q":"土石坝施工的雨季施工措施？","a":"雨前压实表面、覆盖防雨布、做好排水、调整含水率","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0225","q":"混凝土施工缝的处理方法？","a":"凿毛→冲洗→铺水泥砂浆→浇筑上层混凝土","sec":"第4章·混凝土与混凝土坝","sub":"混凝土浇筑"},{"id":"r0226","q":"围堰拆除的方法？","a":"人工拆除、机械拆除、爆破拆除、水力冲除","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0227","q":"河道整治工程的内容？","a":"河道疏浚、护岸护坡、清障、生态修复","sec":"第5章·堤防与疏浚","sub":"河湖整治"},{"id":"r0228","q":"土石坝施工的冬季措施？","a":"①降低混凝土入仓温度；②保温养护；③掺加防冻剂；④缩短运输距离","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0229","q":"堆石坝面板分块宽度？","a":"一般12~16m","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0230","q":"面板堆石坝填筑标准？","a":"孔隙率：垫层区≤18%，过渡区≤20%，主堆石区≤22%","sec":"第3章·土石方与土石坝","sub":"面板堆石坝"},{"id":"r0231","q":"土石坝坝面作业的流水工序？","a":"卸料→铺料→洒水→压实→质检→下一层","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0232","q":"堤防工程竣工验收的条件？","a":"①主体工程完成；②质量合格；③竣工资料完整；④管理设施到位","sec":"第5章·堤防与疏浚","sub":"堤防工程"},{"id":"r0233","q":"水闸闸门启闭试验的次数？","a":"无水情况下启闭试验3次，有水情况下启闭试验2次","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0234","q":"水泵安装高程允许偏差？","a":"±10mm","sec":"第6章·水闸泵站水电站","sub":"泵站"},{"id":"r0235","q":"水轮发电机组轴线调整的方法？","a":"盘车检查轴线，调整主轴与转轮、轴承的同轴度","sec":"第6章·水闸泵站水电站","sub":"水轮发电机组"},{"id":"r0236","q":"水闸工程的安全监测项目？","a":"垂直位移、水平位移、扬压力、渗流量、应力应变","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0237","q":"水利工程竣工决算的内容？","a":"竣工决算说明书、竣工决算报表、竣工决算对比分析","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0238","q":"混凝土坝的帷幕灌浆压力？","a":"一般0.3~1.0MPa","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0239","q":"土石坝的施工方法分类？","a":"干填碾压、水中填土、抛投法","sec":"第3章·土石方与土石坝","sub":"土石坝施工"},{"id":"r0240","q":"水利工程现场管理人员配备？","a":"项目经理、项目总工、质量员、安全员、施工员、测量员、试验员、材料员、资料员","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0241","q":"灌浆质量检查方法？","a":"压水试验、注水试验、抽芯检查、孔内电视","sec":"第2章·水流控制与基础","sub":"灌浆施工"},{"id":"r0242","q":"工程量清单的作用？","a":"①统一计价口径；②便于招标控制价；③作为支付依据；④变更计量基础","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0243","q":"水闸闸墩混凝土浇筑速度？","a":"每小时浇筑高度≤1.0m","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0244","q":"水利工程施工总工的主要职责？","a":"技术管理、质量控制、新技术应用、施工组织设计","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0245","q":"水利工程基本建设程序？","a":"项目建议书→可行性研究→初步设计→施工准备→建设实施→生产准备→竣工验收→后评价","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0246","q":"隐蔽工程验收的程序？","a":"承包人自检→监理工程师现场检查→签认验收记录→进入下道工序","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0247","q":"工程量清单的分类？","a":"分部分项工程量清单、措施项目清单、其他项目清单、规费项目清单、税金项目清单","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0248","q":"水利工程保修期的起算时间？","a":"工程通过合同工程完工验收之日起","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0249","q":"施工导流时段划分？","a":"①前期（围堰挡水度汛）；②中期（坝体挡水度汛）；③后期（导流泄水建筑物封堵）","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0250","q":"围堰稳定验算的内容？","a":"①抗滑稳定；②抗倾覆稳定；③地基承载力；④渗流稳定","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0251","q":"预应力筋张拉的控制应力？","a":"一般为0.7~0.75fptk","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0252","q":"工程结算的分类？","a":"中间结算、完工结算、最终结算","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0253","q":"水利工程开工条件？","a":"①施工组织设计已审批；②资金落实；③图纸到位；④场地三通一平；⑤监理工程师已进场","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0254","q":"工程变更的处理程序？","a":"①提出变更申请；②监理审查；③设计出变更图；④发包人批准；⑤施工实施","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0255","q":"工程进度计划检查的方法？","a":"①横道图比较法；②S曲线比较法；③香蕉曲线比较法；④前锋线比较法","sec":"第8章·相关标准","sub":"进度控制"},{"id":"r0256","q":"施工组织总设计的编制依据？","a":"①招标文件；②设计文件；③现场勘察资料；④施工技术规范","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0257","q":"安全生产三大规程？","a":"《安全技术规程》《安全操作规程》《安全管理规程》","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0258","q":"水利工程的质量监督机构？","a":"水行政主管部门或其委托的水利工程质量监督机构","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0259","q":"质量事故的处理原则？","a":"四不放过：事故原因不清楚不放过、事故责任者和群众没受到教育不放过、没有防范措施不放过、事故责任者没受到处理不放过","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0260","q":"水利工程施工监理的主要工作方法？","a":"现场记录、发布文件、旁站监理、巡视检查、平行检测、跟踪检测","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0261","q":"工程投标保证金的额度？","a":"不超过投标总价的2%，最高不超过80万","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0262","q":"合同争议的解决方式？","a":"和解、调解、仲裁、诉讼","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0263","q":"施工平面图设计的主要内容？","a":"施工区域划分、临时设施布置、材料堆场、施工道路、水电管线、混凝土拌合系统","sec":"第9章·资质与组织","sub":"施工组织"},{"id":"r0264","q":"工程进度款的支付比例？","a":"一般按已完成工程量的60-90%支付","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0265","q":"工程款优先受偿权的行使期限？","a":"自建设工程竣工之日或合同约定竣工之日起六个月","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0266","q":"水土流失防治标准等级？","a":"一级（≥95%）、二级（≥85%）、三级（≥75%）","sec":"第7章·相关法规","sub":"水土保持"},{"id":"r0267","q":"工程预付款的扣回方式？","a":"从每一个支付期扣回，扣完为止","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0268","q":"工程质保金的返还时间？","a":"缺陷责任期满后14天内","sec":"第9章·资质与组织","sub":"项目管理"},{"id":"r0269","q":"施工质量事故的分类？","a":"一般质量事故、较大质量事故、重大质量事故、特大质量事故","sec":"第8章·相关标准","sub":"质量评定"},{"id":"r0270","q":"水工建筑物的级别划分依据？","a":"工程等别、建筑物重要性、建筑物在工程中的作用","sec":"第1章·勘测设计","sub":"工程等级"},{"id":"r0271","q":"水利工程安全生产责任体系？","a":"建设单位首要责任、施工单位主体责任、监理单位监督责任","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0272","q":"水利工程安全生产管理制度？","a":"安全生产责任制、安全教育培训制、安全检查制、隐患排查治理制、危险作业审批制","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0273","q":"危险源辨识方法？","a":"①直观经验法；②类比法；③系统安全分析法；④作业条件危险性评价法（LEC法）","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0274","q":"混凝土的耐久性指标？","a":"抗冻性、抗渗性、抗碳化性、抗氯离子渗透性、抗硫酸盐侵蚀性","sec":"第4章·混凝土与混凝土坝","sub":"耐久性"},{"id":"r0275","q":"混凝土的耐久性设计原则？","a":"①根据环境类别确定耐久性指标；②选用合适原材料；③控制最大水胶比和最小胶凝材料用量；④保证施工质量","sec":"第4章·混凝土与混凝土坝","sub":"耐久性"},{"id":"r0276","q":"泵送混凝土的坍落度？","a":"100~180mm","sec":"第4章·混凝土与混凝土坝","sub":"混凝土运输"},{"id":"r0277","q":"泵送混凝土的骨料要求？","a":"粗骨料最大粒径不超过输送管径的1/3","sec":"第4章·混凝土与混凝土坝","sub":"混凝土运输"},{"id":"r0278","q":"混凝土工程雨季施工措施？","a":"①加强骨料含水率检测；②调整用水量；③做好防雨准备；④已浇混凝土覆盖保护","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0279","q":"混凝土热期（夏季）施工措施？","a":"①降低骨料温度；②加冰拌合；③缩短运输时间；④加快浇筑速度；⑤加强养护","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0280","q":"预应力筋的张拉程序？","a":"0→初应力→1.05σcon（持荷2min）→σcon（锚固）","sec":"第4章·混凝土与混凝土坝","sub":"混凝土施工"},{"id":"r0281","q":"水闸施工中混凝土分缝原则？","a":"①结构缝和施工缝结合考虑；②设在应力较小处；③避开应力集中部位","sec":"第6章·水闸泵站水电站","sub":"水闸工程"},{"id":"r0282","q":"泵站机组基础的施工？","a":"预留地脚螺栓孔或预埋地脚螺栓，二次灌浆固定","sec":"第6章·水闸泵站水电站","sub":"泵站"},{"id":"r0283","q":"水利水电工程资质等级适用范围？","a":"特级：不受限；一级：大型；二级：中型；三级：小型","sec":"第9章·资质与组织","sub":"企业资质"},{"id":"r0284","q":"专项施工方案专家论证的范围？","a":"深基坑、高大模板、起重吊装及安拆、脚手架、拆除爆破等超过一定规模的危险性较大工程","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0285","q":"专项施工方案的主要内容？","a":"工程概况、编制依据、施工计划、施工工艺技术、施工安全保证措施、劳动力计划、计算书及相关图纸","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0286","q":"安全技术交底的要求？","a":"①逐级交底（项目→班组→工人）；②书面交底；③签字确认；④针对具体作业","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0287","q":"安全检查的分类？","a":"日常检查、定期检查、专项检查、季节性检查、节假日前后检查","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0288","q":"安全检查的方法？","a":"看（现场）、听（汇报）、问（了解）、查（资料）、测（检测）","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0289","q":"安全事故报告的内容？","a":"事故发生单位、时间、地点、伤亡情况、初步原因、已采取措施","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0290","q":"生产安全事故的应急救援预案？","a":"综合预案、专项预案、现场处置方案","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0291","q":"安全生产的三大防线？","a":"①人防（培训教育）；②物防（设施设备）；③技防（技术措施）","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0292","q":"特种作业人员持证要求？","a":"必须经过专门的安全技术培训并经考核合格取得特种作业操作证后，方可上岗","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0293","q":"特种作业包括哪些？","a":"电工作业、焊接与热切割作业、高处作业、制冷与空调作业、危险化学品作业等","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0294","q":"高处作业的级别？","a":"一级2~5m、二级5~15m、三级15~30m、特级30m以上","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0295","q":"水利水电工程中常见的危险源？","a":"①高边坡、深基坑；②大型机械；③爆破作业；④水上水下作业；⑤用电作业","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0296","q":"围堰防汛应急预案的内容？","a":"①汛情预测；②应急组织；③抢险物资；④抢险队伍；⑤通讯联络；⑥应急处置","sec":"第2章·水流控制与基础","sub":"围堰"},{"id":"r0297","q":"水库蓄水的程序？","a":"①蓄水方案编制审批；②下闸蓄水验收；③分期蓄水；④蓄水期监测；⑤蓄水至设计水位","sec":"第2章·水流控制与基础","sub":"导流方式"},{"id":"r0298","q":"水利工程建设期环境保护的措施？","a":"①废水处理；②废渣处理；③粉尘控制；④噪声控制；⑤生态保护","sec":"第7章·相关法规","sub":"水土保持"},{"id":"r0299","q":"水工混凝土的耐久性设计指标？","a":"强度等级、最大水胶比、最小胶凝材料用量、抗冻等级、抗渗等级","sec":"第4章·混凝土与混凝土坝","sub":"耐久性"},{"id":"r0300","q":"混凝土坝施工质量控制的关键环节？","a":"原材料控制、配合比设计、拌合运输、浇筑振捣、养护温控","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0301","q":"水工建筑物的缺陷处理方法？","a":"①表面修补法；②灌浆处理法；③结构加固法；④拆除重做法","sec":"第4章·混凝土与混凝土坝","sub":"质量控制"},{"id":"r0302","q":"水利工程的安全管理体系？","a":"①安全生产责任制；②安全管理制度；③安全培训教育；④安全检查；⑤应急救援","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0303","q":"施工安全检查的隐患处理？","a":"①立即整改；②限期整改；③挂牌督办；④停工整改","sec":"第8章·相关标准","sub":"安全标准"},{"id":"r0304","q":"水利工程文明施工的要求？","a":"①现场围挡封闭；②材料堆放整齐；③场地清洁卫生；④消防设施齐全；⑤人员着装整齐","sec":"第8章·相关标准","sub":"安全标准"}],"quiz":[{"id":"quiz_001","q":"按照法律部门分类，下列法律中，属于行政法的是？","choices":["《宪法》","《城乡规划法》","《商标法》","《劳动合同法》"],"answer":1,"analysis":"《土地管理法》《城市房地产管理法》《行政处罚法》《行政复议法》《环境保护法》《环境影响评价法》《行政许可法》《城乡规划法》等属于行政法。选项A属于宪法；选项C属于民法商法；选项D属于社会法。","sec":"2026-法规"},{"id":"quiz_002","q":"从法的形式来看，《注册建造师管理规定》属于？","choices":["法律","行政法规","部门规章","地方政府规章"],"answer":2,"analysis":"部门规章是由国务院各部委制定的规范性文件。《注册建造师管理规定》由原建设部颁布。","sec":"2026-法规"},{"id":"quiz_003","q":"下列智力成果中，不受《著作权法》保护的是？","choices":["施工企业编制的投标文件","施工企业开发的工程造价软件","注册建造师考试真题解析","建筑工程师发表的专业技术论文"],"answer":2,"analysis":"不受著作权法保护的对象：①法律、法规、国家机关的决议、决定、命令和其他具有立法、行政、司法性质的文件及其官方正式译文；②时事新闻；③历法、通用数表、通用表格和公式。考试真题属于官方文件，真题解析属于演绎作品需要原创性。","sec":"2026-法规"},{"id":"quiz_004","q":"某发明与现有技术相比具有突出的实质性特点和显著的进步，这属于授予专利权利条件中的？","choices":["新颖性","创造性","实用性","法定性"],"answer":1,"analysis":"创造性是指同申请日以前已有的技术相比，该发明有突出的实质性特点和显著的进步。","sec":"2026-法规"},{"id":"quiz_005","q":"根据现行增值税法律制度，下列服务项目中，可以免征增值税的是？","choices":["单位员工为本单位提供取得工资的服务","个体工商户提供的加工服务","小规模纳税人销售自己使用过的固定资产","外国企业无偿援助中国某单位的进口设备"],"answer":3,"analysis":"免征增值税：①农业生产者销售的自产农产品；②避孕药品和用具；③古旧图书；④销售的自己使用过的物品（其他个人销售自己使用过的物品免征，自己使用过的固定资产减按2%征收）；⑤外国政府、国际组织无偿援助的进口物资和设备。","sec":"2026-法规"},{"id":"quiz_006","q":"赵某在篮球比赛中，被对方球员李某合理冲撞，导致手臂骨折。关于对赵某损害赔偿的说法？","choices":["李某构成侵权，应赔偿全部损失","李某不构成侵权，但应适当补偿","双方均有过错，应各自承担相应责任","赵某自甘风险，李某不承担侵权责任"],"answer":3,"analysis":"自甘风险是指受害人明知某项活动存在风险而自愿参加，对因此造成的损害，由其自行承担。加害人如有过错则承担与其过错相适应的责任。本题中李某合理冲撞不构成侵权，赵某自甘风险。","sec":"2026-法规"},{"id":"quiz_007","q":"关于建设用地使用权的说法，正确的是？","choices":["建设用地使用权自登记时设立","建设用地使用权自合同签订时设立","建设用地使用权自交付时设立","建设用地使用权自出让金缴清时设立"],"answer":0,"analysis":"设立建设用地使用权的，应当向登记机构申请建设用地使用权登记。建设用地使用权自登记时设立。","sec":"2026-法规"},{"id":"quiz_008","q":"关于隐蔽工程检验的说法，正确的是？","choices":["隐蔽工程应在被覆盖后通知监理人检查","隐蔽工程应在被覆盖前通知监理人检查","隐蔽工程可不通知监理人直接覆盖","隐蔽工程由施工单位自行检查即可"],"answer":1,"analysis":"承包人应当对工程隐蔽部位进行自检，并在隐蔽工程覆盖前通知监理人或发包人检查。","sec":"2026-法规"},{"id":"quiz_009","q":"下列建设工程中，开工前应当申请领取施工许可证的是？","choices":["建筑面积300平方米的住宅","总投资额80万元的工程","农民自建两层以下住宅","抢险救灾工程"],"answer":0,"analysis":"申请领取施工许可证：①工程投资额在30万元以上；②建筑面积在300平方米以上。不需申请：①限额以下小型工程；②农民自建低层住宅；③抢险救灾；④临时性建筑；⑤军用房屋建筑。","sec":"2026-法规"},{"id":"quiz_010","q":"关于施工现场扬尘污染防治的说法，正确的是？","choices":["施工现场可不设围挡","施工现场的主要道路可不硬化","土方应集中堆放并采取覆盖、洒水等措施","裸露场地可不采取覆盖措施"],"answer":2,"analysis":"施工现场应设置围挡，道路应硬化，裸露场地应覆盖或绿化，土方应集中堆放并采取覆盖、洒水等措施。","sec":"2026-法规"},{"id":"quiz_011","q":"建造师考试中，应当给予应试人员当次全部科目考试成绩无效处理，并被记入专业技术人员资格考试诚信档案库？","choices":["携带通讯工具进入座位","未在规定座位参加考试","抄袭或协助他人抄袭","让他人代为参加考试"],"answer":2,"analysis":"严重违纪违规行为：①抄袭或协助他人抄袭；②互相传递试卷、答题卡等；③持伪造证件参加考试；④让他人代为或代替他人参加考试。当次全部科目考试成绩无效，记入诚信档案库。","sec":"2026-法规"},{"id":"quiz_012","q":"根据《建筑工程施工发包与承包违法行为认定查处管理办法》，下列属于合法分包的是？","choices":["专业分包单位将工程再分包","总包将工程主体结构分包","总包将专业工程经建设单位认可分包给有资质单位","个人以施工企业名义承揽工程"],"answer":2,"analysis":"合法分包须具备：①经建设单位认可；②分包给有相应资质的单位；③分包的是专业工程而非主体结构；④非再次分包。","sec":"2026-法规"},{"id":"quiz_013","q":"根据《建筑施工企业主要负责人、项目负责人和专职安全生产管理人员安全生产管理规定》？","choices":["主要负责人、项目负责人、专职安全生产管理人员简称'安管人员'","专职安全生产管理人员包括施工员","三类人员应经建设主管部门考核合格后方可任职","三类人员考核合格证书在全国范围内有效"],"answer":0,"analysis":"建筑施工企业主要负责人、项目负责人和专职安全生产管理人员合称'安管人员'。三类人员应经建设主管部门考核合格后持证上岗。","sec":"2026-法规"},{"id":"quiz_014","q":"关于劳动合同生效时间的说法，正确的是？","choices":["劳动合同自双方签字之日起生效","劳动合同自用人单位盖章之日起生效","劳动合同自双方签字或盖章之日起生效","劳动合同自实际履行之日起生效"],"answer":2,"analysis":"劳动合同由用人单位与劳动者协商一致，并经用人单位与劳动者在劳动合同文本上签字或者盖章生效。","sec":"2026-法规"},{"id":"quiz_015","q":"根据《劳动争议调解仲裁法》，关于企业劳动争议调解委员会组成的说法，正确的是？","choices":["由用人单位代表组成","由劳动者代表组成","由职工代表、用人单位代表和工会代表组成","由劳动行政部门代表组成"],"answer":2,"analysis":"劳动争议调解委员会的组成：职工代表、用人单位代表、工会代表。","sec":"2026-法规"},{"id":"quiz_016","q":"根据《行政诉讼法》，属于人民法院行政诉讼受案范围的是？","choices":["国防、外交等国家行为","行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令","对行政机关的奖惩、任免等决定","对行政机关作出的关于确认土地、矿藏、水流等自然资源的所有权或者使用权的决定不服的"],"answer":3,"analysis":"人民法院受理公民、法人或者其他组织对下列行政行为不服提起的诉讼：①行政处罚；②行政强制措施；③侵犯经营自主权；④行政许可；⑤不履行法定职责；⑥抚恤金发放；⑦违法要求履行义务；⑧其他人身权、财产权。排除：国家行为、抽象行政行为、内部行政行为、法律规定的其他行为。","sec":"2026-法规"},{"id":"quiz_017","q":"关于投标人对开标提出异议的说法，正确的是？","choices":["投标人对开标有异议的，应当在开标现场提出","投标人对开标有异议的，应当在开标后3日内提出","投标人对开标有异议的，应当在开标后5日内提出","投标人对开标有异议的，应当在投标截止时间前提出"],"answer":0,"analysis":"投标人对开标有异议的，应当在开标现场提出。","sec":"2026-法规"},{"id":"quiz_018","q":"根据《安全生产法》，属于施工企业主要负责人安全生产职责的是？","choices":["如实记录安全生产教育和培训情况","组织或者参与本单位安全生产教育和培训","建立、健全本单位安全生产责任制","检查本单位的安全生产状况，及时排查生产安全事故隐患"],"answer":2,"analysis":"生产经营单位的主要负责人对本单位的安全生产工作全面负责，履行下列职责：①建立、健全本单位安全生产责任制；②组织制定本单位安全生产规章制度和操作规程；③组织制定并实施本单位安全生产教育和培训计划；④保证本单位安全生产投入的有效实施；⑤督促、检查本单位的安全生产工作，及时消除生产安全事故隐患；⑥组织制定并实施本单位的生产安全事故应急救援预案；⑦及时、如实报告生产安全事故。","sec":"2026-法规"},{"id":"quiz_019","q":"关于施工企业安全生产许可证申领与变更的说法，正确的是？","choices":["施工企业变更名称的，应当办理安全生产许可证变更手续","施工企业变更注册资本的，应当办理安全生产许可证变更手续","施工企业变更法定代表人的，应当办理安全生产许可证变更手续","以上都需要办理变更手续"],"answer":3,"analysis":"建筑施工企业变更名称、地址、法定代表人等，应当在变更后10日内，到原安全生产许可证颁发管理机关办理安全生产许可证变更手续。","sec":"2026-法规"},{"id":"quiz_020","q":"关于工程项目施工安全监督的说法，正确的是？","choices":["建设单位是工程项目施工安全监督的责任主体","施工单位是工程项目施工安全监督的责任主体","监理单位是工程项目施工安全监督的责任主体","建设、施工、监理单位对工程项目施工安全监督共同负责"],"answer":3,"analysis":"建设单位、勘察单位、设计单位、施工单位、工程监理单位及其他与建设工程安全生产有关的单位，依法承担建设工程安全生产责任。","sec":"2026-法规"},{"id":"quiz_021","q":"下列事项中，属于建设单位安全责任的是？","choices":["编制工程概算时确定安全防护所需费用","对工程建设过程进行安全检查","建立安全生产教育培训制度","为现场作业人员办理意外伤害保险"],"answer":0,"analysis":"建设单位的安全责任：①向施工单位提供真实、准确、完整的资料；②不得压缩合同约定的工期；③在编制工程概算时确定安全防护、文明施工措施费用，并按约定支付；④在申请领取施工许可证时提供安全施工措施的资料；⑤将拆除工程发包给具有相应资质等级的施工单位等。","sec":"2026-法规"},{"id":"quiz_022","q":"下列文物中，可以归私人所有的是？","choices":["古脊椎动物化石","古人类化石","祖传字画","出土的古钱币"],"answer":2,"analysis":"文物归属：①遗存文物属于国家；②祖传文物、私人收藏文物属于个人；③古文化遗址、古墓葬、古建筑、石窟寺属于国家；④古脊椎动物化石、古人类化石属于国家。","sec":"2026-法规"},{"id":"quiz_023","q":"某商户在店外违规摆放了一个小型广告牌，执法人员未进行任何警告或责令整改，直接将该广告牌没收。","choices":["合法，执法行为符合行政处罚法","合法，店外摆放广告牌本身违法","不合法，违反了'先教育劝导'原则","不合法，违反了'处罚与教育相结合'原则"],"answer":2,"analysis":"行政处罚应遵循：①处罚法定；②公正公开；③一事不再罚；④处罚与教育相结合；⑤保障权利。执法人员未警告直接没收违反程序。","sec":"2026-法规"},{"id":"quiz_024","q":"根据《仲裁法》，可以申请仲裁的民事纠纷是？","choices":["婚姻纠纷","继承纠纷","合同纠纷","行政赔偿纠纷"],"answer":2,"analysis":"仲裁范围：①合同纠纷；②其他财产权益纠纷。婚姻、收养、监护、扶养、继承纠纷不能仲裁。","sec":"2026-法规"},{"id":"quiz_025","q":"根据《建设工程安全生产管理条例》，下列危大工程专项施工方案中，施工单位应当组织专家进行论证、审查的是？","choices":["开挖深度3m的基坑","搭设高度6m的模板支撑工程","跨度18m的混凝土模板支撑工程","开挖深度5m的基坑"],"answer":2,"analysis":"超过一定规模的危险性较大的分部分项工程：①深基坑：开挖深度≥5m；②模板工程及支撑体系：工具式模板≥8m，混凝土模板≥10m，承重支撑≥8m；③起重吊装及安拆：非常规起重设备、起重量≥100kN、安装高度≥200m；④脚手架：搭设高度≥50m、提升高度≥150m；⑤拆除爆破工程；⑥暗挖、顶管及水下作业工程；⑦其他。","sec":"2026-法规"},{"id":"quiz_026","q":"根据《建设工程质量管理条例》，关于正常使用条件下建设工程最低保修期限的说法？","choices":["地基基础工程为5年","屋面防水工程为5年","电气管线为3年","给排水管道为2年"],"answer":1,"analysis":"最低保修期限：①地基基础和主体结构：设计文件规定的合理使用年限；②屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏：5年；③供热与供冷系统：2个采暖期、供冷期；④电气管线、给排水管道、设备安装和装修工程：2年。","sec":"2026-法规"},{"id":"quiz_027","q":"根据《优化营商环境条例》，关于营商环境优化的说法，正确的是？","choices":["国家鼓励和支持知识产权代理等中介服务机构的发展","市场主体应当遵守法律法规，恪守社会公德和商业道德","行业协会商会不得对违法经营者进行限制","国家不强制要求行业协会商会公开收费标准"],"answer":0,"analysis":"国家鼓励和支持知识产权代理、商标代理、公证、仲裁、调解、鉴定、法律咨询等中介服务机构的发展。","sec":"2026-法规"},{"id":"quiz_028","q":"下列情形中，评标委员会应当否决投标的是？","choices":["投标联合体没有提交共同投标协议","投标报价低于成本","投标文件未按要求密封","投标报价低于其他投标报价"],"answer":0,"analysis":"否决投标：①投标文件未经投标单位盖章和单位负责人签字；②投标联合体没有提交共同投标协议；③投标人不符合国家或者招标文件规定的资格条件；④同一投标人提交两个以上不同的投标文件或者投标报价，但招标文件要求提交备选投标的除外；⑤投标报价低于成本或者高于招标文件设定的最高投标限价；⑥投标文件没有对招标文件的实质性要求和条件作出响应；⑦投标人有串通投标、弄虚作假、行贿等违法行为。","sec":"2026-法规"},{"id":"quiz_029","q":"根据《生产安全事故报告和调查处理条例》，属于事故调查组职责的是？","choices":["认定事故性质","追究有关人员责任","对事故责任者作出行政处罚","对事故责任者作出党纪政纪处分"],"answer":0,"analysis":"事故调查组职责：①查明事故发生的经过、原因、人员伤亡情况及直接经济损失；②认定事故的性质和事故等级；③分析事故的责任；④总结事故教训，提出防范和整改措施；⑤提交事故调查报告。","sec":"2026-法规"},{"id":"quiz_030","q":"根据《职业病防治法》，劳动者享有的职业卫生保护权利是？","choices":["获得职业健康检查","获得劳动保护用品","获得工伤保险","获得合理的工作时间"],"answer":0,"analysis":"劳动者享有的职业卫生保护权利：①获得职业卫生教育、培训；②获得职业健康检查、职业病诊疗、康复等职业病防治服务；③了解工作场所产生或者可能产生的职业病危害因素、危害后果和应当采取的职业病防护措施；④要求用人单位提供符合防治职业病要求的职业病防护设施和个人使用的职业病防护用品，改善工作条件；⑤对违反职业病防治法律、法规以及危及生命健康的行为提出批评、检举和控告；⑥拒绝违章指挥和强令进行没有职业病防护措施的作业；⑦参与用人单位职业卫生工作的民主管理，对职业病防治工作提出意见和建议。","sec":"2026-法规"},{"id":"quiz_031","q":"根据《建筑法》，申请领取施工许可证的主体是？","choices":["建设单位","施工单位","监理单位","设计单位"],"answer":0,"analysis":"申请领取施工许可证的主体是建设单位。","sec":"2026-法规"},{"id":"quiz_032","q":"甲公司与乙公司签订货运合同，由乙公司运输甲公司的一批货物。货物运达后，甲公司发现部分货物损坏。","choices":["乙公司对货物损失承担严格责任","乙公司对货物损失承担过错责任","乙公司对货物损失承担无过错责任","乙公司对货物损失不承担责任"],"answer":1,"analysis":"承运人对运输过程中货物的毁损、灭失承担损害赔偿责任，但承运人证明货物的毁损、灭失是因不可抗力、货物本身的自然性质或者合理损耗以及托运人、收货人的过错造成的，不承担损害赔偿责任。","sec":"2026-法规"},{"id":"quiz_033","q":"关于工程重大安全事故罪的说法，正确的是？","choices":["本罪是单位犯罪","本罪的主观方面是过失","本罪的最高刑期为10年有期徒刑","本罪的主体是建设单位"],"answer":1,"analysis":"工程重大安全事故罪：建设单位、设计单位、施工单位、工程监理单位违反国家规定，降低工程质量标准，造成重大安全事故的，对直接责任人员处5年以下有期徒刑或者拘役，并处罚金；后果特别严重的，处5年以上10年以下有期徒刑，并处罚金。本罪主观方面为过失。","sec":"2026-法规"},{"id":"quiz_034","q":"根据《建设工程质量管理条例》，组织竣工验收的主体是？","choices":["建设单位","施工单位","监理单位","质量监督机构"],"answer":0,"analysis":"建设单位收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。","sec":"2026-法规"},{"id":"quiz_035","q":"关于施工企业对施工质量负责的说法，正确的是？","choices":["施工企业是施工质量的第一责任人","施工企业对施工质量负总责","施工企业对施工质量负主要责任","施工企业对施工质量承担直接责任"],"answer":3,"analysis":"施工单位对建设工程的施工质量负责。施工单位应当建立质量责任制，确定工程项目的项目经理、技术负责人和施工管理负责人。","sec":"2026-法规"},{"id":"quiz_036","q":"下列刑罚种类中，属于附加刑的是？","choices":["有期徒刑","无期徒刑","拘役","罚金"],"answer":3,"analysis":"附加刑：罚金、剥夺政治权利、没收财产、驱逐出境。","sec":"2026-法规"},{"id":"quiz_037","q":"合同订立后，甲公司将其与乙公司约定的交货义务转移给丙公司履行。关于该义务转移的说法，正确的是？","choices":["该义务转移属于合同转让","该义务转移属于债务转移","该义务转移属于合同权利义务的概括转移","该义务转移不需要乙公司的同意"],"answer":1,"analysis":"债务转移（合同义务转移）：债务人将合同的义务全部或者部分转移给第三人的，应当经债权人同意。","sec":"2026-法规"},{"id":"quiz_038","q":"根据《房屋建筑和市政基础设施工程竣工验收备案管理办法》，关于办理竣工验收备案的说法，正确的是？","choices":["建设单位应当在工程竣工验收合格之日起15日内，向工程所在地县级以上地方人民政府建设主管部门备案","施工单位应当在工程竣工验收合格之日起15日内备案","监理单位应当在工程竣工验收合格之日起15日内备案","设计单位应当在工程竣工验收合格之日起15日内备案"],"answer":0,"analysis":"建设单位应当自建设工程竣工验收合格之日起15日内，将建设工程竣工验收报告和规划、公安消防、环保等部门出具的认可文件或者准许使用文件报建设行政主管部门或者其他有关部门备案。","sec":"2026-法规"},{"id":"quiz_039","q":"关于工程参建单位无障碍环境建设义务的说法，正确的是？","choices":["只有建设单位负有义务","只有施工单位负有义务","只有监理单位负有义务","工程参建单位均负有义务"],"answer":3,"analysis":"无障碍环境建设是全社会的责任，工程参建单位在建设工程设计、施工、监理过程中应当遵守无障碍环境建设有关规定。","sec":"2026-法规"},{"id":"quiz_040","q":"关于建设工程质量检测活动管理的说法，正确的是？","choices":["检测机构可以转包检测业务","检测机构应当对其检测数据和检测报告的真实性和准确性负责","检测机构不需要取得资质即可从事检测活动","检测人员不需要培训即可上岗"],"answer":1,"analysis":"检测机构应当对其检测数据和检测报告的真实性和准确性负责。检测机构不得转包检测业务。","sec":"2026-法规"},{"id":"quiz_041","q":"关于建设工程抗震相关主体责任和义务的说法，正确的是？","choices":["建设单位对建设工程抗震设计负责","勘察单位对建设工程抗震勘察报告的真实性负责","设计单位对建设工程抗震设计负责","施工单位对建设工程抗震施工负责"],"answer":1,"analysis":"勘察单位应当对建设工程抗震勘察报告的真实性负责。设计单位应当对建设工程抗震设计负责。","sec":"2026-法规"},{"id":"quiz_042","q":"甲公司租赁乙公司的仓库，租期3年，租金月付。租期届满后，甲公司继续使用仓库并交纳租金，乙公司接受。","choices":["租赁合同继续有效，租期变为不定期","租赁合同自动续约3年","租赁合同自动终止","甲公司需重新签订合同"],"answer":0,"analysis":"租赁期间届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但租赁期限为不定期。","sec":"2026-法规"},{"id":"quiz_043","q":"关于施工生产安全事故应急救援预案实施的说法，正确的是？","choices":["施工单位应当至少每半年组织1次应急救援预案演练","施工单位应当至少每年组织1次应急救援预案演练","施工单位应当至少每2年组织1次应急救援预案演练","施工单位应当至少每3年组织1次应急救援预案演练"],"answer":1,"analysis":"施工单位应当至少每年组织1次生产安全事故应急救援预案演练。","sec":"2026-法规"},{"id":"quiz_044","q":"关于工程监理单位安全责任的说法，正确的是？","choices":["工程监理单位对工程项目的安全负责","工程监理单位对工程项目的安全不承担责任","工程监理单位对工程项目的安全承担监理责任","工程监理单位对工程项目的安全承担连带责任"],"answer":2,"analysis":"工程监理单位对工程项目的安全承担监理责任。","sec":"2026-法规"},{"id":"quiz_045","q":"关于建筑垃圾污染防治的说法，正确的是？","choices":["建筑垃圾可以随意倾倒","建筑垃圾应当及时清运并加以利用","建筑垃圾应与生活垃圾混合处置","建筑垃圾可以露天堆放"],"answer":1,"analysis":"建筑垃圾应当按照规定及时清运，并按照有关规定进行资源化利用或者无害化处置。","sec":"2026-法规"},{"id":"quiz_046","q":"根据《民事诉讼法》，关于第二审人民法院审理上诉案件的说法，正确的是？","choices":["二审法院只审查法律适用问题","二审法院只审查事实问题","二审法院对上诉请求的有关事实和适用法律进行审查","二审法院不开庭审理"],"answer":2,"analysis":"第二审人民法院应当对上诉请求的有关事实和适用法律进行审查。","sec":"2026-法规"},{"id":"quiz_047","q":"下列建设工程中，属于依法必须实行监理的是？","choices":["建筑面积300平方米以下的小型工程","总投资额30万元以下的工程","国家重点建设工程","农民自建低层住宅"],"answer":2,"analysis":"必须实行监理：①国家重点建设工程；②大中型公用事业工程；③成片开发建设的住宅小区工程；④利用外国政府或者国际组织贷款、援助资金的工程；⑤国家规定必须实行监理的其他工程。","sec":"2026-法规"},{"id":"quiz_048","q":"根据《民法典》，下列组织中，属于营利法人的是？","choices":["基金会","社会服务机构","有限责任公司","农村集体经济组织"],"answer":2,"analysis":"营利法人包括有限责任公司、股份有限公司和其他企业法人等。","sec":"2026-法规"},{"id":"quiz_049","q":"甲建筑公司将其承包的某住宅楼工程分包给乙建筑公司。工程竣工后，因甲公司和发包人均拖延支付工程款，乙公司向法院提起诉讼。关于当事人的诉讼地位？","choices":["乙公司为原告，甲公司和发包人为共同被告","乙公司为原告，甲公司为被告，发包人为第三人","乙公司为原告，发包人为被告","乙公司和甲公司为共同原告"],"answer":0,"analysis":"发包人未按照约定支付价款的，承包人（甲）可以催告发包人支付价款。实际施工人（乙）以发包人为被告主张权利的，人民法院可以追加转包人或者违法分包人为本案当事人。","sec":"2026-法规"},{"id":"quiz_050","q":"根据《民法典》，下列情形中，人民法院可能做出继续履行判决的是？","choices":["法律上或者事实上不能履行","债务的标的不适于强制履行","履行费用过高","债权人在合理期限内未请求履行"],"answer":3,"analysis":"继续履行例外情形：①法律上或者事实上不能履行；②债务的标的不适于强制履行；③履行费用过高；④债权人在合理期限内未请求履行。","sec":"2026-法规"},{"id":"quiz_051","q":"关于工资支付的说法，正确的是？","choices":["工资可以以实物代替货币支付","工资应当以货币形式按月支付给劳动者本人","工资可以延期支付","克扣或者无故拖欠劳动者工资的，由劳动行政部门责令支付赔偿金，无需支付工资"],"answer":1,"analysis":"工资应当以货币形式按月支付给劳动者本人。不得克扣或者无故拖欠劳动者的工资。","sec":"2026-法规"},{"id":"quiz_052","q":"关于工程建设国家标准批准发布的说法，正确的是？","choices":["由国务院标准化行政主管部门批准发布","由国务院住房城乡建设主管部门批准发布","由国务院发展改革部门批准发布","由国务院工业和信息化主管部门批准发布"],"answer":0,"analysis":"工程建设国家标准由国务院标准化行政主管部门统一计划、统一审批、统一发布。","sec":"2026-法规"},{"id":"quiz_053","q":"某承包商向水泥厂发函要求以每吨350元的价格购买某标号水泥20吨，并要求水泥厂3日内答复。","choices":["该函件属于要约","该函件属于要约邀请","该函件属于承诺","该函件属于要约磋商"],"answer":0,"analysis":"要约：内容具体确定，表明经受要约人承诺即受其约束。本题中价格、数量、期限均明确，构成要约。","sec":"2026-法规"},{"id":"quiz_054","q":"下列情形中，对建筑企业资质应当予以撤回的是？","choices":["企业不再符合相应建筑业企业资质标准条件的","企业依法终止的","企业超越本企业资质等级承揽工程的","企业出借本企业资质的"],"answer":0,"analysis":"撤回：企业不再符合相应建筑业企业资质标准条件的。撤销：有关主管部门工作人员滥用职权、玩忽职守作出准予许可决定的。注销：建筑业企业资质证书有效期届满未申请延续的。","sec":"2026-法规"},{"id":"quiz_055","q":"根据《行政复议法》，提出行政复议申请的期限是自知道或者应当知道该行政行为之日起？","choices":["30日内","60日内","90日内","6个月内"],"answer":1,"analysis":"公民、法人或者其他组织认为具体行政行为侵犯其合法权益的，可以自知道该具体行政行为之日起60日内提出行政复议申请。","sec":"2026-法规"},{"id":"quiz_056","q":"在工伤认定程序中，职工认为是工伤，用人单位不认为是工伤的，负有举证责任的是？","choices":["职工本人","用人单位","工会","社会保险行政部门"],"answer":1,"analysis":"与用人单位存在劳动关系的劳动者在工作中遭受事故伤害或者患职业病的，职工认为是工伤，用人单位不认为是工伤的，由用人单位承担举证责任。","sec":"2026-法规"},{"id":"quiz_057","q":"关于借贷合同的说法，正确的是？","choices":["借款合同为实践性合同","借款合同为诺成性合同","借款合同必须采用书面形式","借款利息可以预先在本金中扣除"],"answer":0,"analysis":"借款合同是实践性合同，自贷款人提供借款时生效。自然人之间的借款合同可以采用口头形式。","sec":"2026-法规"},{"id":"quiz_058","q":"下列行为中，属于施工单位承揽业务不良行为的是？","choices":["未对建筑材料、建筑构配件、设备和商品混凝土进行检验的","在施工中偷工减料的","允许其他单位或者个人以本单位名义承揽工程的","将承包的工程转包或者违法分包的"],"answer":3,"analysis":"承揽业务不良行为：①利用向发包单位及其工作人员行贿、提供回扣或者给予其他好处等不正当手段承揽业务的；②相互串通投标或者与招标人串通投标的；③以向招标人或者评标委员会成员行贿的手段谋取中标的；④以他人名义投标或者以其他方式弄虚作假，骗取中标的；⑤将承包的工程转包或者违法分包的。","sec":"2026-法规"},{"id":"quiz_059","q":"根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》，下列关于建设工程施工合同效力的说法？","choices":["发包人未取得建设工程规划许可证的，施工合同无效","承包人超越资质等级承揽工程的，施工合同无效","建设工程必须进行招标而未招标的，施工合同无效","以上都正确"],"answer":3,"analysis":"建设工程施工合同无效情形：①承包人未取得建筑施工企业资质或者超越资质等级；②没有资质的实际施工人借用有资质的建筑施工企业名义；③建设工程必须进行招标而未招标或者中标无效；④承包人因转包、违法分包与他人签订的建设工程施工合同；⑤发包人未取得建设工程规划许可证等规划审批手续。","sec":"2026-法规"},{"id":"quiz_060","q":"某工程项目招标过程中，招标人因故终止招标，下列招标人的做法中，正确的是？","choices":["应当及时发布公告，或者以书面形式通知被邀请的或者已经获取资格预审文件、招标文件的潜在投标人","可以不发任何通知","只需要对被邀请的潜在投标人发出通知","只需要在发布招标公告的媒介上发布终止公告"],"answer":0,"analysis":"招标人终止招标的，应当及时发布公告，或者以书面形式通知被邀请的或者已经获取资格预审文件、招标文件的潜在投标人。","sec":"2026-法规"},{"id":"quiz_061","q":"某施工企业购买了一台生产设备，在使用过程中出现故障，导致施工人员受伤。经查，该设备存在质量缺陷。","choices":["施工企业应当承担全部责任","设备生产商应当承担全部责任","施工企业和设备生产商应当承担连带责任","施工企业、设备生产商和受伤人员按过错分担责任"],"answer":1,"analysis":"因产品存在缺陷造成他人损害的，生产者应当承担侵权责任。","sec":"2026-法规"},{"id":"quiz_062","q":"根据《政府采购框架协议采购方式管理暂行办法》，封闭式框架协议确定第二阶段成交供应商的原则？","choices":["最低价","最高分","质量最优","由征集人根据框架协议约定的方法确定"],"answer":3,"analysis":"封闭式框架协议第二阶段由征集人根据框架协议约定的方法确定成交供应商。","sec":"2026-法规"},{"id":"quiz_063","q":"甲与乙签订房屋买卖合同，乙按约定支付了首付款，但未办理过户登记。之后，甲又将房屋出售给丙并办理了过户登记。关于房屋所有权的归属？","choices":["属于甲，因为甲是房屋的原所有人","属于乙，因为乙已经支付了首付款","属于丙，因为丙已经办理了过户登记","甲乙丙共有"],"answer":2,"analysis":"房屋所有权的转移以登记为要件。甲与乙虽然签订了合同，但未办理过户登记，所有权未转移。甲又将房屋出售给丙并办理了过户登记，所有权转移给丙。","sec":"2026-法规"},{"id":"quiz_064","q":"根据《仲裁法》，当事人申请仲裁应当符合的条件有？","choices":["有仲裁协议","有具体的仲裁请求和事实、理由","属于仲裁委员会的受理范围","以上都是"],"answer":3,"analysis":"申请仲裁条件：①有仲裁协议；②有具体的仲裁请求和事实、理由；③属于仲裁委员会的受理范围。","sec":"2026-法规"},{"id":"quiz_065","q":"依据《民事诉讼法》，民事判决书必须载明的事项有？","choices":["案由、诉讼请求、争议的事实和理由","判决认定的事实、理由和适用的法律依据","判决结果和诉讼费用的负担","以上都是"],"answer":3,"analysis":"判决书应当写明：①案由、诉讼请求、争议的事实和理由；②判决认定的事实、理由和适用的法律依据；③判决结果和诉讼费用的负担；④上诉期间和上诉的法院。","sec":"2026-法规"},{"id":"quiz_066","q":"关于建筑市场信用信息的说法，正确的有？","choices":["建筑市场信用信息由基本信息、优良信用信息、不良信用信息组成","建筑市场主体应当通过建筑市场监管公共服务平台统一向社会公开相关信息","各级住房城乡建设主管部门应当依托建筑市场监管公共服务平台建立建筑市场主体信用档案","以上都是"],"answer":3,"analysis":"建筑市场信用信息由基本信息、优良信用信息、不良信用信息组成。建筑市场主体应当通过建筑市场监管公共服务平台统一向社会公开相关信息。各级住房城乡建设主管部门应当依托建筑市场监管公共服务平台建立建筑市场主体信用档案。","sec":"2026-法规"},{"id":"quiz_067","q":"根据《劳动合同法》，用人单位解除劳动合同时，不需要向劳动者支付经济补偿金的情形有？","choices":["劳动者在试用期间被证明不符合录用条件的","劳动者严重违反用人单位的规章制度的","劳动者同时与其他用人单位建立劳动关系，经提出拒不改正的","以上都不需要支付经济补偿金"],"answer":3,"analysis":"用人单位无需支付经济补偿：①劳动者在试用期间被证明不符合录用条件；②劳动者严重违反用人单位规章制度；③劳动者严重失职，营私舞弊，给用人单位造成重大损害；④劳动者同时与其他用人单位建立劳动关系，经提出拒不改正；⑤因欺诈、胁迫致使劳动合同无效；⑥被依法追究刑事责任。","sec":"2026-法规"},{"id":"quiz_068","q":"根据《行政诉讼法》，提起行政诉讼应当符合的法定条件有？","choices":["原告是认为具体行政行为侵犯其合法权益的公民、法人或者其他组织","有明确的被告","有具体的诉讼请求和事实根据","属于人民法院受案范围和受诉人民法院管辖"],"answer":3,"analysis":"起诉条件：①原告是符合规定的公民、法人或者其他组织；②有明确的被告；③有具体的诉讼请求和事实根据；④属于人民法院受案范围和受诉人民法院管辖。","sec":"2026-法规"},{"id":"quiz_069","q":"根据《城乡规划法》，申请办理建设工程规划许可证应当提交？","choices":["使用土地的有关证明文件","建设工程设计方案","建设方案","以上都是"],"answer":3,"analysis":"申请办理建设工程规划许可证应当提交使用土地的有关证明文件、建设工程设计方案等材料。","sec":"2026-法规"},{"id":"quiz_070","q":"关于施工企业按照工程设计图纸施工的说法，正确的有？","choices":["施工企业必须按照工程设计图纸施工，不得擅自修改设计","施工企业发现设计文件有错误的，应当及时提出意见和建议","设计单位对设计文件负责，不受施工企业的意见影响","A和B"],"answer":3,"analysis":"施工企业必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。","sec":"2026-法规"},{"id":"quiz_071","q":"关于投标文件提交的说法，正确的有？","choices":["投标文件应当对招标文件提出的实质性要求和条件作出响应","投标文件应在投标截止时间前提交","投标文件逾期送达的，招标人应当拒收","以上都是"],"answer":3,"analysis":"投标文件应当对招标文件的实质性要求和条件作出响应，逾期送达的招标人应当拒收。","sec":"2026-法规"},{"id":"quiz_072","q":"关于生产安全事故等级划分的说法，正确的有？","choices":["特别重大事故：造成30人以上死亡","重大事故：造成10人以上30人以下死亡","较大事故：造成3人以上10人以下死亡","一般事故：造成3人以下死亡"],"answer":3,"analysis":"事故等级（死亡人数）：①特别重大：30人以上；②重大：10~30人；③较大：3~10人；④一般：3人以下。","sec":"2026-法规"},{"id":"quiz_073","q":"根据《行政许可法》，下列规范性文件中，可以设定行政许可的有？","choices":["法律","行政法规","地方性法规","以上都是"],"answer":3,"analysis":"行政许可设定权：①法律可以设定行政许可；②行政法规可以在法律设定的行政许可事项范围内作出规定；③地方性法规可以在法律、行政法规设定的行政许可事项范围内作出规定；④规章可以在上位法设定的行政许可事项范围内作出规定；⑤省级人民政府规章可以设定临时性行政许可。","sec":"2026-法规"},{"id":"quiz_074","q":"根据《建设工程质量管理条例》，属于勘察、设计单位质量责任和义务的有？","choices":["勘察、设计单位应当依法取得相应等级的资质证书","勘察、设计单位对其勘察、设计的质量负责","注册执业人员应当在设计文件上签字","以上都是"],"answer":3,"analysis":"勘察、设计单位的质量责任和义务：①应当依法取得相应等级的资质证书；②对其勘察、设计的质量负责；③注册执业人员应当在设计文件上签字，对设计文件负责。","sec":"2026-法规"},{"id":"quiz_075","q":"关于施工企业安全生产费用提取管理的说法，正确的有？","choices":["施工企业应当按照国家规定提取安全生产费用","安全生产费用专项用于安全生产","安全生产费用不得挪作他用","以上都是"],"answer":3,"analysis":"施工企业应当按照国家规定提取安全生产费用，专项用于安全生产，不得挪作他用。","sec":"2026-法规"},{"id":"quiz_076","q":"某建设工程已经完工，但施工单位在竣工结算阶段被告知施工合同无效。根据《民法典》？","choices":["合同无效，但可以参照合同约定支付工程价款","合同无效，施工单位无权要求支付工程价款","合同无效，只能要求返还材料款","以上都不对"],"answer":0,"analysis":"建设工程施工合同无效，但建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。","sec":"2026-法规"},{"id":"quiz_077","q":"关于无障碍环境建设保障措施的说法，正确的有？","choices":["国家鼓励和支持无障碍环境建设","无障碍设施应当与建设工程同步设计、同步施工、同步验收","无障碍设施的所有人和管理人应当对无障碍设施进行保护","以上都是"],"answer":3,"analysis":"国家鼓励和支持无障碍环境建设。无障碍设施应当与建设工程同步设计、同步施工、同步验收投入使用。无障碍设施的所有人和管理人应当对无障碍设施进行保护。","sec":"2026-法规"},{"id":"quiz_078","q":"根据《建筑施工企业安全生产许可证管理规定》，关于施工企业取得安全生产许可证后行为的说法？","choices":["不得转让、冒用或者伪造安全生产许可证","不得降低安全生产条件","应当加强日常安全生产管理","以上都是"],"answer":3,"analysis":"取得安全生产许可证后不得转让、冒用或者伪造安全生产许可证，不得降低安全生产条件，应当加强日常安全生产管理。","sec":"2026-法规"},{"id":"quiz_079","q":"根据《注册建造师管理规定》，关于注册建造师执业的说法，正确的有？","choices":["注册建造师应当在其注册证书所注明的专业范围内从事建设工程施工管理活动","注册建造师不得同时在两个或者两个以上施工企业受聘","注册建造师不得以个人名义承接业务","以上都是"],"answer":3,"analysis":"注册建造师执业：①在其注册证书所注明的专业范围内从事施工管理活动；②不得同时在两个或两个以上企业受聘；③不得以个人名义承接业务；④应当遵守法律法规和执业规范。","sec":"2026-法规"},{"id":"quiz_080","q":"施工作业人员依法享有的安全生产权利有？","choices":["知情权","建议权","拒绝权","以上都是"],"answer":3,"analysis":"施工作业人员安全生产权利：①知情权（了解作业场所及岗位危险因素）；②建议权（对安全生产工作提出建议）；③拒绝权（拒绝违章指挥、强令冒险作业）；④紧急避险权；⑤批评检举权；⑥获得劳动保护用品权。","sec":"2026-法规"},{"id":"quiz_081","q":"根据《企业投资项目核准和备案管理条例》，企业办理投资项目核准手续时，仅需向核准机关提交？","choices":["项目申请书","项目建议书","项目可行性研究报告","项目开工申请报告"],"answer":0,"analysis":"企业办理投资项目核准手续时，仅需向核准机关提交项目申请书，不再经过批准项目建议书、可行性研究报告和开工报告等程序。","sec":"2026-管理"},{"id":"quiz_082","q":"一般情况下，公路工程项目的开工时间是指？","choices":["工程地质勘察开始时间","平整场地开始施工时间","临时道路和水、电工程开始施工时间","土石方工程开始施工时间"],"answer":3,"analysis":"铁路、公路、水库等需要进行大量土石方工程的，以正式开始进行土方、石方施工的时间为开工日期。","sec":"2026-管理"},{"id":"quiz_083","q":"在联合体承包模式下，关于施工合同签订的说法，正确的是？","choices":["联合体各方分别与发包人签订施工合同","联合体各方就中标项目向发包人承担连带责任","联合体中标的，联合体各方应当共同与发包人签订施工合同","联合体各方对各自承担的工程向发包人承担责任"],"answer":1,"analysis":"联合体中标的，联合体各方应当共同与发包人签订合同，就中标项目向发包人承担连带责任。","sec":"2026-管理"},{"id":"quiz_084","q":"某分项工程目标成本为某值，实际成本为280.5万元。影响该成本的三个因素的重要性排序依次为：产量→消耗量→单价。以下哪个是成本分析的正确方法？","choices":["比较法","因素分析法","比率法","差额计算法"],"answer":1,"analysis":"因素分析法又称连环置换法，用来分析各种因素对成本的影响程度。题目中给出了三个因素按重要性排序，符合因素分析法的特征。","sec":"2026-管理"},{"id":"quiz_085","q":"施工质量保证体系中需明确各参与方施工质量责任和义务的是？","choices":["施工组织设计","施工质量保证计划","施工方案","施工技术交底"],"answer":1,"analysis":"施工质量保证计划是质量保证体系的纲领性文件，需明确各参与方的施工质量责任和义务。","sec":"2026-管理"},{"id":"quiz_086","q":"施工成本管理的主要工作包括：①成本控制；②成本计划；③成本分析；④成本管理绩效考核；⑤成本核算。","choices":["①②③④⑤","①②③⑤④","①③②⑤④","②①③④⑤"],"answer":1,"analysis":"施工成本管理的主要工作：①成本预测；②成本计划；③成本控制；④成本核算；⑤成本分析；⑥成本考核。","sec":"2026-管理"},{"id":"quiz_087","q":"工程开工报审表及相关资料经总监理工程师签认并报送（ ）签署同意意见后，项目监理机构方可签发工程开工令。","choices":["建设单位项目负责人","施工单位项目经理","设计单位项目负责人","质量监督机构负责人"],"answer":0,"analysis":"工程开工报审表及相关资料经总监理工程师签认并报送建设单位签署同意意见后，项目监理机构方可签发工程开工令。","sec":"2026-管理"},{"id":"quiz_088","q":"施工项目绿色施工管理的第一责任人是？","choices":["项目经理","项目总工","施工员","质量员"],"answer":0,"analysis":"项目经理是施工项目绿色施工管理的第一责任人。","sec":"2026-管理"},{"id":"quiz_089","q":"某施工项目管理组织机构如下图所示，其组织结构形式属于？","choices":["直线式","职能式","矩阵式","事业部式"],"answer":1,"analysis":"职能式组织结构的特点是每个职能部门都可以对下级执行者下达指令。","sec":"2026-管理"},{"id":"quiz_090","q":"下列影响施工进度的各类因素中，最大干扰因素是？","choices":["人为因素","技术因素","材料、设备因素","机具因素"],"answer":0,"analysis":"影响施工进度的因素中，人为因素是最大的干扰因素。","sec":"2026-管理"},{"id":"quiz_091","q":"采用工程量清单计价时，措施项目清单宜采用的计价方式是？","choices":["总价方式","综合单价方式","工料单价方式","成本加酬金方式"],"answer":1,"analysis":"措施项目清单的计价方式应根据措施项目的具体内容确定，可以采用综合单价法或总价法。","sec":"2026-管理"},{"id":"quiz_092","q":"特种作业操作证申请复审或者延期复审前，特种作业人员应参加必要的安全培训时间不少于？","choices":["4学时","8学时","16学时","24学时"],"answer":1,"analysis":"特种作业操作证申请复审或者延期复审前，特种作业人员应当参加必要的安全培训并考试合格。安全培训时间不少于8学时。","sec":"2026-管理"},{"id":"quiz_093","q":"根据《建设工程项目管理规范》，编制施工成本计划首先要开展的工作是？","choices":["成本预测","成本核算","成本分析","成本考核"],"answer":0,"analysis":"施工成本计划是建立在成本预测的基础上的，首先要开展成本预测工作。","sec":"2026-管理"},{"id":"quiz_094","q":"下列与施工质量相关的费用中，属于预防成本的是？","choices":["质量检测设备折旧费","质量管理人员工资","质量培训费","返工损失费"],"answer":2,"analysis":"预防成本：质量培训费、质量策划费、新工艺评审费等。鉴定成本：质量检测设备折旧费、质量管理人员工资。内部故障成本：返工损失费。","sec":"2026-管理"},{"id":"quiz_095","q":"施工单位按进展时间编制的施工进度计划是？","choices":["施工总进度计划","单位工程进度计划","分部分项工程进度计划","年度施工进度计划"],"answer":3,"analysis":"按进度计划的时间分：①施工总进度计划；②单位工程进度计划；③分部分项工程进度计划。","sec":"2026-管理"},{"id":"quiz_096","q":"某施工合同文件中的合同协议书、中标通知书、专用合同条款、已标价工程量清单对某项内容的约定不一致。","choices":["以合同协议书为准","以中标通知书为准","以专用合同条款为准","以已标价工程量清单为准"],"answer":0,"analysis":"合同文件组成及解释顺序：①合同协议书；②中标通知书；③投标函及投标函附录；④专用合同条款；⑤通用合同条款；⑥技术标准和要求；⑦图纸；⑧已标价工程量清单；⑨其他合同文件。","sec":"2026-管理"},{"id":"quiz_097","q":"根据《建筑工程绿色施工规范》，'绿色施工的协调机制'属于（ ）的绿色施工职责。","choices":["建设单位","施工单位","设计单位","监理单位"],"answer":3,"analysis":"根据《建筑工程绿色施工规范》，建立绿色施工的协调机制属于监理单位的职责。","sec":"2026-管理"},{"id":"quiz_098","q":"职业健康安全管理体系运行过程中'管理体系文件分发'之后紧接着应进行的工作是？","choices":["管理体系文件学习","管理体系文件培训","管理体系文件实施","管理体系文件评审"],"answer":2,"analysis":"职业健康安全管理体系运行过程：①体系文件分发→②体系文件学习、培训→③体系文件实施→④管理评审→⑤持续改进。","sec":"2026-管理"},{"id":"quiz_099","q":"根据《建筑工程绿色施工规范》，建筑工程现场工地临房、临时围挡材料的重复使用率力争达到？","choices":["50%","60%","70%","80%"],"answer":2,"analysis":"临房、临时围挡材料的重复使用率力争达到70%。","sec":"2026-管理"},{"id":"quiz_100","q":"关于施工组织设计动态管理的说法，错误的是？","choices":["施工组织设计应随主客观条件变化进行调整","项目施工前编制施工组织设计，施工过程中可不调整","施工组织设计调整后应经监理工程师签认","施工组织设计的修改和补充由项目负责人主持"],"answer":1,"analysis":"施工组织设计应实行动态管理。施工过程中应根据实际情况变化及时调整施工组织设计。","sec":"2026-管理"},{"id":"quiz_101","q":"施工过程中发生应最终逐级上报至省、自治区、直辖市人民政府应急管理部门和负有安全生产监督管理职责的有关部门的事故是？","choices":["特别重大事故","重大事故","较大事故","一般事故"],"answer":1,"analysis":"特别重大事故、重大事故应逐级上报至国务院应急管理部门和负有安全生产监督管理职责的有关部门。较大事故上报至省、自治区、直辖市人民政府应急管理部门。","sec":"2026-管理"},{"id":"quiz_102","q":"关于双代号网络图绘图规则的说法，正确的是？","choices":["双代号网络图中可以出现循环回路","双代号网络图中不能有缺口","双代号网络图中可以有多个起点节点","双代号网络图中可以有多个终点节点"],"answer":1,"analysis":"双代号网络图绘图规则：①不能有缺口；②不能有循环回路；③只能有一个起点节点和一个终点节点。","sec":"2026-管理"},{"id":"quiz_103","q":"下列施工企业安全风险管控措施中，属于组织方面的措施是？","choices":["配备符合要求的防护用品","制定安全操作规程","建立安全风险分级管控制度","设置安全警示标志"],"answer":2,"analysis":"安全风险管控措施：①组织措施（建立制度、明确职责、培训教育）；②技术措施（工艺技术、防护设施）；③管理措施（检查、奖惩）；④应急措施。","sec":"2026-管理"},{"id":"quiz_104","q":"某工程划分为四个施工段，分为I、II、III三个施工过程，组织等节奏流水施工。","choices":["4","6","12","24"],"answer":2,"analysis":"等节奏流水施工工期：T = (M+N-1)×K = (4+3-1)×1 = 6。但本题问的是施工过程数。施工段数M=4，施工过程数N=3。","sec":"2026-管理"},{"id":"quiz_105","q":"某承包人于2025年11月1日提交工程竣工验收申请报告，发包人于11月24日组织竣工验收，并于12月1日完成竣工验收。","choices":["2025年11月1日","2025年11月24日","2025年12月1日","2025年12月8日"],"answer":2,"analysis":"建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期。","sec":"2026-管理"},{"id":"quiz_106","q":"为了尽早获得工程进度款，并提高工程按期竣工保证率，施工单位编制网络进度计划时，应当？","choices":["压缩关键工作的持续时间","压缩所有工作的持续时间","优先压缩非关键工作的持续时间","优先压缩有潜力的非关键工作的持续时间"],"answer":3,"analysis":"在编制网络进度计划时，应当优先压缩有潜力的非关键工作的持续时间，挖掘非关键工作的潜力。","sec":"2026-管理"},{"id":"quiz_107","q":"涉及结构安全、节能、环境保护和主要使用功能的试块、试件、材料，在进场前按规定必须？","choices":["自检合格后即可使用","监理工程师见证取样送检","直接投入使用","由项目经理决定"],"answer":1,"analysis":"涉及结构安全、节能、环境保护和主要使用功能的试块、试件、材料，实施见证取样送检制度。","sec":"2026-管理"},{"id":"quiz_108","q":"在环境管理体系的建立过程中，需要确定相关方的要求。其中，受建筑企业活动和决策影响的群体属于？","choices":["内部相关方","外部相关方","其他相关方","潜在相关方"],"answer":1,"analysis":"外部相关方指受组织活动和决策影响的群体，如客户、供应商、公众、媒体、政府机构、民间团体等。","sec":"2026-管理"},{"id":"quiz_109","q":"下列质量管理体系文件中，属于企业战略管理纲领性文件的是？","choices":["质量方针","质量目标","质量手册","程序文件"],"answer":2,"analysis":"质量手册是企业的纲领性文件，规定企业的质量方针、目标、组织结构、职责权限等。","sec":"2026-管理"},{"id":"quiz_110","q":"下列单位工程施工组织设计的内容中，属于纲领性内容的是？","choices":["施工方案","施工进度计划","施工平面图","工程概况"],"answer":3,"analysis":"单位工程施工组织设计内容：①工程概况及施工特点分析；②施工方法及技术措施；③施工进度计划；④施工准备工作计划；⑤劳动力、材料、机具需用量计划；⑥施工平面图；⑦技术经济指标。","sec":"2026-管理"},{"id":"quiz_111","q":"关于工程网络计划工期的说法，正确的是？","choices":["计算工期是根据网络计划时间参数计算得到的工期","要求工期是根据工期定额计算的工期","计划工期是根据要求工期和计算工期确定的","以上都正确"],"answer":3,"analysis":"网络计划时间参数：①计算工期T_c：根据网络计划时间参数计算得到的工期；②要求工期T_r：根据工期定额计算的工期；③计划工期T_p：根据要求工期和计算工期确定的工期。","sec":"2026-管理"},{"id":"quiz_112","q":"根据《危险性较大的分部分项工程安全管理规定》，对于超过一定规模的危险性较大的分部分项工程，专项施工方案应？","choices":["由施工单位技术负责人审核签字","由施工单位技术负责人组织专家论证","由施工单位技术负责人组织专家对专项施工方案进行论证、审查","由项目负责人组织专家对专项施工方案进行论证、审查"],"answer":1,"analysis":"超过一定规模的危险性较大的分部分项工程专项施工方案应当由施工单位技术负责人组织本单位施工技术、安全、质量等部门的专业技术人员进行审核，审核合格后，由施工单位技术负责人签字，并组织召开专家论证会对专项施工方案进行论证。","sec":"2026-管理"},{"id":"quiz_113","q":"工程施工前，施工单位制定的单位工程、分部工程、分项工程和检验批的划分方案，最终应？","choices":["由项目经理审批","由项目总工审批","由监理单位审批","由建设单位审批"],"answer":2,"analysis":"项目划分方案应由项目法人组织监理、设计及施工等单位研究确定，并报质量监督机构确认。","sec":"2026-管理"},{"id":"quiz_114","q":"关于施工现场的油漆、涂料等有毒有害废弃物处置措施的说法，正确的是？","choices":["可以直接填埋","可以混入生活垃圾处理","应单独收集、专门处理","可以焚烧处理"],"answer":2,"analysis":"施工现场的油漆、涂料等有毒有害废弃物应单独收集、专门处理，不得混入生活垃圾或随意处置。","sec":"2026-管理"},{"id":"quiz_115","q":"编制施工总进度计划时，确定各单位工程施工期限后，紧接着进行的工作是？","choices":["编制施工总进度计划","编制施工准备工作计划","编制资源需用量计划","编制施工总平面图"],"answer":0,"analysis":"施工总进度计划编制步骤：①收集编制依据资料；②计算工程量；③确定各单位工程的开竣工时间；④编制施工总进度计划；⑤检查和调整施工总进度计划。","sec":"2026-管理"},{"id":"quiz_116","q":"关于流水施工横道图表示法的说法，正确的是？","choices":["横道图可以清晰地反映各工作之间的逻辑关系","横道图可以反映工作的机动时间","横道图可以反映关键工作","横道图直观易读，但不能反映各工作的逻辑关系"],"answer":3,"analysis":"横道图优点：直观易懂；缺点：不能清晰反映各工作之间的逻辑关系，不能反映关键工作和机动时间。","sec":"2026-管理"},{"id":"quiz_117","q":"某双代号时标网络计划（时间单位：天）如下图所示，工作A2的总时差是（ ）天。","choices":["0","1","2","3"],"answer":1,"analysis":"时标网络计划中工作的总时差等于本工作箭线后的波形线长度加上其紧后工作总时差的最小值。","sec":"2026-管理"},{"id":"quiz_118","q":"根据《建设工程文件归档规范》，'竣工移交证书'应归档的'工程文件类别'是？","choices":["监理文件","施工文件","竣工文件","管理文件"],"answer":2,"analysis":"竣工移交证书属于工程竣工文件，竣工验收后归档。","sec":"2026-管理"},{"id":"quiz_119","q":"根据《企业安全生产费用提取和使用管理办法》，建设单位应在合同中单独约定并于工程开工日之前将？","choices":["安全文明施工费一次性全额拨付给施工单位","安全文明施工费按比例预付给施工单位","安全文明施工费按工程进度支付给施工单位","安全文明施工费由施工单位垫付"],"answer":0,"analysis":"建设单位应在合同中单独约定并于工程开工日之前将安全文明施工费一次性全额拨付给施工单位。","sec":"2026-管理"},{"id":"quiz_120","q":"为降低施工中的材料成本，应主要控制材料的？","choices":["采购成本","使用成本","采购成本和使用成本","运输成本"],"answer":2,"analysis":"材料成本控制应贯穿于材料采购、运输、储存、使用等全过程，重点是采购成本和使用成本。","sec":"2026-管理"},{"id":"quiz_121","q":"某工程施工过程中，突发百年一遇的洪水，造成已经运至施工场地的部分材料被冲毁，损失30万元。","choices":["发包人应承担30万元损失","承包人应承担30万元损失","发包人和承包人各承担15万元","按风险分担原则分担"],"answer":1,"analysis":"承包人采购的材料运至施工场地后的保管由承包人负责，因不可抗力造成的损失由承包人承担，但可以主张材料款。","sec":"2026-管理"},{"id":"quiz_122","q":"根据《招标投标法实施条例》，某工程中标合同金额为8000万元，招标文件要求中标人提交履约担保。","choices":["不超过800万元","不超过1600万元","不超过2400万元","不超过8000万元"],"answer":0,"analysis":"履约保证金不得超过中标合同金额的10%。","sec":"2026-管理"},{"id":"quiz_123","q":"根据《标准设备采购招标文件》，关于设备监造的说法，正确的是？","choices":["设备监造由招标人负责","设备监造由投标人负责","设备监造由监理人负责","设备监造由采购人负责"],"answer":3,"analysis":"设备监造由采购人负责。采购人可自行监造或委托监造人监造。","sec":"2026-管理"},{"id":"quiz_124","q":"下列施工质量事故预防措施中，属于技术核定工作的是？","choices":["熟悉施工图纸","施工组织设计审查","质量交底","设计变更处理"],"answer":3,"analysis":"技术核定：施工过程中发现图纸与实际情况不符，或施工条件变化，需要对原设计进行修改完善。","sec":"2026-管理"},{"id":"quiz_125","q":"按事故责任分，项目负责人不按规范规程组织施工造成的施工质量事故属于？","choices":["指导责任事故","操作责任事故","自然灾害事故","技术原因事故"],"answer":0,"analysis":"指导责任事故：项目负责人不按规范规程组织施工，或违章指挥造成的质量事故。","sec":"2026-管理"},{"id":"quiz_126","q":"分部分项工程成本分析应对已完分部分项工程进行'三算'对比，下列正确的是？","choices":["预算成本、目标成本和实际成本","计划成本、目标成本和实际成本","责任成本、预算成本和目标成本","责任成本、直接成本和间接成本"],"answer":0,"analysis":"分部分项工程成本分析的方法是进行预算成本、目标成本和实际成本的'三算'对比。","sec":"2026-管理"},{"id":"quiz_127","q":"下列施工定额类型中，定额消耗量与时间无关的是？","choices":["人工定额","材料消耗定额","施工机具消耗定额","施工仪器仪表消耗定额"],"answer":1,"analysis":"材料消耗定额的消耗量与时间无关，而人工定额、施工机具消耗定额均有时间定额和产量定额两种表现形式。","sec":"2026-管理"},{"id":"quiz_128","q":"根据《建设工程项目管理规范》，施工项目管理机构进行风险评估内容主要包括？","choices":["风险发生的时点、部位和风险损失量","风险发生的概率、风险损失量和风险应对措施","风险发生的概率、风险损失量和风险等级","风险发生的部位、时点和危害程度"],"answer":2,"analysis":"风险评估内容主要包括：①风险因素发生的概率；②风险损失量；③风险等级。","sec":"2026-管理"},{"id":"quiz_129","q":"根据《标准材料采购招标文件》，合同材料的质量保证期应为？","choices":["自合同材料到货之日起至合同材料验收证书签发之日满12个月止","自合同材料到货之日起至进度款支付函签署之日满12个月止","自合同材料交付之日起至合同材料验收证书或进度款支付函签署之日起12个月止（以后到的为准）","自合同材料交付之日起至合同材料验收证书或进度款支付函签署之日起12个月止（以先到的为准）"],"answer":3,"analysis":"质量保证期自合同材料验收之日起算，至合同材料验收证书或进度款支付函签署之日起12个月止（以先到的为准）。","sec":"2026-管理"},{"id":"quiz_130","q":"文明施工是建筑企业承担社会责任的具体体现，企业对员工应承担的责任和义务包括？","choices":["质量安全保障、合规经营","减少施工干扰、社区共建","职业健康安全、权益保障","生态保护、资源节约"],"answer":2,"analysis":"建筑企业对员工的责任包括员工职业健康安全、权益保障。","sec":"2026-管理"},{"id":"quiz_131","q":"下列职业健康安全管理体系标准的基本要求中，属于组织所处环境要素的是？","choices":["确定职业健康安全管理体系范围","明确领导作用与承诺的内容","建立并实施职业健康安全方针","分配组织的角色、职责和权限"],"answer":0,"analysis":"确定职业健康安全管理体系范围属于组织所处环境要素。","sec":"2026-管理"},{"id":"quiz_132","q":"某工程项目检查时已完成工作计划费用为410万元，计划工作计划费用为400万元，已完工作实际费用为430万元，该项目检查时的费用绩效指数为？","choices":["0.953","0.930","0.976","1.075"],"answer":0,"analysis":"CPI=已完工程预算费用(BCWP)/已完工程实际费用(ACWP)=410/430=0.953。","sec":"2026-管理"},{"id":"quiz_133","q":"根据《招标投标法实施条例》，招标人对招标文件进行澄清或者修改内容可能影响投标文件编制的，应当书面通知所有获取招标文件潜在投标人的最迟时间是投标截止时间（ ）日前。","choices":["3","15","10","30"],"answer":1,"analysis":"招标人应在投标截止时间至少15日前，以书面形式通知所有获取招标文件的潜在投标人。","sec":"2026-管理"},{"id":"quiz_134","q":"在分项工程施工前，施工单位应针对关键部位或技术难度大、施工复杂的检验批分项工程编制技术交底书，并报（ ）审查。","choices":["建设单位","项目监理机构","设计单位","质量监督机构"],"answer":1,"analysis":"施工单位的技术交底书要报项目监理机构，经审查后实施。","sec":"2026-管理"},{"id":"quiz_135","q":"检验工序质量时，抽取检验样本宜采用的方法是？","choices":["系统随机抽样","简单随机抽样","分层随机抽样","整群随机抽样"],"answer":0,"analysis":"系统随机抽样主要用于工序质量检验。","sec":"2026-管理"},{"id":"quiz_136","q":"根据《建设工程安全生产管理条例》，对于超过一定规模的危险性较大的分部分项工程，必须先由（ ）向项目技术负责人交底。","choices":["建设单位技术负责人","施工单位技术负责人","总监理工程师","施工项目经理"],"answer":1,"analysis":"对于超过一定规模的危险性较大的分部分项工程，必须先由施工单位技术负责人向项目技术负责人交底。","sec":"2026-管理"},{"id":"quiz_137","q":"将拟建工程在平面上划分为若干劳动量相等或大致相等的施工作业面，反映工作面数量的参数是？","choices":["流水强度","施工过程数","流水步距","施工段数"],"answer":3,"analysis":"施工段是指在组织流水施工时，将拟建工程在平面上划分成若干个劳动量相等或大致相等的施工区段。","sec":"2026-管理"},{"id":"quiz_138","q":"在施工进度调整系统过程中，进度调整工作包括：①分析偏差的影响；②分析偏差产生原因；③确定限制条件；④调整施工进度计划。正确的顺序是？","choices":["①②④③","③②①④","②①③④","②③①④"],"answer":2,"analysis":"施工进度调整系统过程：①分析进度偏差产生原因→②分析进度偏差对后续工作及总工期的影响→③确定后续工作及总工期的限制条件→④调整施工进度计划。","sec":"2026-管理"},{"id":"quiz_139","q":"工程质量的形成过程包括建设工程投资决策和建设实施过程，其中，工程质量形成的关键阶段是？","choices":["工程施工阶段","工程投资决策阶段","工程勘察设计阶段","工程竣工验收阶段"],"answer":0,"analysis":"工程施工阶段是工程质量控制的关键阶段。","sec":"2026-管理"},{"id":"quiz_140","q":"某分部工程发生了成本偏差，项目经理部对其施工过程进行技术经济分析，确定最佳施工方案，该成本纠偏措施属于？","choices":["组织措施","技术措施","经济措施","合同措施"],"answer":1,"analysis":"施工过程中降低成本的技术措施包括进行技术经济分析，确定最佳的施工方案。","sec":"2026-管理"},{"id":"quiz_141","q":"根据《建设工程施工劳务分包合同（示范文本）》，关于办理劳务分包相关保险的说法，正确的有？","choices":["工程承包人应为提供给劳务分包人使用的施工机械办理保险","劳务分包人必须为从事危险作业的职工办理意外伤害保险","劳务分包人施工开始前，工程承包人应获得发包人为劳务分包人办理的保险","劳务分包人必须为施工场地内自有机械设备办理保险，并支付费用","运至施工场地用于劳务施工的材料，应由劳务分包人办理保险并支付保费"],"answer":[0,1,3],"analysis":"C工程承包人应获得发包人为施工场地内的自有人员及第三人人员生命财产办理的保险。E运至施工场地的材料和待安装设备，由工程承包人办理或获得保险。","sec":"2026-管理"},{"id":"quiz_142","q":"根据《项目管理知识体系指南》，在价值交付系统中，组织治理体系的要素有？","choices":["监督","控制","价值评估","决策能力","引导和支持"],"answer":[0,1,2,3],"analysis":"组织治理体系包括监督、控制、价值评估及决策能力等要素。","sec":"2026-管理"},{"id":"quiz_143","q":"下列施工质量统计分析方法中，可用于过程评价或过程控制的有？","choices":["直方图法","排列图法","因果分析图法","控制图法","相关图法"],"answer":[0,3],"analysis":"直方图法可用于过程评价；控制图法是典型的动态过程控制方法。排列图法主要寻找主要质量问题；因果分析图法分析原因；相关图法分析两变量相关关系。","sec":"2026-管理"},{"id":"quiz_144","q":"施工责任成本的组成包括？","choices":["人工费和材料费","施工机具使用费","专业分包费","措施费和间接费","企业管理费"],"answer":[0,1,2,3],"analysis":"施工责任成本由人工费、材料费、施工机具使用费、专业分包费、措施费、间接费、其他费用组成。","sec":"2026-管理"},{"id":"quiz_145","q":"建设工程施工企业安全生产费用可用于？","choices":["维护安全防护设施设备支出","安全生产责任保险","企业人员发现并报告事故隐患的奖励支出","企业安全管理人员薪酬和福利支出","施工现场重大危险源检测监测"],"answer":[0,1,2,4],"analysis":"企业职工薪酬、福利不得从企业安全生产费用中支出。","sec":"2026-管理"},{"id":"quiz_146","q":"职业健康安全管理体系运行过程中，管理评审的内容包括？","choices":["职业健康安全方针持续有效性","职业健康安全目标、指标的持续适宜性","职业健康安全目标、指标和职业健康安全绩效的实现程度","职业健康安全管理体系偏离涉及机构及人员资格情况","职业健康安全管理体系内部审核结果"],"answer":[0,1,2,4],"analysis":"管理评审内容包括职业健康安全方针持续有效性、目标指标的持续适宜性、目标指标和绩效的实现程度、内部审核结果等。","sec":"2026-管理"},{"id":"quiz_147","q":"根据《建筑工程专业分包合同（示范文本）》，分包人违约的情形有？","choices":["分包人与监理人发生直接工作联系","分包人将承包的分包工程转包","因承包人不按分包合同约定支付工程款，导致分包人无法按月施工","因分包人原因不能按照分包协议约定的竣工日期竣工","因发包人提供的材料不合格导致分包人工程质量达不到约定的标准"],"answer":[0,1,3],"analysis":"分包人违约情形包括：与发包人或监理人发生直接工作联系；将分包工程转包或再分包；因分包人原因不能按期竣工；因分包人原因工程质量达不到标准等。","sec":"2026-管理"},{"id":"quiz_148","q":"工程质量缺陷及事故处理的基本方法有？","choices":["返修处理","限期处理","加固处理","返工处理","限制使用"],"answer":[0,2,3,4],"analysis":"工程质量缺陷及事故处理的基本方法：返修处理、加固处理、返工处理、限制使用、不作处理。","sec":"2026-管理"},{"id":"quiz_149","q":"关于非节奏流水施工特点的说法，正确的有？","choices":["相邻施工过程的流水步距均相等","各施工过程在各施工段上的流水节拍不全相等","专业工作队数等于施工过程数","所有施工队均无空闲","各专业工作队能够连续作业"],"answer":[1,2,4],"analysis":"非节奏流水施工特点：各施工过程在各施工段上的流水节拍不全相等；相邻施工过程的流水步距不尽相等；专业工作队数等于施工过程数；各专业工作队能够连续作业，但有的施工段之间可能有空闲时间。","sec":"2026-管理"},{"id":"quiz_150","q":"某双代号网络图如下图所示，工作A的紧后工作有？","choices":["工作C","工作D","工作E","工作H","工作G"],"answer":[0,1,2,4],"analysis":"在双代号网络图中，紧排在本工作之后的工作称为紧后工作。A的紧后工作包括C、D、E、G。","sec":"2026-管理"},{"id":"quiz_151","q":"根据《标准施工招标文件》，承包人的主要义务包括？","choices":["组织竣工验收","编制工程施工措施计划","负责施工场地及周边环境与生态的保护工作","办理取得出入施工场地的专用道路和通行权","负责施工现场的交通道路和临时工程的修建、维护"],"answer":[1,2,4],"analysis":"承包人主要义务包括编制工程实施措施计划、负责施工现场内交通道路和临时工程、负责施工场地及周边环境与生态的保护等。组织竣工验收和办理施工场地专用道路通行权是发包人的义务。","sec":"2026-管理"},{"id":"quiz_152","q":"专项施工方案专家论证的主要内容有？","choices":["专项施工方案的编制主体是否具备资格","专项施工方案内容是否完整、可行","专项施工方案计算书和验算依据是否符合有关标准规范","施工图是否符合有关标准规范","专项施工方案是否满足现场实际情况，并能够确保施工安全"],"answer":[1,2,4],"analysis":"专家论证的主要内容：①专项施工方案内容是否完整、可行；②计算书和验算依据、施工图是否符合有关标准规范；③是否满足现场实际情况，并能够确保施工安全。","sec":"2026-管理"},{"id":"quiz_153","q":"关于施工进度控制S曲线比较法的说法，正确的有？","choices":["横坐标通常表示累计完成任务量，纵坐标表示时间","只能用于整个工程的整体进度比较，不能用于分项工程","在S曲线比较图中可直接读出实际超额完成或拖欠的任务量","若实际进展点落在计划S曲线左侧，表明实际进度滞后","通过S曲线比较法可以直接判断实际进度是超前还是拖后"],"answer":[2,4],"analysis":"A横坐标表示时间，纵坐标表示累计完成工程任务量。B也可以用于分项工程。D若实际进展点落在计划S曲线左侧，表明实际进度超前。","sec":"2026-管理"},{"id":"quiz_154","q":"根据《建筑与市政工程绿色施工评价标准》，下列施工现场环境保护措施中，属于废气排放控制'一般项'内容的有？","choices":["现场采用清洁燃料","机械设备废气排放符合国家年检要求","现场搅拌应设有密闭和防尘措施","现场厨房烟气净化后排放","在敏感区域内的施工现场喷漆作业应有防扩散措施"],"answer":[1,3,4],"analysis":"废气排放控制内容包括：车辆及机械设备废气排放符合国家年检要求；现场厨房烟气净化后排放；在敏感区域内的施工现场进行喷漆作业时设有防挥发物扩散措施。","sec":"2026-管理"},{"id":"quiz_155","q":"根据《标准施工招标文件》，在履行合同中，应进行变更的情况有？","choices":["改变合同中某项工作的质量要求","改变合同工程中某项工作的劳务分包单位","改变合同中某项工作已批准的施工工艺","发包人取消合同中的某项工作，并将其交给第三方实施","改变合同工程中某项工作的施工时间"],"answer":[0,2,4],"analysis":"应进行变更的情况包括：取消合同中任何一项工作（但不能转由发包人或其他人实施）；改变合同中任何一项工作的质量或其他特性；改变合同中任何一项工作的施工时间或改变已批准的施工工艺或顺序等。","sec":"2026-管理"},{"id":"quiz_156","q":"根据《工程施工废弃物再生利用技术规范》，关于施工现场垃圾及工程施工废弃物就地处理的说法，正确的有？","choices":["工程渣土采用改良措施后，符合回填土质要求的可用于回填","难以就地利用的建筑垃圾，应就地掩埋","施工现场生活垃圾，可同建筑垃圾一起处置","金属类垃圾，宜通过简单加工，直接回用于工程","无机非金属垃圾，宜设置现场处置设备，进行资源化再利用"],"answer":[0,3,4],"analysis":"B难以就地利用的建筑垃圾应转运到建筑垃圾处置场所。C生活垃圾不得同建筑垃圾一起处置。","sec":"2026-管理"},{"id":"quiz_157","q":"人工定额的编制方法主要有？","choices":["技术测定法","理论计算法","统计分析法","比较类推法","图纸计算法"],"answer":[0,2,3],"analysis":"常用的人工定额编制方法：技术测定法、统计分析法、比较类推法、经验估计法。","sec":"2026-管理"},{"id":"quiz_158","q":"下列建筑企业项目实施策划工作中，属于工程管理部门负责的有？","choices":["提出重大施工技术方案初步意见","确定临时工程标准和管理要求","提出标准化工地策划的意见","明确技术管理工作要求","确定工程测量管理方案"],"answer":[0,1,4],"analysis":"工程管理部门负责的内容包括提出重大施工技术方案初步意见、确定临时工程标准和管理要求、确定工程测量管理方案等。","sec":"2026-管理"},{"id":"quiz_159","q":"下列施工项目目标控制的措施中，属于组织措施的有？","choices":["组织专家论证新技术的可靠性","建立施工项目目标控制工作考评机制","完善沟通机制和工作流程","明确施工责任成本和激励措施","合理处置工程变更"],"answer":[1,2],"analysis":"组织措施包括建立健全组织机构和规章制度、完善沟通机制和工作流程、建立考评机制等。","sec":"2026-管理"},{"id":"quiz_160","q":"关于施工总平面布置原则的说法，正确的有？","choices":["平面布置要科学合理，尽量减少占地","充分利用既有建（构）筑物和设施，降低临时设施建造费用","临时设施应尽量设置在拟建建筑物附近，减少物料搬运","应兼顾施工与消防要求，保证场内道路通畅","材料堆场应尽量靠近加工厂或垂直运输设备"],"answer":[0,1,3],"analysis":"C临时设施应方便生产、生活，办公区、生活区和生产区宜分离设置。E材料堆场应减少二次搬运。","sec":"2026-管理"}],"exam":[{"id":"sl_001","q":"下列指示牌类型，从左到右，第三个是（）标志。","choices":["提示","指令","警告","禁止"],"answer":1,"analysis":"多个安全标志牌设置在一起时，应按警告、禁止、指令、提示类型的顺序从左到右、从上到下排列。","sec":"2026-水利"},{"id":"sl_002","q":"平行检测混凝土的检测数量不应少于承包人检测数量的（）","choices":["3%","5%","7%","10%"],"answer":0,"analysis":"平行检测的检测数量，混凝土试样不应少于承包人检测数量的3%；重要部位每种强度等级的混凝土最少取样1组。","sec":"2026-水利"},{"id":"sl_003","q":"关于止水片部位混凝土浇筑，下列说法正确的是？","choices":["止水片高程处应设置施工缝","水平止水片应在浇筑层的顶部","在止水片高程处不得设置施工缝","止水片应靠近模板安装"],"answer":2,"analysis":"水平止水片应在浇筑层的中间，在止水片高程处，不得设置施工缝。浇筑混凝土时不得冲撞止水片，振捣器不得触及止水片。","sec":"2026-水利"},{"id":"sl_004","q":"我国南方片汛期一般为？","choices":["4-10月","6-9月","5-9月","4-8月"],"answer":0,"analysis":"南方片汛期一般为4-10月，北方片汛期一般为6-9月。","sec":"2026-水利"},{"id":"sl_005","q":"正铲挖掘机适用于（）类土及爆破石渣的挖掘。","choices":["I-II类","II-III类","I-IV类","III-IV类"],"answer":2,"analysis":"正铲挖掘机具有稳定性好、挖掘力大、生产率高等优点，适用于I-IV类土及爆破石渣的挖掘。","sec":"2026-水利"},{"id":"sl_006","q":"河湖整治工程专业承包资质分为几个等级？","choices":["一级、二级","一级、二级、三级","一级、二级、三级、四级","不分等级"],"answer":1,"analysis":"河湖整治工程专业承包资质分为一级、二级、三级。水利水电机电安装工程和水工金属结构制作与安装工程专业承包资质也分为一级、二级、三级。","sec":"2026-水利"},{"id":"sl_007","q":"堤顶养护中，平均每（）m长堤段纵向高差不应大于0.1m。","choices":["3","5","10","2"],"answer":1,"analysis":"堤顶养护应做到堤线顺直、饱满平坦，平均每5m长堤段纵向高差不应大于0.1m。","sec":"2026-水利"},{"id":"sl_008","q":"卧式与斜式机组安装的主要工作包括？","choices":["轴承装配和水泵安装","轴瓦研刮和轴承装配","固定部件和轴承装配","水泵和电动机安装"],"answer":1,"analysis":"卧式与斜式机组主要工作分为轴瓦研刮和轴承装配、水泵、机组电动机、传动装置安装。","sec":"2026-水利"},{"id":"sl_009","q":"根据《指导意见》，具有发电功能的小型水利项目，民营企业股权占比原则上不低于？","choices":["30%","35%","40%","50%"],"answer":1,"analysis":"民营企业股权占比原则上不低于35%的项目中，水利领域是指具有发电功能的小型水利项目。","sec":"2026-水利"},{"id":"sl_010","q":"先在龙口建造浮桥或栈桥，由自卸汽车运来抛投料沿龙口前沿投抛，这种截流方式称为？","choices":["立堵","平堵","混合堵","定向爆破截流"],"answer":1,"analysis":"平堵是先在龙口建造浮桥或栈桥，由自卸汽车或其他运输工具运来抛投料，沿龙口前沿投抛。","sec":"2026-水利"},{"id":"sl_011","q":"工程的水文地质条件主要检测的对象是？","choices":["地表水","地下水","大气降水","土壤水"],"answer":1,"analysis":"地下水的形成、埋藏、分布和运动规律称为工程的水文地质条件。","sec":"2026-水利"},{"id":"sl_012","q":"铺盖在水利工程中的主要作用是？","choices":["消能","防渗","防冲","导流"],"answer":1,"analysis":"铺盖的作用主要是延长渗径长度以达到防渗目的，具有不透水性，同时兼有防冲功能。","sec":"2026-水利"},{"id":"sl_013","q":"水利工程标准的复审周期一般不超过？","choices":["3年","5年","7年","10年"],"answer":1,"analysis":"根据反馈和跟踪评估情况，按照水利标准复审有关规定对标准进行复审。复审周期一般不超过5年。","sec":"2026-水利"},{"id":"sl_014","q":"浇筑二期混凝土时，宜采用何种集料的混凝土？","choices":["粗集料","中粗集料","较细集料","特细集料"],"answer":2,"analysis":"浇筑二期混凝土时，应采用较细集料混凝土，并细心振捣，不要振动已装好的金属构件。","sec":"2026-水利"},{"id":"sl_015","q":"较大质量事故逐级上报，每级上报的时间不得超过？","choices":["1小时","2小时","3小时","4小时"],"answer":1,"analysis":"初步判断为较大质量事故的，应当逐级报告至省级水行政主管部门、流域管理机构。每级上报的时间不得超过2h。","sec":"2026-水利"},{"id":"sl_016","q":"根据《水工混凝土施工规范》及相关技术标准，水利工程模板及其支架设计时，应考虑的基本荷载包括？","choices":["模板及支架的自重","钢筋重量","新浇混凝土重量","振捣混凝土产生的荷载","风荷载"],"answer":[0,1,2,3],"analysis":"基本荷载包括：(1)模板及其支架的自重；(2)新浇筑混凝土重量；(3)钢筋和预埋件重量；(4)工作人员及浇筑设备、工具等荷载；(5)振捣混凝土产生的荷载；(6)新浇筑混凝土的侧压力；(7)新浇筑的混凝土的浮托力；(8)混凝土拌合物入仓所产生的冲击荷载；(9)混凝土与模板的摩阻力。","sec":"2026-水利"},{"id":"sl_017","q":"用卷尺量距时主要工具包括？","choices":["水准尺","花杆","测钎","木杆","指南针"],"answer":[1,2],"analysis":"卷尺量距所用工具包括钢（皮）卷尺、花杆、测钎。","sec":"2026-水利"},{"id":"sl_018","q":"下列材料中，属于结构材料的是？","choices":["混凝土","型钢","木材","石棉板","水玻璃"],"answer":[0,1,2],"analysis":"按材料功能用途分类，结构材料如混凝土、型钢、木材等。","sec":"2026-水利"},{"id":"sl_019","q":"水利工程养护包括？","choices":["经常性养护","定期养护","专门性养护","检查养护","突击养护"],"answer":[0,1,2],"analysis":"养护分为经常性养护、定期养护和专门性养护。","sec":"2026-水利"},{"id":"sl_020","q":"隧洞导流较适用于？","choices":["河谷狭窄的河流","两岸地形陡峻的河流","山岩坚实的山区河流","修建河床式水电站","修建土石坝"],"answer":[0,1,2],"analysis":"隧洞导流是在河岸边开挖隧洞，在基坑的上下游修筑围堰，适用于河谷狭窄、两岸地形陡峻、山岩坚实的山区河流。","sec":"2026-水利"},{"id":"sl_021","q":"渠道开挖时，选择开挖方法取决于？","choices":["施工机械","技术条件","土壤种类","地下水位","渠道纵横断面尺寸"],"answer":[1,2,3,4],"analysis":"选择开挖方法取决于技术条件、土壤种类、渠道纵横断面尺寸、地下水位等因素。","sec":"2026-水利"},{"id":"sl_022","q":"采用实物核对审计方法时，可以采用（）等。","choices":["详查法","逆查法","调节法","顺查法","鉴定法"],"answer":[2,4],"analysis":"实物核对的方法可分为盘点法、调节法和鉴定法等。","sec":"2026-水利"},{"id":"sl_023","q":"下列在建水利工程安全度汛工作中，属于施工单位责任的有？","choices":["制定工程安全度汛措施","明确工程度汛技术要求","明确工程安全度汛的工程形象面貌","备足防汛物资和设备","组建抢险队伍"],"answer":[0,3,4],"analysis":"施工单位应制定安全度汛措施，组建抢险队伍，备足防汛物资和设备。B、C是设计单位的责任。","sec":"2026-水利"},{"id":"exam_2025_001","q":"叶片泵的抽水装置不包括（ ）。","choices":["叶片泵","动力机","泵房","管路"],"answer":2,"analysis":"叶片泵抽水装置由叶片泵、动力机、管路组成，不包括泵房。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_002","q":"水准仪基座一般装有（ ）个脚螺旋。","choices":["3","4","5","6"],"answer":0,"analysis":"水准仪基座一般装有3个脚螺旋。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_003","q":"材料孔隙体积占总体积的百分比称为材料的（ ）。","choices":["孔隙率","密实度","填充率","空隙率"],"answer":0,"analysis":"孔隙率是指材料中孔隙体积占总体积的百分比。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_004","q":"管涌险情的抢护原则（ ）。","choices":["临水筑子堤","上堵下排","制止涌水带砂","封堵闭气"],"answer":2,"analysis":"管涌险情的抢护原则是制止涌水带砂，而留有出水的通道。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_005","q":"孔径大于75mm，孔深大于5m的钻孔爆破称为（ ）。","choices":["光面爆破","洞室爆破","浅孔爆破","深孔爆破"],"answer":3,"analysis":"深孔爆破法：孔径大于75mm、孔深大于5m的钻孔爆破。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_006","q":"混凝土结构物与土石坝坝身连接部位，填土前应涂刷浓黏性土浆，泥浆土与水的质量比宜为（ ）。","choices":["1:1.0~1:1.5","1:1.5~1:2.0","1:2.0~1:2.5","1:2.5~1:3.0"],"answer":3,"analysis":"泥浆土与水的质量比宜为1:2.5~1:3.0。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_007","q":"图中所示的止水带类型为（ ）。【含图】","choices":["W型普通金属止水带","W型复合金属止水带","F型普通金属止水带","F型复合金属止水带"],"answer":2,"analysis":"F型普通金属止水带。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_008","q":"在流域范围内制定的防洪、治涝、水资源保护等规划属于（ ）。","choices":["区域规划","水资源综合规划","流域专业规划","流域综合规划"],"answer":2,"analysis":"在流域范围内制定的防洪、治涝、水资源保护等规划属于流域专业规划。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_009","q":"当构件按最小配筋率配筋时，可按钢筋（ ）相等的原则进行钢筋代换。","choices":["强度","刚度","受力","面积"],"answer":3,"analysis":"当构件按最小配筋率配筋时，可按钢筋面积相等的原则进行钢筋代换。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_010","q":"水利行业标准的开始实施时间不应超过发布时间后的（ ）。","choices":["1","3","6","9"],"answer":1,"analysis":"水利行业标准的开始实施时间不应超过发布时间后的3年。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_011","q":"滑模施工混凝土时，振捣器插入下层混凝土深度宜为（ ）。","choices":["3","4","5","6"],"answer":2,"analysis":"滑模施工混凝土时，振捣器插入下层混凝土深度宜为5cm。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_012","q":"总承包三级资质的水利水电施工企业，其水利水电工程专业注册建造师应不少于（ ）人。","choices":["5","8","10","13"],"answer":1,"analysis":"总承包三级资质的水利水电施工企业，水利水电工程专业注册建造师应不少于8人。","sec":"2025-水利","type":"exam"},{"id":"exam_2025_013","q":"按照绿色施工要求，施工场界处夜间突发噪声的最大声级不得超过场界噪声限值的（ ）dB（A）。","choices":["10","15","20","25"],"answer":1,"analysis":"
