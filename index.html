<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f1f5f9;color:#334155;min-height:100vh;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#1e293b,#334155);color:#f1f5f9;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.75;margin-top:2px;font-weight:400}
.header .cd{font-size:10px;opacity:.8;margin-top:2px;background:rgba(255,255,255,.08);display:inline-block;padding:2px 8px;border-radius:6px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:56px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:1;text-align:center;padding:11px 6px 9px;font-size:11px;font-weight:500;color:#94a3b8;border-bottom:2px solid transparent;cursor:pointer;min-width:55px;transition:color .15s}
.tab.active{color:#475569;border-bottom-color:#475569;font-weight:600}
.tab .em{font-size:15px;display:block;margin-bottom:1px}
.panel{display:none;padding:14px 12px;max-width:640px;margin:0 auto}
.panel.active{display:block}
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:16px;margin-bottom:10px}
.card .q{font-size:14px;line-height:1.65;font-weight:500;white-space:pre-wrap;word-wrap:break-word}
.card .a{font-size:13px;line-height:1.6;color:#475569;display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #cbd5e1;white-space:pre-wrap;word-wrap:break-word}
.card .a.show{display:block}
.card .meta{font-size:10px;color:#94a3b8;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-block;font-size:9px;background:#f1f5f9;color:#64748b;padding:2px 6px;border-radius:4px;font-weight:500}
.choices{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.choice{padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;line-height:1.5;cursor:pointer;transition:.12s;background:#fff;user-select:none;color:#475569}
.choice:active{background:#f8fafc}
.choice.sel{border-color:#475569;background:#f1f5f9}
.choice.correct{border-color:#059669;background:#ecfdf5;color:#065f46}
.choice.wrong{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.choice.reveal-correct{border-color:#059669;background:#ecfdf5}
.choice .pre{font-weight:600;margin-right:4px;display:inline-block;width:18px;color:#94a3b8}
.actions{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:65px;padding:10px 8px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;min-height:42px;transition:.12s;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn-primary{background:#475569;color:#fff}
.btn-success{background:#059669;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-warning{background:#d97706;color:#fff}
.btn-outline{background:#fff;border:1px solid #cbd5e1;color:#475569}
.btn-sm{padding:7px 10px;font-size:10px;min-height:32px;flex:0 0 auto}
.btn-block{width:100%;flex:none}
.stats-bar{display:flex;gap:5px;margin-bottom:8px}
.stat-card{flex:1;background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:8px 5px;text-align:center}
.stat-card .num{font-size:16px;font-weight:700;color:#475569}
.stat-card .num.good{color:#059669}
.stat-card .num.bad{color:#dc2626}
.stat-card .lbl{font-size:9px;color:#94a3b8;margin-top:1px}
.progress-bar{height:5px;background:#e2e8f0;border-radius:3px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;background:#475569}
.progress-text{font-size:10px;color:#64748b;text-align:center}
.sec-row{display:flex;gap:4px;overflow-x:auto;padding:0 0 4px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.sec-btn{flex-shrink:0;padding:4px 10px;border:1px solid #e2e8f0;border-radius:12px;font-size:10px;cursor:pointer;white-space:nowrap;background:#fff;color:#64748b;transition:.12s}
.sec-btn.active{background:#475569;color:#fff;border-color:#475569}
.tip{font-size:10px;color:#d97706;background:#fffbeb;padding:5px 8px;border-radius:6px;margin-top:6px;border-left:3px solid #f59e0b}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.92);color:#f1f5f9;padding:8px 16px;border-radius:8px;font-size:12px;z-index:999;display:none;max-width:90%;backdrop-filter:blur(4px)}
.empty{text-align:center;padding:36px 16px;color:#94a3b8}
.empty .icon{font-size:40px;margin-bottom:8px}
@keyframes pulse{0%,100%{transform:scale(1.12)}50%{transform:scale(.96)}}
/* 深色模式 */
body.dark{background:#0f172a;color:#cbd5e1}
body.dark .header{background:linear-gradient(135deg,#020617,#1e293b)}
body.dark .tabs{background:#1e293b;border-color:#334155}
body.dark .tab{color:#64748b}
body.dark .tab.active{color:#94a3b8;border-color:#64748b}
body.dark .card,body.dark #reciteCard{background:#1e293b;border-color:#334155}
body.dark .card .q,body.dark #reciteQ{color:#e2e8f0}
body.dark .card .a,body.dark #reciteA{color:#cbd5e1}
body.dark #reciteAnswerArea{border-color:#334155}
body.dark #reciteAnswerArea>div:first-child{color:#34d399}
body.dark .panel{color:#cbd5e1}
body.dark .stat-card{background:#1e293b;border-color:#334155}
body.dark .stat-card .num{color:#94a3b8}
body.dark .choice{background:#1e293b;border-color:#334155;color:#cbd5e1}
body.dark .choice.sel{background:#1e3a5f;border-color:#64748b}
body.dark .choice.correct{background:#064e3b;border-color:#059669;color:#6ee7b7}
body.dark .choice.wrong{background:#450a0a;border-color:#dc2626;color:#fca5a5}
body.dark .choice.reveal-correct{background:#064e3b;border-color:#059669}
body.dark .sec-btn{background:#1e293b;border-color:#334155;color:#94a3b8}
body.dark .sec-btn.active{background:#64748b;color:#f1f5f9}
body.dark .tag{background:#1e3a5f;color:#94a3b8}
body.dark #reciteTapHint{color:#64748b}
body.dark .tip{background:#1c1917;color:#fbbf24}
body.dark .toast{background:rgba(241,245,249,.9);color:#1e293b}
/* 滑动+计划 */
.swipe-hint{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:10}
.swipe-hint.left{left:12px}
.swipe-hint.right{right:12px}
/* 每日计划 */
.daily-plan{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;text-align:center}
.daily-plan .big-num{font-size:28px;font-weight:800;color:#475569;line-height:1}
.daily-plan .label{font-size:10px;color:#94a3b8;margin:4px 0}
.daily-plan .mini-bar{height:4px;background:#e2e8f0;border-radius:2px;margin:8px 0;overflow:hidden}
.daily-plan .mini-fill{height:100%;background:#475569;border-radius:2px;transition:width .5s}
.daily-plan .stats{display:flex;gap:12px;justify-content:center;font-size:11px;color:#64748b;margin-top:4px}
body.dark .daily-plan{background:#1e293b;border-color:#334155}
body.dark .daily-plan .big-num{color:#94a3b8}
</style>
</head>
<body>

<div class="header">
  <h1><span onclick="toggleSearch()" style="cursor:pointer">📚 二建备考题库</span> <span style="float:right;cursor:pointer;font-size:14px;opacity:.85;display:flex;gap:6px"><span onclick="togglePomodoro()" id="pomoBtn" style="cursor:pointer">🍅</span><span onclick="toggleDark()" id="darkBtn" style="cursor:pointer">🌙</span></span></h1>
  <div class="sub" id="subDate">加载中...</div>
  <div class="cd" id="cdText">⏳ 加载中</div>
</div>
  <div id="pomodoroBar" style="display:none;text-align:center;background:#fef2f2;padding:4px;font-size:11px;font-weight:600;color:#dc2626;border-bottom:1px solid #fecaca">🍅 专注 <span id="pomoTime">25:00</span> · <span onclick="togglePomodoro()" style="cursor:pointer;text-decoration:underline">停止</span></div>

<div id="searchBar" style="display:none;padding:8px 12px;background:#fff;border-bottom:1px solid #e2e8f0">
  <div style="display:flex;gap:6px">
    <input id="searchInput" type="text" placeholder="搜索知识点..." style="flex:1;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none" oninput="doSearch()" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn btn-sm btn-outline" onclick="closeSearch()" style="flex:0 0 auto">✕</button>
  </div>
  <div id="searchResults" style="max-height:300px;overflow-y:auto;margin-top:6px;font-size:12px"></div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="speed" onclick="goTab('speed')"><span class="em">⚡</span>冲刺</div>
  <div class="tab" data-tab="recite" onclick="goTab('recite')"><span class="em">📖</span>背诵</div>
  <div class="tab" data-tab="quiz" onclick="goTab('quiz')"><span class="em">📝</span>刷题</div>
  <div class="tab" data-tab="exam" onclick="goTab('exam')"><span class="em">📄</span>真题</div>
  <div class="tab" data-tab="progress" onclick="goTab('progress')"><span class="em">📊</span>进度</div>
</div>

<div class="panel active" id="panel-speed">
  <!-- 每日计划 -->
  <div class="daily-plan" id="dailyPlan">
    <div class="label">📅 今日学习计划</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0">
      <div><div class="big-num" id="dpRecite">-</div><div class="label">背诵</div></div>
      <div><div class="big-num" id="dpQuiz">-</div><div class="label">刷题</div></div>
      <div><div class="big-num" id="dpExam">-</div><div class="label">真题</div></div>
    </div>
    <div class="mini-bar"><div class="mini-fill" id="dpBar" style="width:0%"></div></div>
    <div class="stats">今日完成 <span id="dpDone" style="font-weight:600;color:#475569">0</span> / <span id="dpTotal">0</span> 条</div>
  </div>
  <!-- 自动学习流 -->
  <button class="btn btn-primary btn-block" onclick="startAutoFlow()" id="autoFlowBtn" style="margin-bottom:10px;background:linear-gradient(135deg,#475569,#64748b)">▶ 一键开始今日学习</button>
  <div id="autoFlowStatus" style="display:none;text-align:center;font-size:11px;color:#64748b;margin-bottom:6px"></div>
  <div class="stats-bar" id="speedStats"></div>
  <div class="card" id="speedCard">
    <div class="meta"><span class="tag" id="speedTag">冲刺模式</span><span id="speedScore">0分</span></div>
    <div class="q" id="speedQ">初始化中...</div>
    <div class="choices" id="speedChoices"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-outline btn-sm" onclick="resetSpeed()">🔄 重来</button>
    <button class="btn btn-primary btn-sm" onclick="newRound()">▶ 开始新一轮</button>
  </div>
  <div class="progress-text" id="speedRound" style="font-size:12px;color:#475569;font-weight:600;margin-top:4px">⚡ 点击开始新一轮</div>
  <!-- 醒目倒计时 -->
  <div id="speedTimerBox" style="display:none;text-align:center;margin-top:12px;position:relative">
    <div id="speedTimerNum" style="font-size:72px;font-weight:900;line-height:1;font-family:-apple-system,BlinkMacSystemFont;transition:color .3s,transform .2s"></div>
    <div id="speedTimerLabel" style="font-size:14px;color:#718096;margin-top:2px">秒</div>
    <div style="height:8px;background:#e2e8f0;border-radius:4px;margin-top:8px;overflow:hidden">
      <div id="speedTimerBar" style="height:100%;background:linear-gradient(90deg,#dc2626,#d69e2e,#48bb78);transition:width 1s linear;width:100%"></div>
    </div>
    <div style="font-size:12px;color:#718096;margin-top:3px">第<span id="speedQIdx">1</span>/5题</div>
  </div>
  <div id="speedHistory" style="margin-top:8px"></div>
</div>

<div class="panel" id="panel-recite">
  <!-- 顶部进度条 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <span style="font-size:11px;color:#718096;font-weight:500" id="reciteSectionLabel">全部章节</span>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:120px;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden">
        <div id="reciteBar" style="height:100%;background:linear-gradient(90deg,#475569,#48bb78);transition:width .3s;width:0%"></div>
      </div>
      <span style="font-size:13px;font-weight:700;color:#475569;min-width:50px;text-align:right" id="reciteCount">0/0</span>
    </div>
  </div>

  <!-- 章节筛选 -->
  <div class="sec-row" id="reciteSec" style="margin-bottom:6px"></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:4px"><label style="font-size:11px;color:#718096;cursor:pointer;display:flex;align-items:center;gap:4px" onclick="toggleUnmastered()"><input type="checkbox" id="unmasteredChk" style="margin:0"> 未掌握 &nbsp; <input type="checkbox" id="shuffleChk" style="margin:0" onclick="toggleShuffle()"> 乱序</label></div>

  <!-- 主卡片：点击翻答案 -->
  <div id="reciteCard" style="background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:24px 20px 20px;min-height:260px;position:relative;cursor:pointer;user-select:none;overflow:hidden;touch-action:pan-y" onclick="flipAnswer()" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event)">
    <span onclick="event.stopPropagation();speakCard()" style="position:absolute;top:12px;right:12px;font-size:18px;cursor:pointer;z-index:5;opacity:.7" title="朗读">🔊</span>
    <div class="swipe-hint left" id="swipeLeft">👈 不熟</div>
    <div class="swipe-hint right" id="swipeRight">记住了 👉</div>
    <!-- 角标 -->
    <div style="position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:4px;font-weight:500" id="reciteTag">-</span>
      <span style="font-size:11px;color:#a0aec0" id="reciteSub">-</span>
    </div>
    <!-- 问题区 -->
    <div style="padding-top:28px">
      <div style="font-size:13px;color:#a0aec0;margin-bottom:6px">📖 问题</div>
      <div style="font-size:17px;line-height:1.7;font-weight:600;color:#1a202c" id="reciteQ">-</div>
    </div>
    <!-- 答案区（默认隐藏） -->
    <div id="reciteAnswerArea" style="display:none;margin-top:16px;padding-top:16px;border-top:2px dashed #e2e8f0">
      <div style="font-size:13px;color:#059669;margin-bottom:6px">✅ 答案</div>
      <div style="font-size:15px;line-height:1.7;color:#222" id="reciteA">-</div>
    </div>
    <!-- 未翻开提示 -->
    <div id="reciteTapHint" style="text-align:center;margin-top:32px;color:#a0aec0;font-size:13px">👆 点击卡片查看答案</div>
  </div>

  <!-- 翻答案后出现的操作栏 -->
  <div id="reciteActions" style="display:none;margin-top:12px">
    <div style="font-size:13px;color:#718096;text-align:center;margin-bottom:8px">你记住了吗？</div>
    <div style="display:flex;gap:10px">
      <button style="flex:1;padding:14px 8px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#fff5f5;color:#dc2626;border:2px solid #fed7d7" onclick="markR('hard')">😣 不熟</button>
      <button style="flex:1;padding:14px 8px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#fffff0;color:#d69e2e;border:2px solid #fefcbf" onclick="markR('ok')">🤔 还行</button>
      <button style="flex:1;padding:14px 8px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#f0fff4;color:#059669;border:2px solid #c6f6d5" onclick="markR('easy')">✅ 记住了</button>
    </div>
  </div>

  <!-- 翻页 -->
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-outline btn-sm" onclick="goRecite(-1)" style="flex:1">← 上一题</button>
    <button class="btn btn-outline btn-sm" onclick="goRecite(1)" style="flex:1">下一题 →</button>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="stats-bar" id="quizStats"></div>
  <div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn btn-sm btn-outline" onclick="retryWrong('quiz')" id="quizWrongBtn" style="font-size:10px;padding:4px 10px">🔁 错题重练</button></div>
  <div class="sec-row" id="quizSec"></div>
  <div class="card" id="quizCard">
    <div class="meta"><span class="tag" id="quizTag">-</span><span id="quizIdx">0/0</span></div>
    <div class="q" id="quizQ">-</div>
    <div class="choices" id="quizChoices"></div>
  </div>
  <div class="actions" id="quizActions">
    <button class="btn btn-outline" onclick="goQuiz(-1)">←</button>
    <button class="btn btn-primary" onclick="goQuiz(1)">→</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="quizBar" style="width:0%"></div></div>
</div>

<div class="panel" id="panel-exam">
  <div class="stats-bar" id="examStats"></div>
  <div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn btn-sm btn-outline" onclick="retryWrong('exam')" id="examWrongBtn" style="font-size:10px;padding:4px 10px">🔁 错题重练</button></div>
  <div class="sec-row" id="examSec"></div>
  <div class="card" id="examCard">
    <div class="meta"><span class="tag" id="examTag">-</span><span id="examIdx">0/0</span></div>
    <div class="q" id="examQ">-</div>
    <div class="choices" id="examChoices"></div>
  </div>
  <div class="actions" id="examActions">
    <button class="btn btn-outline" onclick="goExam(-1)">←</button>
    <button class="btn btn-primary" onclick="goExam(1)">→</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="examBar" style="width:0%"></div></div>
</div>

<div class="panel" id="panel-progress">
  <div class="stats-bar" id="progressStats"></div>
  <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:12px;margin-bottom:8px">
    <div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:6px">📊 章节掌握度</div>
    <div id="chapterHeatmap"></div>
  </div>
  <div id="progressDetail"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// 数据：直接读取内联数据(由下方<script>注入到 window.DATA)
(function(){
'use strict';
// 等待数据就绪 - 用setTimeout 0轮询直到window.DATA非空
function waitForData(){
  if(window.DATA && window.DATA.recite && window.DATA.recite.length>0){
    return true;
  }
  return false;
}
var db = 'ejian_v3';
var state = {r:0,rs:'all',rh:{},q:0,qs:'all',qh:{},e:0,es:'all',eh:{}};
var timer = null;
var speedStreak = 0, speedBest = 0;

// 状态加载
try{
  var s = localStorage.getItem(db);
  if(s){
    var o = JSON.parse(s);
    state.rh = o.rh || {};
    state.qh = o.qh || {};
    state.eh = o.eh || {};
    state.r = o.r || 0; state.rs = o.rs || 'all';
    state.q = o.q || 0; state.qs = o.qs || 'all';
    state.e = o.e || 0; state.es = o.es || 'all';
    speedBest = o.sb || 0;
  }
}catch(ex){}
function saveState(){
  try{ localStorage.setItem(db, JSON.stringify({rh:state.rh,qh:state.qh,eh:state.eh,r:state.r,rs:state.rs,q:state.q,qs:state.qs,e:state.e,es:state.es,sb:speedBest})); }catch(ex){}
}
function getH(t,id){ return (state[t][id] || {status:'new',wrong:0,last:null}); }
function setH(t,id,d){ state[t][id] = Object.assign({}, getH(t,id), d); saveState(); }

// 工具函数
function $(id){return document.getElementById(id);}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){t.style.display='none'},1500);
}
function showSec(panel, type){
  var el = $(panel);
  if(!el) return '';
  var data = DATA[type] || [];
  var curr = type==='recite' ? state.rs : (type==='quiz' ? state.qs : state.es);
  var secs = ['all'];
  var seen = {};
  for(var i=0;i<data.length;i++){
    if(data[i].sec && !seen[data[i].sec]){
      seen[data[i].sec] = true;
      secs.push(data[i].sec);
    }
  }
  var html = '';
  for(var i=0;i<secs.length;i++){
    var s = secs[i];
    var cnt = s==='all' ? data.length : (seen[s] ? data.filter(function(d){return d.sec===s;}).length : 0);
    var cnt2 = s==='all' ? data.length : data.filter(function(d){return d.sec===s;}).length;
    var name = s==='all' ? '全部' : s;
    var act = curr===s ? 'active' : '';
    html += '<div class="sec-btn '+act+'" onclick="setSec(\''+type+'\',\''+s+'\')">'+name+' '+cnt2+'</div>';
  }
  el.innerHTML = html;
  return curr;
}
function getList(type){
  var data = DATA[type]||[];
  var sec = type==='recite'?state.rs:(type==='quiz'?state.qs:state.es);
  return sec==='all' ? data : data.filter(function(d){return d.sec===sec;});
}
window.setSec = function(type, sec){
  if(type==='recite'){ state.rs=sec; state.r=0; _shuffledCache = null; }
  else if(type==='quiz'){ state.qs=sec; state.q=0; }
  else { state.es=sec; state.e=0; }
  saveState();
  renderTab(type);
};

// Tab切换
window.goTab = function(name){
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab')===name);
  var panels = document.querySelectorAll('.panel');
  for(var i=0;i<panels.length;i++) panels[i].classList.toggle('active', panels[i].id==='panel-'+name);
};

// 渲染
function renderTab(type){
  if(type==='recite'){
    showSec('reciteSec','recite');
    var list = getList('recite');
    var done = 0;
    for(var k in state.rh) if(state.rh[k].status==='easy') done++;
    // 进度条
    var secName = state.rs==='all' ? '全部章节' : (state.rs||'全部章节');
    $('reciteSectionLabel').textContent = secName;
    if(!list.length){
      $('reciteQ').textContent='暂无内容';
      $('reciteA').textContent='';
      $('reciteCount').textContent='0/0';
      $('reciteBar').style.width='0%';
      return;
    }
    var i = Math.min(state.r, list.length-1);
    state.r = i;
    var item = list[i];
    $('reciteTag').textContent = (item.sec||'');
    $('reciteSub').textContent = (item.sub||'');
    $('reciteCount').textContent = (i+1)+'/'+list.length;
    $('reciteQ').textContent = item.q;
    $('reciteA').textContent = item.a;
    // 每次翻到新题：隐藏答案+操作栏+显示提示
    $('reciteAnswerArea').style.display = 'none';
    $('reciteActions').style.display = 'none';
    $('reciteTapHint').style.display = 'block';
    var pct = list.length ? ((i+1)/list.length*100) : 0;
    $('reciteBar').style.width = pct+'%';
  }
  else if(type==='quiz'){
    showSec('quizSec','quiz');
    var list = getList('quiz');
    var done = 0, wrong = 0;
    for(var k in state.qh){
      if(state.qh[k].last) done++;
      if(state.qh[k].wrong>0) wrong++;
    }
    $('quizStats').innerHTML = '<div class="stat-card"><div class="num">'+list.length+'</div><div class="lbl">总题</div></div><div class="stat-card"><div class="num good">'+done+'</div><div class="lbl">已答</div></div><div class="stat-card"><div class="num bad">'+wrong+'</div><div class="lbl">错题</div></div>';
    if(!list.length){ $('quizQ').textContent='暂无'; $('quizChoices').innerHTML=''; $('quizIdx').textContent='0/0'; return; }
    var i = Math.min(state.q, list.length-1);
    state.q = i;
    var item = list[i];
    var isMulti = Array.isArray(item.answer);
    $('quizTag').textContent = (item.sec||'') + (isMulti?' · 多选':'');
    $('quizIdx').textContent = (i+1)+'/'+list.length;
    $('quizQ').textContent = item.q;
    var choices = item.choices || [];
    var html = '';
    for(var j=0;j<choices.length;j++){
      html += '<div class="choice" data-idx="'+j+'" onclick="pickQuiz(this,'+j+')"><span class="pre">'+('ABCDEFGH'[j])+'.</span>'+escapeHTML(choices[j])+'</div>';
    }
    if(isMulti) html += '<div class="tip">💡 多选策略：不确定就只选最确定的2个</div><div style="margin-top:8px"><button class="btn btn-primary btn-block" onclick="submitMulti(\'quiz\')">✓ 提交</button></div>';
    $('quizChoices').innerHTML = html;
    $('quizBar').style.width = (list.length ? (i+1)/list.length*100 : 0)+'%';
  }
  else if(type==='exam'){
    showSec('examSec','exam');
    var list = getList('exam');
    var done = 0, wrong = 0;
    for(var k in state.eh){
      if(state.eh[k].last) done++;
      if(state.eh[k].wrong>0) wrong++;
    }
    $('examStats').innerHTML = '<div class="stat-card"><div class="num">'+list.length+'</div><div class="lbl">总题</div></div><div class="stat-card"><div class="num good">'+done+'</div><div class="lbl">已答</div></div><div class="stat-card"><div class="num bad">'+wrong+'</div><div class="lbl">错题</div></div>';
    if(!list.length){ $('examQ').textContent='暂无'; $('examChoices').innerHTML=''; $('examIdx').textContent='0/0'; return; }
    var i = Math.min(state.e, list.length-1);
    state.e = i;
    var item = list[i];
    var isMulti = Array.isArray(item.answer);
    $('examTag').textContent = (item.sec||'') + (isMulti?' · 多选':'');
    $('examIdx').textContent = (i+1)+'/'+list.length;
    $('examQ').textContent = item.q;
    var choices = item.choices || [];
    var html = '';
    for(var j=0;j<choices.length;j++){
      html += '<div class="choice" data-idx="'+j+'" onclick="pickExam(this,'+j+')"><span class="pre">'+('ABCDEFGH'[j])+'.</span>'+escapeHTML(choices[j])+'</div>';
    }
    if(isMulti) html += '<div class="tip">💡 多选策略：不确定就只选最确定的2个</div><div style="margin-top:8px"><button class="btn btn-primary btn-block" onclick="submitMulti(\'exam\')">✓ 提交</button></div>';
    $('examChoices').innerHTML = html;
    $('examBar').style.width = (list.length ? (i+1)/list.length*100 : 0)+'%';
  }
  else if(type==='progress'){
    var rT = DATA.recite.length, qT = DATA.quiz.length, eT = DATA.exam.length;
    var rD = 0, qD = 0, eD = 0, qW = 0;
    for(var k in state.rh) if(state.rh[k].status==='easy') rD++;
    for(var k in state.qh){ if(state.qh[k].last) qD++; if(state.qh[k].wrong>0) qW++; }
    for(var k in state.eh) if(state.eh[k].last) eD++;
    $('progressStats').innerHTML = '<div class="stat-card"><div class="num good">'+rD+'/'+rT+'</div><div class="lbl">背诵</div></div><div class="stat-card"><div class="num">'+qD+'/'+qT+'</div><div class="lbl">刷题</div></div><div class="stat-card"><div class="num bad">'+qW+'</div><div class="lbl">错题</div></div>';
    var html = '<div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)"><h3 style="font-size:14px;margin-bottom:10px">📋 各模块详情</h3>';
    ['recite','quiz','exam'].forEach(function(t){
      var label = {recite:'背诵',quiz:'刷题',exam:'真题'}[t];
      var arr = DATA[t] || [];
      var secs = ['all'];
      var seen = {};
      arr.forEach(function(d){ if(d.sec && !seen[d.sec]){ seen[d.sec]=true; secs.push(d.sec); } });
      secs.forEach(function(s){
        if(s==='all') return;
        var items = arr.filter(function(d){return d.sec===s;});
        var total = items.length, done=0, wrong=0;
        items.forEach(function(d){
          var h = getH(t, d.id);
          if(t==='recite'){ if(h.status==='easy') done++; }
          else { if(h.last) done++; if(h.wrong>0) wrong++; }
        });
        var pct = total?Math.round(done/total*100):0;
        html += '<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+label+'·'+s+'</span><span>'+done+'/'+total+(wrong?' <span style="color:#dc2626">错'+wrong+'</span>':'')+'</span></div><div style="height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin:2px 0"><div style="height:100%;width:'+pct+'%;background:'+(pct<40?'#dc2626':pct<80?'#d69e2e':'#059669')+'"></div></div></div>';
      });
    });
    html += '<button class="btn btn-outline btn-block" style="margin-top:10px" onclick="goTab(\'quiz\')">📝 去刷题</button></div>';
    $('progressDetail').innerHTML = html;
    renderChapterHeatmap();
    renderStudyStats();
  }
}

window.flipAnswer = function(){
  var area = $('reciteAnswerArea');
  var actions = $('reciteActions');
  var hint = $('reciteTapHint');
  if(!area) return;
  if(area.style.display === 'none'){
    area.style.display = 'block';
    actions.style.display = 'block';
    hint.style.display = 'none';
    // 滚动到可见
    area.scrollIntoView({behavior:'smooth',block:'center'});
  }
};
window.goRecite = function(d){
  var list = getList('recite');
  state.r = Math.max(0, Math.min(list.length-1, state.r + d));
  saveState();
  renderTab('recite');
};
window.markR = function(status){
  var list = getList('recite');
  var item = list[state.r];
  if(!item) return;
  setH('rh', item.id, {status:status, last:Date.now()});
  // 自动折叠答案区
  var area = $('reciteAnswerArea');
  var actions = $('reciteActions');
  if(area) area.style.display = 'none';
  if(actions) actions.style.display = 'none';
  // 记住了 → 自动跳到下一题
  if(status==='easy'){ goRecite(1); return; }
  // 不熟/还行 → 先刷新进度条再停留
  var list2 = getList('recite');
  var done = 0;
  for(var k in state.rh) if(state.rh[k].status==='easy') done++;
  var pct = list2.length ? ((state.r+1)/list2.length*100) : 0;
  $('reciteBar').style.width = pct+'%';
  $('reciteCount').textContent = (state.r+1)+'/'+list2.length;
  toast(status==='hard' ? '标记：不熟' : '标记：还行');
};
window.goQuiz = function(d){
  var list = getList('quiz');
  state.q = Math.max(0, Math.min(list.length-1, state.q + d));
  saveState();
  renderTab('quiz');
};
window.goExam = function(d){
  var list = getList('exam');
  state.e = Math.max(0, Math.min(list.length-1, state.e + d));
  saveState();
  renderTab('exam');
};

var _multiSel = {quiz:[], exam:[]};

window.pickQuiz = function(el, idx){
  var list = getList('quiz');
  var item = list[state.q];
  if(!item) return;
  if(Array.isArray(item.answer)){ _multiSel.quiz.push(idx); el.classList.add('sel'); return; }
  var correct = item.answer;
  var choices = el.parentElement.querySelectorAll('.choice');
  for(var i=0;i<choices.length;i++) choices[i].style.pointerEvents='none';
  el.classList.add('sel');
  var isC = (idx === correct);
  for(var i=0;i<choices.length;i++){
    if(i === correct) choices[i].classList.add('reveal-correct');
    if(i === idx && !isC) choices[i].classList.add('wrong');
  }
  setH('qh', item.id, {wrong: getH('qh', item.id).wrong + (isC?0:1), last: Date.now()});
  $('quizActions').innerHTML = '<button class="btn btn-outline" onclick="goQuiz(-1)">←</button><button class="btn '+(isC?'btn-success':'btn-danger')+'" onclick="goQuiz(1)">'+(isC?'✓ 正确':'✗ 错了')+' →</button>';
};

window.pickExam = function(el, idx){
  var list = getList('exam');
  var item = list[state.e];
  if(!item) return;
  if(Array.isArray(item.answer)){ _multiSel.exam.push(idx); el.classList.add('sel'); return; }
  var correct = item.answer;
  var choices = el.parentElement.querySelectorAll('.choice');
  for(var i=0;i<choices.length;i++) choices[i].style.pointerEvents='none';
  el.classList.add('sel');
  var isC = (idx === correct);
  for(var i=0;i<choices.length;i++){
    if(i === correct) choices[i].classList.add('reveal-correct');
    if(i === idx && !isC) choices[i].classList.add('wrong');
  }
  setH('eh', item.id, {wrong: getH('eh', item.id).wrong + (isC?0:1), last: Date.now()});
  $('examActions').innerHTML = '<button class="btn btn-outline" onclick="goExam(-1)">←</button><button class="btn '+(isC?'btn-success':'btn-danger')+'" onclick="goExam(1)">'+(isC?'✓ 正确':'✗ 错了')+' →</button>';
};

window.submitMulti = function(mode){
  var list = mode==='quiz' ? getList('quiz') : getList('exam');
  var item = mode==='quiz' ? list[state.q] : list[state.e];
  if(!item || !Array.isArray(item.answer)) return;
  var correct = item.answer;
  var sel = _multiSel[mode];
  var parent = mode==='quiz' ? $('quizChoices') : $('examChoices');
  var choices = parent.querySelectorAll('.choice');
  for(var i=0;i<choices.length;i++) choices[i].style.pointerEvents='none';
  for(var i=0;i<choices.length;i++){
    if(correct.indexOf(i)>=0) choices[i].classList.add('reveal-correct');
    if(sel.indexOf(i)>=0 && correct.indexOf(i)<0) choices[i].classList.add('wrong');
  }
  var isC = sel.length === correct.length && correct.every(function(v){return sel.indexOf(v)>=0;});
  var key = mode==='quiz'?'qh':'eh';
  var idxKey = mode==='quiz'?'q':'e';
  setH(key, item.id, {wrong: getH(key, item.id).wrong + (isC?0:1), last: Date.now()});
  var actId = mode==='quiz'?'quizActions':'examActions';
  var goFn = mode==='quiz'?'goQuiz':'goExam';
  $(actId).innerHTML = '<button class="btn btn-outline" onclick="'+goFn+'(-1)">←</button><button class="btn '+(isC?'btn-success':'btn-danger')+'" onclick="'+goFn+'(1)">'+(isC?'✓ 全对':'✗ 错了')+' →</button>';
  _multiSel[mode] = [];
  toast(isC?'✓ 全对!':'✗ 有选项错了，绿色=对');
};

// Speed mode
var speedQ = [], speedIdx = 0, speedScore = 0;
window.newRound = function(){
  var all = [].concat(DATA.recite.map(function(c){return Object.assign({},c,{from:'recite'})}), DATA.quiz, DATA.exam);
  if(!all.length){
    $('speedQ').textContent = '题库为空';
    return;
  }
  // shuffle
  for(var i=all.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = all[i]; all[i] = all[j]; all[j] = t;
  }
  speedQ = all.slice(0, 5);
  speedIdx = 0;
  speedScore = 0;
  speedStreak = 0;
  if(speedTimer) clearInterval(speedTimer);
  speedTimeLeft = 10;
  startSpeedTimer();
  showSpeed();
};

var speedTimer = null;
var speedTimeLeft = 10;
function startSpeedTimer(){
  updateTimerUI();
  speedTimer = setInterval(function(){
    speedTimeLeft--;
    updateTimerUI();
    if(speedTimeLeft <= 0){
      clearInterval(speedTimer);
      speedTimer = null;
      // 超时算错
      if(speedIdx < speedQ.length){
        var item = speedQ[speedIdx];
        item._wrong = true;
        showToast('⏰ 超时!');
        setTimeout(function(){ speedIdx++; showSpeed(); speedTimeLeft = 10; }, 800);
      }
    }
  }, 1000);
}
function updateTimerUI(){
  var box = $('speedTimerBox');
  var num = $('speedTimerNum');
  var bar = $('speedTimerBar');
  var idx = $('speedQIdx');
  if(!box || !num) return;
  if(speedTimeLeft > 0){
    box.style.display = 'block';
  }
  num.textContent = speedTimeLeft;
  var pct = (speedTimeLeft/10)*100;
  bar.style.width = pct + '%';
  if(idx) idx.textContent = speedIdx + 1;
  // 颜色变化：绿色→黄色→红色
  if(speedTimeLeft <= 3){
    num.style.color = '#dc2626';
    num.style.transform = 'scale(1.15)';
    bar.style.background = '#dc2626';
    // 闪烁效果：交替缩放
    if(speedTimeLeft <= 2){
      num.style.animation = 'none';
      num.offsetHeight; // reflow
      num.style.animation = 'pulse 0.5s ease-in-out infinite';
    }
  } else if(speedTimeLeft <= 6){
    num.style.color = '#d69e2e';
    num.style.transform = 'scale(1.05)';
    bar.style.background = '#d69e2e';
    num.style.animation = 'none';
  } else {
    num.style.color = '#059669';
    num.style.transform = 'scale(1)';
    bar.style.background = '#059669';
    num.style.animation = 'none';
  }
}
function showSpeed(){
  if(speedIdx >= speedQ.length){
    if(speedTimer){ clearInterval(speedTimer); speedTimer = null; }
    // 隐藏大号计时器
    var tbox = $('speedTimerBox');
    if(tbox) tbox.style.display = 'none';
    $('speedQ').innerHTML = '<div style="text-align:center"><div style="font-size:32px;font-weight:700;color:#059669">完成!</div><div>答对'+(5-speedQ.filter(function(q){return q._wrong;}).length)+'/5题 · 连对'+speedStreak+'</div></div>';
    $('speedChoices').innerHTML = '';
    $('speedScore').textContent = '连对'+speedStreak;
    if(speedStreak > speedBest) speedBest = speedStreak;
    saveState();
    return;
  }
  var item = speedQ[speedIdx];
  $('speedTag').textContent = (item.sec||'').slice(0,12);
  $('speedScore').textContent = '本轮: ' + (5 - speedQ.filter(function(q){return q._wrong;}).length)*10 + '分';
  $('speedQ').textContent = item.q;
  var choices;
  if(item.from === 'recite'){
    // 生成4个选项：1个正确+3个其他
    var others = DATA.recite.filter(function(c){return c.id !== item.id;});
    var wrong = [];
    var seen = {};
    for(var i=0;i<others.length && wrong.length<3;i++){
      var w = others[i].a;
      if(w && w.length>5 && !seen[w]){ wrong.push(w); seen[w]=true; }
    }
    choices = [item.a].concat(wrong);
    // shuffle
    for(var i=choices.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = choices[i]; choices[i] = choices[j]; choices[j] = t;
    }
  } else {
    choices = item.choices || ['A','B','C','D'];
  }
  var html = '';
  for(var j=0;j<choices.length;j++){
    html += '<div class="choice" data-idx="'+j+'" onclick="pickSpd(this,'+j+')"><span class="pre">'+('ABCD'[j])+'.</span>'+escapeHTML(choices[j])+'</div>';
  }
  $('speedChoices').innerHTML = html;
}
window.pickSpd = function(el, idx){
  var item = speedQ[speedIdx];
  if(!item) return;
  var isCorrect = false;
  if(item.from === 'recite'){
    var picked = el.textContent.replace(/^[A-D]\.\s*/,'');
    isCorrect = (picked === item.a);
  } else if(Array.isArray(item.answer)){
    isCorrect = item.answer.indexOf(idx) >= 0;
  } else {
    isCorrect = (idx === item.answer);
  }
  var all = el.parentElement.querySelectorAll('.choice');
  for(var i=0;i<all.length;i++) all[i].style.pointerEvents='none';
  if(item.from === 'recite'){
    for(var i=0;i<all.length;i++){
      var txt = all[i].textContent.replace(/^[A-D]\.\s*/,'');
      if(txt === item.a) all[i].classList.add('correct');
    }
  } else {
    var correct = item.answer;
    for(var i=0;i<all.length;i++){
      if(Array.isArray(correct)){ if(correct.indexOf(i)>=0) all[i].classList.add('reveal-correct'); }
      else { if(i===correct) all[i].classList.add('reveal-correct'); }
    }
  }
  if(!isCorrect){ el.classList.add('wrong'); item._wrong = true; }
  else { speedStreak++; if(speedStreak > speedBest) speedBest = speedStreak; }
  toast(isCorrect ? '✓ 答对了!' : '✗ 错了');
  saveState();
  // 答完停计时, 下一题时重置
  if(speedTimer){ clearInterval(speedTimer); speedTimer = null; }
  setTimeout(function(){ speedIdx++; speedTimeLeft = 10; startSpeedTimer(); showSpeed(); }, isCorrect ? 500 : 1500);
};
window.resetSpeed = function(){
  speedBest = 0;
  $('speedScore').textContent = '0分';
  saveState();

var REVIEW_INTERVALS = {easy: 24*60*60*1000, ok: 2*60*60*1000, hard: 10*60*1000};
// 重写 markR 加入间隔复习
var _origMarkR = window.markR;
window.markR = function(status){
  var list = getListR ? getListR() : getList('recite');
  var item = list[state.r];
  if(!item) return;
  var now = Date.now();
  var nextReview = now + (REVIEW_INTERVALS[status] || 0);
  setH('rh', item.id, {status:status, last:now, nextReview:nextReview});
  // 自动折叠
  var area = $('reciteAnswerArea'), actions = $('reciteActions');
  if(area) area.style.display = 'none';
  if(actions) actions.style.display = 'none';
  // 记住了→自动跳
  if(status==='easy'){ goRecite(1); updateDailyPlan(); return; }
  // 更新进度
  var list2 = getListR ? getListR() : getList('recite');
  var pct = list2.length ? ((state.r+1)/list2.length*100) : 0;
  $('reciteBar').style.width = pct+'%';
  $('reciteCount').textContent = (state.r+1)+'/'+list2.length;
  toast(status==='hard' ? '标记：不熟' : '标记：还行');
  updateDailyPlan();

// 背诵时优先展示到期卡片
function getListR(){
  var data = DATA.recite||[];
  var sec = state.rs;
  var list = sec==='all' ? data : data.filter(function(d){return d.sec===sec;});
  if(filterUnmastered){
    list = list.filter(function(d){return getH('rh',d.id).status!=='easy';});
  }
  // 智能排序：过期优先 > 未学过 > 未来复习
  var now = Date.now();
  list.sort(function(a,b){
    var ha = getH('rh',a.id), hb = getH('rh',b.id);
    var aOver = ha.nextReview && ha.nextReview <= now ? 0 : (ha.nextReview ? 2 : 1);
    var bOver = hb.nextReview && hb.nextReview <= now ? 0 : (hb.nextReview ? 2 : 1);
    return aOver - bOver;
  });
  return list;
}

var DEADLINE = new Date(2026,7,7); // 8月7日
function updateDailyPlan(){
  var now = new Date();
  var daysLeft = Math.max(1, Math.ceil((DEADLINE - now)/86400000));
  var reciteTotal = DATA.recite.length;
  var quizTotal = DATA.quiz.length;
  var examTotal = DATA.exam.length;
  // 今日目标
  var reciteGoal = Math.ceil(reciteTotal / daysLeft);
  var quizGoal = Math.ceil(quizTotal / daysLeft);
  var examGoal = Math.ceil(examTotal / daysLeft);
  // 今日已完成
  var today = now.toDateString();
  var todayDone = 0;
  var reciteDone = 0, quizDone = 0, examDone = 0;
  for(var k in state.rh){
    var h = state.rh[k];
    if(h.status==='easy') reciteDone++;
    if(h.last && new Date(h.last).toDateString()===today) todayDone++;
  }
  for(var k in state.qh){
    if(state.qh[k].last && new Date(state.qh[k].last).toDateString()===today){
      quizDone++; todayDone++;
    }
  }
  for(var k in state.eh){
    if(state.eh[k].last && new Date(state.eh[k].last).toDateString()===today){

    }
  }

var autoFlowActive = false;

  {name:'复习错题', type:'retry', icon:'🔁'},
  {name:'背诵新卡', type:'recite', icon:'📖'},

  $('autoFlowBtn').style.opacity = '.7';
  $('autoFlowStatus').style.display = 'block';
  runAutoPhase();
};
function runAutoPhase(){
  if(!autoFlowActive){ resetAutoFlow(); return; }
  if(autoFlowPhase >= autoFlowPhases.length){
    $('autoFlowStatus').textContent = '✅ 今日学习完成! 太棒了!';
    resetAutoFlow();

  }
  var phase = autoFlowPhases[autoFlowPhase];
  $('autoFlowStatus').textContent = phase.icon+' 阶段 '+(autoFlowPhase+1)+'/4: '+phase.name;
  if(phase.type==='retry'){
    // 快速过一遍错题(如果有)
    goTab('quiz');
    retryWrong('quiz');
    // 2秒后自动下一阶段(简化版)
    setTimeout(function(){ autoFlowPhase++; runAutoPhase(); }, 2000);
  } else if(phase.type==='recite'){
    goTab('recite');

    setTimeout(function(){
      if(autoFlowActive){ autoFlowPhase++; runAutoPhase(); }

    goTab(phase.type);
    setTimeout(function(){
      if(autoFlowActive){ autoFlowPhase++; runAutoPhase(); }
    }, 180000);
  }
}

window.retryWrong = function(mode){
  var list = mode==='quiz' ? DATA.quiz : DATA.exam;
  var hkey = mode==='quiz' ? 'qh' : 'eh';
  var wrongIds = [];
  for(var i=0;i<list.length;i++){
    var h = getH(hkey, list[i].id);
    if(h.wrong > 0) wrongIds.push(i);
  }
  if(!wrongIds.length){ toast('没有错题，继续加油!'); return; }
  // 临时替换列表为错题子集
  if(mode==='quiz'){
    state._origQS = state.qs; state._origQ = state.q;
    state.qs = '__wrong__'; state.q = 0;
    state._wrongCache = wrongIds;
  } else {
    state._origES = state.es; state._origE = state.e;
    state.es = '__wrong__'; state.e = 0;
    state._wrongCache = wrongIds;
  }
  renderTab(mode);
  toast('错题重练: '+wrongIds.length+'题');
};
// 重写 getList 支持错题模式
var _getList = getList;
getList = function(type){
  if(type==='recite') return getListR();
  if(type==='quiz' && state.qs==='__wrong__'){
    return state._wrongCache.map(function(i){return DATA.quiz[i];});
  }
  if(type==='exam' && state.es==='__wrong__'){
    return state._wrongCache.map(function(i){return DATA.exam[i];});
  }
  return _getList(type);
};
// 退出错题模式
function exitWrong(mode){
  if(mode==='quiz' && state.qs==='__wrong__'){
    state.qs = state._origQS || 'all'; state.q = state._origQ || 0;
    delete state._origQS; delete state._origQ; delete state._wrongCache;
  }
  if(mode==='exam' && state.es==='__wrong__'){
    state.es = state._origES || 'all'; state.e = state._origE || 0;
    delete state._origES; delete state._origE; delete state._wrongCache;
  }
  renderTab(mode);
}

var shuffleOn = false;

  state.r = 0;
  renderTab("recite");
  toast(shuffleOn ? "乱序模式" : "顺序模式");
};
var __getListR = getListR;
var _shuffledCache = null;
var _shuffleKey = '';
getListR = function(){
  var list = __getListR();
  if(shuffleOn && list.length > 1){
    // 缓存乱序结果，key=当前节+过滤状态，只在切换时重新洗牌
    var key = state.rs + '|' + (filterUnmastered?'1':'0');
    if(_shuffledCache && _shuffleKey === key && _shuffledCache.length === list.length){
      // 验证缓存中的ID还在当前列表中
      var valid = true;
      var ids = {};
      for(var i=0;i<list.length;i++) ids[list[i].id] = true;
      for(var i=0;i<_shuffledCache.length;i++){
        if(!ids[_shuffledCache[i].id]){ valid = false; break; }
      }
      if(valid) return _shuffledCache;
    }
    // 重新生成乱序
    _shuffledCache = list.slice();
    for(var i=_shuffledCache.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=_shuffledCache[i];_shuffledCache[i]=_shuffledCache[j];_shuffledCache[j]=t;
    }
    _shuffleKey = key;
    return _shuffledCache;
  }
  _shuffledCache = null;
  return list;
};

  var html="";
  Object.keys(ch).sort().forEach(function(sec){
    var c=ch[sec],pct=c.total?Math.round(c.mastered/c.total*100):0;
    var color=pct>=80?"#059669":(pct>=50?"#d97706":"#dc2626");
    var emoji=pct>=80?"\uD83D\uDFE2":(pct>=50?"\uD83D\uDFE1":"\uD83D\uDD34");
    html+="<div style=\"display:flex;align-items:center;margin-bottom:4px;font-size:11px\">";
    html+="<span style=\"width:18px;text-align:center\">"+emoji+"</span>";
    html+="<span style=\"flex:1;color:#475569\">"+sec+"</span>";
    html+="<span style=\"width:36px;text-align:right;font-weight:600;color:"+color+"\">"+pct+"%</span>";
    html+="<span style=\"width:72px;margin-left:4px\"><div style=\"height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden\"><div style=\"height:100%;width:"+pct+"%;background:"+color+";border-radius:2px\"></div></div></span>";
    html+="</div>";
  });
  el.innerHTML=html;
}


// === 滑动手势 ===
var swipeStartX = 0;
window.swipeStart = function(e){
  if(e.touches && e.touches.length===1) swipeStartX = e.touches[0].clientX;
};
window.swipeEnd = function(e){
  if(!e.changedTouches || e.changedTouches.length!==1) return;
  var dx = e.changedTouches[0].clientX - swipeStartX;
  var area = document.getElementById('reciteAnswerArea');
  var isOpen = area && area.style.display==='block';
  if(!isOpen) return; // 答案未翻开，不处理滑动
  if(dx > 80){ markR('easy'); }  // 右滑=记住了
  else if(dx < -80){ markR('hard'); } // 左滑=不熟
  swipeStartX = 0;
};
// 滑动时视觉反馈
var _origAddEvt = document.addEventListener;
document.addEventListener('touchmove', function(e){
  if(!e.target.closest('#reciteCard')) return;
  var area = document.getElementById('reciteAnswerArea');
  if(!area || area.style.display==='none') return;
  var dx = (e.touches[0].clientX - swipeStartX);
  var left = document.getElementById('swipeLeft');
  var right = document.getElementById('swipeRight');
  if(left) left.style.opacity = dx < -20 ? Math.min(1, Math.abs(dx)/80) : '0';
  if(right) right.style.opacity = dx > 20 ? Math.min(1, dx/80) : '0';
}, {passive:true});


window.init = function(){

  // 数据就绪
  $('speedQ').textContent = '已加载 '+DATA.recite.length+' 条背诵, ' + DATA.quiz.length + ' 题刷题, ' + DATA.exam.length + ' 题真题。点击"开始新一轮"';
  renderTab('recite');

  renderTab('exam');
}

})();
