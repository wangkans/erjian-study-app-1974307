<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>二建备考题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f8fa;--card:#fff;--primary:#2b6cb0;--primary-light:#ebf4ff;--success:#38a169;--danger:#e53e3e;--warning:#d69e2e;--text:#1a202c;--muted:#718096;--border:#e2e8f0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
/* Header */
.header{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.header h1{font-size:18px;font-weight:700}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.header .countdown{font-size:11px;opacity:.9;margin-top:1px;background:rgba(255,255,255,.15);display:inline-block;padding:2px 10px;border-radius:10px}
/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:99;overflow-x:auto}
.tab{flex:1 0 auto;text-align:center;padding:10px 8px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-width:55px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.tab .emoji{font-size:16px;display:block}
/* Panel */
.panel{display:none;padding:12px;max-width:640px;margin:0 auto}
.panel.active{display:block}
/* Stats */
.stats-bar{display:flex;gap:6px;margin-bottom:10px}
.stat-card{flex:1;background:var(--card);border-radius:10px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .num{font-size:18px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:10px;color:var(--muted);margin-top:2px}
.stat-card .num.good{color:var(--success)}
.stat-card .num.bad{color:var(--danger)}
/* Card */
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:18px;margin-bottom:10px;min-height:140px}
.card .q{font-size:15px;line-height:1.7;font-weight:500}
.card .a{font-size:14px;line-height:1.6;color:var(--text);display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.card .a.show{display:block}
.card .meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card .tag{display:inline-block;font-size:10px;background:var(--primary-light);color:var(--primary);padding:2px 7px;border-radius:4px}
.card .tip{font-size:11px;color:#d69e2e;background:#fffff0;padding:6px 10px;border-radius:6px;margin-top:8px;border-left:3px solid #d69e2e}
/* Choices */
.choices{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.choice{padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;line-height:1.5;cursor:pointer;transition:.15s;background:#fff;user-select:none}
.choice:active{transform:scale(.98)}
.choice.selected{border-color:var(--primary);background:var(--primary-light)}
.choice.correct{border-color:var(--success);background:#f0fff4}
.choice.wrong{border-color:var(--danger);background:#fff5f5}
.choice.reveal-correct{border-color:var(--success);background:#f0fff4}
.choice .prefix{font-weight:700;margin-right:4px;display:inline-block;width:18px}
/* Buttons */
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;padding:11px 10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;min-height:44px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-sm{padding:8px 10px;font-size:11px;min-height:36px;flex:0 0 auto}
.btn-block{width:100%;flex:none}
.actions>.btn{margin-bottom:4px}
/* Progress */
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;background:linear-gradient(90deg,var(--primary),#48bb78)}
.progress-text{font-size:11px;color:var(--muted);text-align:center}
/* Section picker */
.sec-row{display:flex;gap:5px;overflow-x:auto;padding:0 0 6px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.sec-btn{flex-shrink:0;padding:5px 13px;border:1px solid var(--border);border-radius:14px;font-size:11px;cursor:pointer;white-space:nowrap;background:#fff;transition:.15s}
.sec-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Speed mode */
.speed-stats{display:flex;gap:8px;margin:8px 0}
.speed-item{flex:1;text-align:center;background:var(--card);border-radius:8px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.speed-item .val{font-size:22px;font-weight:700;color:#e53e3e}
.speed-item .lbl{font-size:10px;color:var(--muted)}
.timer-bar{height:4px;background:#eee;border-radius:2px;transition:width .1s linear}
.timer-bar.urgent{background:var(--danger)}
/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none;max-width:90%}
/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:10px}
/* Highlight */
.highlight{background:#fefcbf;padding:1px 4px;border-radius:3px;font-weight:700}
/* Dark */
@media(prefers-color-scheme:dark){:root{--bg:#1a202c;--card:#2d3748;--text:#e2e8f0;--muted:#a0aec0;--border:#4a5568;--primary-light:#2a4365}.choice{background:#2d3748}.card .tip{background:#2d3748}}
</style>
</head>
<body>

<div class="header">
  <h1>📚 二建备考题库</h1>
  <div class="sub" id="dateDisplay"></div>
  <div class="countdown" id="countdownDisplay"></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="speed" onclick="switchTab('speed')"><span class="emoji">⚡</span>冲刺</div>
  <div class="tab" data-tab="recite" onclick="switchTab('recite')"><span class="emoji">📖</span>背诵 <span class="badge" id="reciteBadge" style="display:none">304</span></div>
  <div class="tab" data-tab="quiz" onclick="switchTab('quiz')"><span class="emoji">📝</span>刷题 <span class="badge" id="wrongBadge" style="display:none">0</span></div>
  <div class="tab" data-tab="exam" onclick="switchTab('exam')"><span class="emoji">📄</span>真题</div>
  <div class="tab" data-tab="progress" onclick="switchTab('progress')"><span class="emoji">📊</span>进度</div>
</div>

<!-- ⚡ 冲刺模式 -->
<div class="panel active" id="panel-speed">
  <div class="stats-bar" id="speedStats"></div>
  <div class="card" id="speedCard">
    <div class="meta"><span class="tag" id="speedTag">冲刺模式</span><span id="speedScore">本轮:0分</span></div>
    <div class="q" id="speedQ">加载中...</div>
    <div class="choices" id="speedChoices"></div>
  </div>
  <div class="timer-bar" id="speedTimer" style="width:100%;background:var(--success)"></div>
  <div class="progress-text" id="speedRound">第1题/本轮5题 · 倒计时10s</div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-outline btn-sm" onclick="resetSpeed()">🔄 重来</button>
    <button class="btn btn-primary btn-sm" onclick="startSpeedRound()">▶ 开始新一轮</button>
  </div>
  <div class="speed-stats" id="speedHistory" style="margin-top:8px"></div>
</div>

<!-- 📖 背诵面板 -->
<div class="panel" id="panel-recite">
  <div class="stats-bar" id="reciteStats"></div>
  <div class="sec-row" id="reciteSections"></div>
  <div class="card" id="reciteCard">
    <div class="meta"><span class="tag" id="reciteTag">加载中</span><span id="reciteIdx">0/0</span></div>
    <div class="q" id="reciteQ"></div>
    <div class="a" id="reciteA"></div>
  </div>
  <div class="actions">
    <button class="btn btn-outline" onclick="prevRecite()">←</button>
    <button class="btn btn-primary" onclick="toggleAnswer()" id="showAnsBtn">👁 看答案</button>
    <button class="btn btn-outline" onclick="nextRecite()">→</button>
  </div>
  <div class="actions">
    <button class="btn btn-sm btn-outline" onclick="markRecite('hard')">😣 不熟</button>
    <button class="btn btn-sm btn-outline" onclick="markRecite('ok')">🙂 还行</button>
    <button class="btn btn-sm btn-success" onclick="markRecite('easy')">😎 记住了</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="reciteProgress" style="width:0%"></div></div>
  <div class="progress-text" id="reciteProgressText"></div>
</div>

<!-- 📝 刷题 -->
<div class="panel" id="panel-quiz">
  <div class="stats-bar" id="quizStats"></div>
  <div class="sec-row" id="quizSections"></div>
  <div class="card" id="quizCard">
    <div class="meta"><span class="tag" id="quizTag"></span><span id="quizIdx">0/0</span></div>
    <div class="q" id="quizQ"></div>
    <div class="choices" id="quizChoices"></div>
  </div>
  <div class="actions" id="quizActions"></div>
  <div class="progress-bar"><div class="progress-fill" id="quizProgress" style="width:0%"></div></div>
</div>

<!-- 📄 真题 -->
<div class="panel" id="panel-exam">
  <div class="stats-bar" id="examStats"></div>
  <div class="sec-row" id="examSections"></div>
  <div class="card" id="examCard">
    <div class="meta"><span class="tag" id="examTag"></span><span id="examIdx">0/0</span></div>
    <div class="q" id="examQ"></div>
    <div class="choices" id="examChoices"></div>
  </div>
  <div class="actions" id="examActions"></div>
  <div class="progress-bar"><div class="progress-fill" id="examProgress" style="width:0"></div></div>
</div>

<!-- 📊 进度 -->
<div class="panel" id="panel-progress">
  <div class="stats-bar" id="progressStats"></div>
  <div id="progressDetail"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const DB='ejian_v2';
const INLINE_DATA={"recite":[],"quiz":[],"exam":[]};
let state={recite:{list:[],idx:0,section:'all',history:{}},quiz:{list:[],idx:0,section:'all',history:{}},exam:{list:[],idx:0,section:'all',history:{}}};
let allData={recite:[],quiz:[],exam:[]};
let speedTimer=null,speedCountdown=0,speedStreak=0,speedTotal=0;

// ===== STORAGE =====
function saveState(){try{localStorage.setItem(DB,JSON.stringify({rHist:state.recite.history,qHist:state.quiz.history,eHist:state.exam.history,rIdx:state.recite.idx,rSec:state.recite.section,qIdx:state.quiz.idx,qSec:state.quiz.section,eIdx:state.exam.idx,eSec:state.exam.section,speedBest:document.getElementById('speedBest')?.textContent||''}))}catch(e){}}
function loadState(){try{let s=JSON.parse(localStorage.getItem(DB)||'{}');if(s.rHist)state.recite.history=s.rHist;if(s.qHist)state.quiz.history=s.qHist;if(s.eHist)state.exam.history=s.eHist;state.recite.idx=s.rIdx||0;state.recite.section=s.rSec||'all';state.quiz.idx=s.qIdx||0;state.quiz.section=s.qSec||'all';state.exam.idx=s.eIdx||0;state.exam.section=s.eSec||'all'}catch(e){}}
function getHistory(type,id){return state[type].history[id]||{status:'new',wrong:0,last:null}}
function setHistory(type,id,d){state[type].history[id]={...getHistory(type,id),...d};saveState()}

// ===== LOAD DATA =====
async function loadData(){
  try{
    let [q,e,r1,r2]=await Promise.all([
      fetch('quiz.json?'+Date.now()).then(r=>r.json()),
      fetch('exam.json?'+Date.now()).then(r=>r.json()),
      fetch('recite1.json?'+Date.now()).then(r=>r.json()),
      fetch('recite2.json?'+Date.now()).then(r=>r.json())
    ]);
    allData.recite=[...(r1||[]),...(r2||[])];allData.quiz=q||[];allData.exam=e||[]
  }catch(x){try{let r=await fetch('data.json?'+Date.now());let j=await r.json();allData.recite=j.recite||[];allData.quiz=j.quiz||[];allData.exam=j.exam||[]}catch(y){allData.recite=INLINE_DATA.recite||[];allData.quiz=INLINE_DATA.quiz||[];allData.exam=INLINE_DATA.exam||[]}}
  applyFilter('recite');applyFilter('quiz');applyFilter('exam');renderAll()
}

function getSections(type){let s=new Set();(allData[type]||[]).forEach(d=>{if(d.sec)s.add(d.sec)});return [...s].sort()}
function applyFilter(type){let sec=state[type].section,all=allData[type]||[];state[type].list=sec==='all'?all:all.filter(d=>d.sec===sec);if(state[type].idx>=state[type].list.length)state[type].idx=0}

function renderAll(){
  renderRecite();renderQuiz();renderExam();renderProgress();renderSpeed();
  saveState()
}

// ===== ⚡ SPEED MODE =====
function renderSpeed(){
  document.getElementById('speedStats').innerHTML=`<div class="stat-card"><div class="num good" id="speedBest">0</div><div class="label">最高连对</div></div><div class="stat-card"><div class="num">5</div><div class="label">每轮题数</div></div><div class="stat-card"><div class="num" id="speedAvg">-</div><div class="label">平均用时</div></div>`
}
function startSpeedRound(){
  speedStreak=0;speedTotal=0;speedCountdown=10;clearInterval(speedTimer);
  // Pick 5 random from all data
  let all=[...allData.recite.map(c=>({...c,from:'recite'})),...allData.quiz,...allData.exam];
  all.sort(()=>Math.random()-0.5);
  window._speedItems=all.slice(0,5);
  window._speedIdx=0;
  showSpeedQuestion()
}
function showSpeedQuestion(){
  let items=window._speedItems||[],i=window._speedIdx||0;
  if(i>=items.length){endSpeedRound();return}
  let item=items[i],isRecite=item.from==='recite';
  document.getElementById('speedTag').textContent=item.sec?(item.sec.slice(0,12):'冲刺');
  document.getElementById('speedQ').textContent=item.q;
  // Generate fake choices for recite cards
  let choices=item.choices||[];
  if(isRecite&&!choices.length){
    let other=[...allData.recite,...allData.quiz].filter(c=>c.q!==item.q);
    other.sort(()=>Math.random()-0.5);
    let wrong=[item.a];
    for(let c of other){if(wrong.length>=4)break;if(wrong.indexOf(c.a||'')<0)wrong.push(c.a||'无')}
    wrong.sort(()=>Math.random()-0.5);
    choices=wrong
  }
  if(!choices.length)choices=['A','B','C','D'];
  document.getElementById('speedChoices').innerHTML=choices.map((c,idx)=>`<div class="choice" data-idx="${idx}" onclick="pickSpeed(this,${idx})"><span class="prefix">${'ABCD'[idx]}.</span>${c}</div>`).join('');
  document.getElementById('speedScore').textContent=`本轮:${speedTotal-scoreCount()*10}分 · 连对${speedStreak}`;
  document.getElementById('speedRound').textContent=`第${i+1}题/本轮5题 · 倒计时10s`;
  speedCountdown=10;
  updateSpeedTimer()
}
function scoreCount(){return window._speedItems?.filter(it=>it._wrong).length||0}
function pickSpeed(el,idx){
  let items=window._speedItems,i=window._speedIdx,item=items[i];
  let correct=item.answer!==undefined?item.answer:(item.a?0:0);
  let isRecite=item.from==='recite';
  let correctVal=isRecite?(item.a||''):(Array.isArray(correct)?correct:[correct])[0];
  let picked=item.choices?item.choices[idx]:(el.textContent.replace(/^[A-D]\.\s*/,''));
  let isCorrect;
  if(isRecite)isCorrect=picked===correctVal;
  else if(Array.isArray(correct))isCorrect=correct.includes(idx);
  else isCorrect=idx===correct;
  
  let all=el.parentElement.querySelectorAll('.choice');
  all.forEach(c=>c.style.pointerEvents='none');
  if(isRecite)all.forEach(c=>{c.classList.add('reveal-correct');if(c.textContent.replace(/^[A-D]\.\s*/,'')===correctVal)c.classList.add('correct')});
  else{all.forEach((c,ci)=>{if(Array.isArray(correct)?correct.includes(ci):ci===correct)c.classList.add('reveal-correct')})}
  if(!isCorrect){el.classList.add('wrong');item._wrong=true}
  else{item._wrong=false;speedStreak++}
  speedTotal++;
  clearInterval(speedTimer);
  showToast(isCorrect?'✓':'✗');
  setTimeout(()=>{window._speedIdx++;showSpeedQuestion()},isCorrect?400:1200)
}
function endSpeedRound(){
  clearInterval(speedTimer);
  let wrong=scoreCount(),score=50-wrong*10;
  document.getElementById('speedQ').textContent='⚡ 本轮结束!';
  document.getElementById('speedChoices').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:36px;font-weight:700;color:${score>=40?'var(--success)':'var(--danger)'}">${score}分</div><div>答对${5-wrong}题/共5题 · 最高连对${speedStreak}</div></div>`;
  document.getElementById('speedScore').textContent=`连对${speedStreak}题`;
  document.getElementById('speedRound').textContent='点击"开始新一轮"继续';
  document.getElementById('speedTimer').style.width='100%';
  document.getElementById('speedTimer').style.background='var(--success)';
  if(speedStreak>parseInt(document.getElementById('speedBest')?.textContent||'0'))document.getElementById('speedBest').textContent=speedStreak;
  saveState()
}
function updateSpeedTimer(){
  document.getElementById('speedTimer').style.width=(speedCountdown/10*100)+'%';
  if(speedCountdown<=3)document.getElementById('speedTimer').classList.add('urgent');
  else document.getElementById('speedTimer').classList.remove('urgent');
  speedCountdown--;
  if(speedCountdown<0){clearInterval(speedTimer);window._speedIdx++;showSpeedQuestion()}
}
function resetSpeed(){let b=document.getElementById('speedBest');if(b)b.textContent='0';saveState()}

// ===== RECITE =====
function renderReciteSections(){
  let el=document.getElementById('reciteSections'),all=allData.recite||[],secs=getSections('recite');
  el.innerHTML=['all',...secs].map(s=>{let cnt=s==='all'?all.length:all.filter(d=>d.sec===s).length;return`<div class="sec-btn ${state.recite.section===s?'active':''}" onclick="sR('${s}')">${s==='all'?'全部':s} ${cnt}</div>`}).join('');
  document.getElementById('reciteBadge').textContent=all.length;
  updateReciteStats()
}
function renderRecite(){
  let list=state.recite.list,idx=state.recite.idx;
  if(!list.length){document.getElementById('reciteCard').innerHTML='<div class="empty"><div class="icon">📭</div><p>该分类暂无</p></div>';return}
  let item=list[idx],total=list.length;
  document.getElementById('reciteTag').textContent=(item.sec||'')+(item.sub?' · '+item.sub:'');
  document.getElementById('reciteIdx').textContent=`${idx+1}/${total}`;
  document.getElementById('reciteQ').textContent=item.q;
  document.getElementById('reciteA').textContent=item.a;
  document.getElementById('reciteA').classList.remove('show');
  document.getElementById('showAnsBtn').textContent='👁 看答案';
  document.getElementById('reciteProgress').style.width=(total?(idx+1)/total*100:0)+'%';
  document.getElementById('reciteProgressText').textContent=`第${idx+1}/${total}题 · 已记${Object.values(state.recite.history).filter(h=>h.status==='easy').length}`
}
function updateReciteStats(){
  let all=state.recite.list.length,done=Object.values(state.recite.history).filter(h=>h.status==='easy').length;
  document.getElementById('reciteStats').innerHTML=`<div class="stat-card"><div class="num">${all}</div><div class="label">总题</div></div><div class="stat-card"><div class="num good">${done}</div><div class="label">已记</div></div><div class="stat-card"><div class="num">${all-done}</div><div class="label">待背</div></div>`
}
function toggleAnswer(){let el=document.getElementById('reciteA');el.classList.toggle('show');document.getElementById('showAnsBtn').textContent=el.classList.contains('show')?'🙈 隐藏':'👁 看答案'}
function prevRecite(){if(state.recite.idx>0){state.recite.idx--;renderRecite();saveState()}}
function nextRecite(){if(state.recite.idx<state.recite.list.length-1){state.recite.idx++;renderRecite();saveState()}else showToast('🎉 最后一张')}
function markRecite(status){
  let item=state.recite.list[state.recite.idx];if(!item)return;
  setHistory('recite',item.id,{status,last:Date.now()});
  updateReciteStats();renderRecite();if(status==='easy')setTimeout(nextRecite,300)
}
function sR(sec){state.recite.section=sec;state.recite.idx=0;applyFilter('recite');renderReciteSections();renderRecite();saveState()}

// ===== QUIZ =====
function renderQuizSections(){
  let el=document.getElementById('quizSections'),all=allData.quiz||[],secs=getSections('quiz');
  el.innerHTML=['all',...secs].map(s=>{let cnt=s==='all'?all.length:all.filter(d=>d.sec===s).length;return`<div class="sec-btn ${state.quiz.section===s?'active':''}" onclick="sQ('${s}')">${s==='all'?'全部':s} ${cnt}</div>`}).join('');
  updateQuizStats()
}
function renderQuiz(){
  let list=state.quiz.list,idx=state.quiz.idx;
  if(!list.length){document.getElementById('quizCard').innerHTML='<div class="empty"><div class="icon">📭</div><p>暂无</p></div>';return}
  let item=list[idx],total=list.length,multi=Array.isArray(item.answer);
  document.getElementById('quizTag').textContent=(item.sec||'')+(multi?' · 多选题':'');
  document.getElementById('quizIdx').textContent=`${idx+1}/${total}`;
  document.getElementById('quizQ').textContent=item.q;
  let ce=document.getElementById('quizChoices'),ch=item.choices||[],ha=multi?'tQ':'pQ';
  ce.innerHTML=ch.map((c,i)=>`<div class="choice" data-idx="${i}" onclick="${ha}(this,${i},'quiz')"><span class="prefix">${'ABCDEFGH'[i]}.</span>${c}</div>`).join('');
  if(multi)ce.innerHTML+=`<div class="card tip">💡 多选题策略：不确定就只选最确定的2个，保险拿一半分</div><div style="margin-top:8px"><button class="btn btn-primary btn-block" onclick="sM('quiz')">✓ 提交</button></div>`;
  document.getElementById('quizActions').innerHTML=`<button class="btn btn-outline" onclick="prevQuiz()">←</button><button class="btn btn-primary" onclick="nextQuiz()">→</button>`;
  document.getElementById('quizProgress').style.width=(total?(idx+1)/total*100:0)+'%'
}
function updateQuizStats(){
  let all=state.quiz.list.length,done=Object.keys(state.quiz.history).length,wrong=Object.values(state.quiz.history).filter(h=>h.wrong>0).length;
  document.getElementById('quizStats').innerHTML=`<div class="stat-card"><div class="num">${all}</div><div class="label">总题</div></div><div class="stat-card"><div class="num good">${done}</div><div class="label">已答</div></div><div class="stat-card"><div class="num bad">${wrong}</div><div class="label">错题</div></div>`;
  let b=document.getElementById('wrongBadge');if(wrong>0){b.textContent=wrong;b.style.display='inline-block'}else b.style.display='none'
}
function pQ(el,idx,mode){if(mode==='multi')return;let item=state.quiz.list[state.quiz.idx];if(!item)return;let all=el.parentElement.querySelectorAll('.choice:not([style*="display"])'),correct=item.answer;all.forEach(c=>c.style.pointerEvents='none');all.forEach(c=>c.classList.remove('selected'));el.classList.add('selected');let isC=idx===correct;all.forEach((c,i)=>{if(i===correct)c.classList.add('reveal-correct');if(i===idx&&!isC)c.classList.add('wrong')});setHistory('quiz',item.id,{wrong:getHistory('quiz',item.id).wrong+(isC?0:1),last:Date.now()});updateQuizStats();document.getElementById('quizActions').innerHTML=`<button class="btn btn-outline" onclick="prevQuiz()">←</button><button class="btn ${isC?'btn-success':'btn-danger'}" onclick="nextQuiz()">${isC?'✓ 正确':'✗ 错了'} →</button>`}
let _ms={quiz:new Set(),exam:new Set()};
function tQ(el,idx,mode){el.classList.toggle('selected');let s=_ms[mode];if(s.has(idx))s.delete(idx);else s.add(idx)}
function sM(mode){
  let list=state[mode].list,item=list[state[mode].idx];if(!item||!Array.isArray(item.answer))return;
  let correct=item.answer,selected=[..._ms[mode]].sort(),parent=document.querySelector('#'+mode+'Choices'),all=parent.querySelectorAll('.choice');
  all.forEach(c=>c.style.pointerEvents='none');
  all.forEach((c,i)=>{if(correct.includes(i))c.classList.add('reveal-correct');if(selected.includes(i)&&!correct.includes(i))c.classList.add('wrong')});
  let isC=selected.length===correct.length&&selected.every(v=>correct.includes(v));
  setHistory(mode,item.id,{wrong:getHistory(mode,item.id).wrong+(isC?0:1),last:Date.now()});
  if(mode==='quiz')updateQuizStats();else updateExamStats();
  document.getElementById(mode+'Actions').innerHTML=`<button class="btn btn-outline" onclick="prev${mode==='quiz'?'Quiz':'Exam'}()">←</button><button class="btn ${isC?'btn-success':'btn-danger'}" onclick="next${mode==='quiz'?'Quiz':'Exam'}()">${isC?'✓':'✗'} →</button>`;
  let el=document.querySelector('#submitMultiBtn_'+mode);if(el)el.style.display='none';
  showToast(isC?'✓ 全对!':'✗ 有误，绿色=正确答案')
}
function prevQuiz(){if(state.quiz.idx>0){state.quiz.idx--;renderQuiz();saveState()}}
function nextQuiz(){if(state.quiz.idx<state.quiz.list.length-1){state.quiz.idx++;renderQuiz();saveState()}else showToast('🎉 完成!')}
function sQ(sec){state.quiz.section=sec;state.quiz.idx=0;applyFilter('quiz');renderQuizSections();renderQuiz();saveState()}

// ===== EXAM =====
function renderExamSections(){
  let el=document.getElementById('examSections'),all=allData.exam||[],secs=getSections('exam');
  el.innerHTML=['all',...secs].map(s=>{let cnt=s==='all'?all.length:all.filter(d=>d.sec===s).length;return`<div class="sec-btn ${state.exam.section===s?'active':''}" onclick="sE('${s}')">${s==='all'?'全部':s} ${cnt}</div>`}).join('');
  updateExamStats()
}
function renderExam(){
  let list=state.exam.list,idx=state.exam.idx;
  if(!list.length){document.getElementById('examCard').innerHTML='<div class="empty"><div class="icon">📭</div><p>暂无真题</p></div>';return}
  let item=list[idx],total=list.length,multi=Array.isArray(item.answer);
  document.getElementById('examTag').textContent=(item.sec||'')+(multi?' · 多选':'');
  document.getElementById('examIdx').textContent=`${idx+1}/${total}`;
  document.getElementById('examQ').textContent=item.q;
  let ce=document.getElementById('examChoices'),ch=item.choices||[],ha=multi?'tQ':'pE';
  ce.innerHTML=ch.map((c,i)=>`<div class="choice" data-idx="${i}" onclick="${ha}(this,${i},'exam')"><span class="prefix">${'ABCDEFGH'[i]}.</span>${c}</div>`).join('');
  if(multi)ce.innerHTML+=`<div class="card tip">💡 多选题策略：不确定就只选最确定的2个，保险拿一半分</div><div style="margin-top:8px"><button class="btn btn-primary btn-block" onclick="sM('exam')">✓ 提交</button></div>`;
  document.getElementById('examActions').innerHTML=`<button class="btn btn-outline" onclick="prevExam()">←</button><button class="btn btn-primary" onclick="nextExam()">→</button>`;
  document.getElementById('examProgress').style.width=(total?(idx+1)/total*100:0)+'%'
}
function updateExamStats(){
  let all=state.exam.list.length,done=Object.keys(state.exam.history).length,wrong=Object.values(state.exam.history).filter(h=>h.wrong>0).length;
  document.getElementById('examStats').innerHTML=`<div class="stat-card"><div class="num">${all}</div><div class="label">总题</div></div><div class="stat-card"><div class="num good">${done}</div><div class="label">已答</div></div><div class="stat-card"><div class="num bad">${wrong}</div><div class="label">错题</div></div>`
}
function pE(el,idx,mode){if(mode==='multi')return;let item=state.exam.list[state.exam.idx];if(!item)return;let all=el.parentElement.querySelectorAll('.choice:not([style*="display"])'),correct=item.answer;all.forEach(c=>c.style.pointerEvents='none');all.forEach(c=>c.classList.remove('selected'));el.classList.add('selected');let isC=idx===correct;all.forEach((c,i)=>{if(i===correct)c.classList.add('reveal-correct');if(i===idx&&!isC)c.classList.add('wrong')});setHistory('exam',item.id,{wrong:getHistory('exam',item.id).wrong+(isC?0:1),last:Date.now()});updateExamStats();document.getElementById('examActions').innerHTML=`<button class="btn btn-outline" onclick="prevExam()">←</button><button class="btn ${isC?'btn-success':'btn-danger'}" onclick="nextExam()">${isC?'✓':'✗'} →</button>`}
function prevExam(){if(state.exam.idx>0){state.exam.idx--;renderExam();saveState()}}
function nextExam(){if(state.exam.idx<state.exam.list.length-1){state.exam.idx++;renderExam();saveState()}else showToast('🎉 完成!')}
function sE(sec){state.exam.section=sec;state.exam.idx=0;applyFilter('exam');renderExamSections();renderExam();saveState()}

// ===== PROGRESS =====
function renderProgress(){
  let rT=allData.recite.length,qT=allData.quiz.length,eT=allData.exam.length;
  let rD=Object.values(state.recite.history).filter(h=>h.status==='easy').length,qD=Object.keys(state.quiz.history).length,eD=Object.keys(state.exam.history).length;
  let qW=Object.values(state.quiz.history).filter(h=>h.wrong>0).length;
  document.getElementById('progressStats').innerHTML=`<div class="stat-card"><div class="num good">${rD}/${rT}</div><div class="label">背诵</div></div><div class="stat-card"><div class="num">${qD}/${qT}</div><div class="label">刷题</div></div><div class="stat-card"><div class="num bad">${qW}</div><div class="label">错题</div></div>`;
  let h='<div style="background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)"><h3 style="font-size:14px;margin-bottom:10px">📋 各模块详情</h3>';
  ['recite','quiz','exam'].forEach(type=>{
    let label={recite:'背诵',quiz:'刷题',exam:'真题'}[type],data=allData[type]||[],secs=getSections(type);
    secs.forEach(sec=>{
      let items=data.filter(d=>d.sec===sec),total=items.length,done=0,wrong=0;
      if(type==='recite')done=items.filter(d=>getHistory(type,d.id).status==='easy').length;
      else{done=items.filter(d=>getHistory(type,d.id).last).length;wrong=items.filter(d=>(getHistory(type,d.id).wrong||0)>0).length}
      let pct=total?Math.round(done/total*100):0;
      h+=`<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${label}·${sec}</span><span>${done}/${total}${wrong?` <span style="color:var(--danger)">错${wrong}</span>`:''}</span></div><div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:2px 0"><div style="height:100%;width:${pct}%;background:${pct<40?'var(--danger)':pct<80?'var(--warning)':'var(--success)'}"></div></div></div>`
    })
  });
  h+=`<button class="btn btn-outline btn-block" style="margin-top:10px" onclick="reviewWrong()">🔁 复习错题</button></div>`;
  document.getElementById('progressDetail').innerHTML=h
}
function reviewWrong(){
  let wrong=[];['quiz','exam'].forEach(type=>{(allData[type]||[]).forEach(d=>{if((getHistory(type,d.id).wrong||0)>0)wrong.push({...d,from:type})})});
  if(!wrong.length){showToast('🎉 没有错题!');return}
  let f=wrong[0];switchTab(f.from==='exam'?'exam':'quiz');applyFilter(f.from);
  let idx=state[f.from].list.findIndex(d=>d.id===f.id);if(idx>=0){state[f.from].idx=idx;f.from==='exam'?renderExam():renderQuiz()}
}

// ===== TABS =====
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  let tab=document.querySelector(`.tab[data-tab="${name}"]`);if(tab)tab.classList.add('active');
  let panel=document.getElementById(`panel-${name}`);if(panel)panel.classList.add('active')
}

// ===== TOAST =====
let toastTimer;
function showToast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display='none'},1500)}

// ===== DATE =====
function updateDate(){
  let d=new Date(),opts={year:'numeric',month:'long',day:'numeric',weekday:'long'};
  document.getElementById('dateDisplay').textContent='截止 2026.08.07 · '+d.toLocaleDateString('zh-CN',opts);
  let dl=new Date(2026,7,7),diff=dl-d,days=Math.ceil(diff/(86400000)),hrs=Math.floor((diff%(86400000))/3600000);
  document.getElementById('countdownDisplay').textContent=days>0?`⏳ 还剩 ${days}天${hrs}小时`:'📌 已到截止'
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded',()=>{updateDate();loadState();loadData();renderSpeed()})
</script>
</body>
</html>
